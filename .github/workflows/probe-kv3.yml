name: probe kv3

# Answers ONE question: does VRF already give us a usable KV3 text serializer,
# or does dl-patch have to ship its own?
#
# No CSDK, no Windows runner, no game install. Delete this workflow once
# FINDINGS.md records the answer.

on:
  workflow_dispatch:
    inputs:
      name_filter:
        description: "Substring the vdata filename must contain (blank = any)"
        required: false
        default: "hero"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # --no-checkout + blobless: we get the full file INDEX without
      # downloading any content. Nothing is guessed about the layout.
      - name: Clone index only
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/SteamDatabase/GameTracking-Deadlock.git gt

      - name: Report the tree layout
        run: |
          set -euo pipefail
          cd gt
          echo "=== top level ==="
          git ls-tree --name-only HEAD
          echo
          echo "=== all vdata-ish paths (first 100) ==="
          git ls-tree -r --name-only HEAD | grep -i 'vdata' | head -100 || echo "(none)"
          echo
          echo "=== total vdata-ish count ==="
          git ls-tree -r --name-only HEAD | grep -ci 'vdata' || true

      - name: Pick an input
        id: locate
        run: |
          set -euo pipefail
          cd gt
          FILTER="${{ github.event.inputs.name_filter }}"

          # Prefer uncompiled .vdata; fall back to .vdata_c only to report that
          # the repo ships compiled files, which is itself a finding.
          CANDS=$(git ls-tree -r --name-only HEAD | grep -i '\.vdata$' || true)
          KIND="source"
          if [ -z "$CANDS" ]; then
            CANDS=$(git ls-tree -r --name-only HEAD | grep -i '\.vdata_c$' || true)
            KIND="compiled"
          fi

          if [ -z "$CANDS" ]; then
            echo "::error::no .vdata or .vdata_c anywhere in the repo index"
            echo "::error::record the layout printed above in FINDINGS"
            exit 4
          fi

          if [ -n "$FILTER" ]; then
            NARROW=$(printf '%s\n' "$CANDS" | grep -i -- "$FILTER" || true)
            [ -n "$NARROW" ] && CANDS="$NARROW"
          fi

          PICK=$(printf '%s\n' "$CANDS" | head -1)
          echo "kind=$KIND"
          echo "picked $PICK"

          if [ "$KIND" = "compiled" ]; then
            echo "::warning::only compiled .vdata_c present — VRF will be asked to read a compiled resource, which is a DIFFERENT question from source KV3 round-tripping. Record this distinction."
          fi

          git sparse-checkout init --no-cone
          git sparse-checkout set "$PICK"
          git checkout HEAD -- "$PICK" || git checkout

          if [ ! -f "$PICK" ]; then
            echo "::error::sparse checkout did not materialise $PICK"
            exit 4
          fi

          ls -la "$PICK"
          echo "path=gt/$PICK" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Build probe
        run: dotnet build src/Deadlock.Probe.Kv3/Deadlock.Probe.Kv3.csproj -c Release

      - name: Run probe
        run: |
          dotnet run --no-build -c Release \
            --project src/Deadlock.Probe.Kv3/Deadlock.Probe.Kv3.csproj \
            -- "${{ steps.locate.outputs.path }}" probe-out

      - name: Copy the original alongside the output
        if: always()
        run: |
          mkdir -p probe-out
          cp "${{ steps.locate.outputs.path }}" probe-out/original.vdata || true
          echo "input kind: ${{ steps.locate.outputs.kind }}" > probe-out/input-kind.txt

      - name: Report to summary
        if: always()
        run: cat probe-out/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv3-probe
          path: probe-out/
