name: path smoke

# THE PATH GATE. Same chain as emit smoke, on a plan that carries paths.
#
#   examples/lane-path.mapplan.json
#     -> OUR emitter   -> t1 (keyvalues2_noids text)
#     -> dmxconvert    -> binary .vmap        <-- Valve judges it
#     -> dmxconvert    -> t2 (text)
#     -> OUR reader    -> census + verify     <-- the ROUTE survived
#
# WHAT IS BEING TESTED THAT NOTHING ELSE TESTS. dl_example.vmap holds path
# nodes as REFERENCES: 767 elements carry an id there, because every
# root-level element is listed both in CMapWorld's children and in
# CVisibilityMgr's nodes array, and two references force an id. This emitter
# leaves CVisibilityMgr's nodes empty, so each node is referenced once and
# stays INLINE, and no ids are needed. That is the bet. If dmxconvert accepts
# inline CMapPathNode children, paths cost no GUID machinery at all.
#
# It also asserts NO ids are emitted. That assertion is the load-bearing one:
# the moment something in this emitter is referenced twice, keyvalues2_noids
# starts writing ids, and the "nothing is shared" simplification is gone
# without anyone noticing.
#
# CENSUS for the fixture — 6 boxes, 2 spawns, 3 paths, 10 path nodes:
#
#   per box:  1 CMapMesh, 1 CDmePolygonMesh, 4 CDmePolygonMeshDataArray,
#             11 CDmePolygonMeshDataStream, 1 CDmePolygonMeshSubdivisionData
#   per ent:  1 CMapEntity, 1 EditGameClassProps, 1 DmePlugList
#   per path: 1 CMapPath, 1 EditGameClassProps, 1 DmePlugList
#   per node: 1 CMapPathNode, 1 EditGameClassProps, 1 DmePlugList
#   world:    1 EditGameClassProps, 1 DmePlugList
#   once:     CMapRootElement, CMapWorld, CVisibilityMgr, CMapVariableSet,
#             CMapSelectionSet, CStoredCameras
#
# SCOPE, unchanged: green means structurally valid and accepted by
# dmxconvert. It does NOT mean troopers walk the lane. Nothing here has been
# loaded in game.

on: workflow_dispatch

env:
  PLAN: examples/lane-path.mapplan.json
  EXPECT_HEADER: 'binary 9 format vmap 40'
  EXPECT_MAPMESH: 6
  EXPECT_POLYMESH: 6
  EXPECT_ENTITY: 2
  EXPECT_PATH: 3
  EXPECT_PATHNODE: 10
  EXPECT_DATAARRAY: 24
  EXPECT_STREAM: 66
  EXPECT_SUBDIV: 6
  EXPECT_CLASSPROPS: 16
  EXPECT_PLUGLIST: 16
  EXPECT_ELEMENTS: 161

jobs:
  paths:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p work out
          RC=0
          dotnet build src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -c Release > out/build.txt 2>&1 || RC=$?
          cat out/build.txt
          [ "$RC" -eq 0 ] || exit 1

      - name: Emit — plan to KV2 text
        shell: bash
        run: |
          set -uo pipefail
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- emit "$PLAN" work/t1.vmap > out/emit.txt 2>&1 || RC=$?
          cat out/emit.txt
          echo "exit: $RC" | tee -a out/emit.txt
          [ "$RC" -eq 0 ] || exit 1
          [ -s work/t1.vmap ] || { echo "FAIL: empty emit"; exit 1; }
          wc -c work/t1.vmap

      - name: Assert the emitted census, and that NOTHING carries an id
        shell: bash
        run: |
          set -uo pipefail
          FAIL=0
          chk () {
            GOT=$(awk -v t="$1" '$2==t {print $1}' out/emit.txt | head -1)
            GOT=${GOT:-0}
            if [ "$GOT" != "$2" ]; then echo "MISMATCH $1: want $2 got $GOT"; FAIL=1
            else echo "ok $1 = $GOT"; fi
          }
          chk CMapMesh                        "$EXPECT_MAPMESH"
          chk CDmePolygonMesh                 "$EXPECT_POLYMESH"
          chk CMapEntity                      "$EXPECT_ENTITY"
          chk CMapPath                        "$EXPECT_PATH"
          chk CMapPathNode                    "$EXPECT_PATHNODE"
          chk CDmePolygonMeshDataArray        "$EXPECT_DATAARRAY"
          chk CDmePolygonMeshDataStream       "$EXPECT_STREAM"
          chk CDmePolygonMeshSubdivisionData  "$EXPECT_SUBDIV"
          chk EditGameClassProps              "$EXPECT_CLASSPROPS"
          chk DmePlugList                     "$EXPECT_PLUGLIST"
          TOT=$(awk -F= '/^elements=/ {print $2}' out/emit.txt | head -1)
          TOT=${TOT:-0}
          if [ "$TOT" != "$EXPECT_ELEMENTS" ]; then
            echo "MISMATCH elements: want $EXPECT_ELEMENTS got $TOT"; FAIL=1
          else echo "ok elements = $TOT"; fi

          # The no-GUID property, asserted rather than assumed.
          IDS=$(grep -c '"elementid"' work/t1.vmap || true)
          if [ "$IDS" != "0" ]; then
            echo "FAIL: $IDS element id(s) emitted. Something is referenced"
            echo "twice, and MapEmitter's no-GUID simplification is broken."
            FAIL=1
          else echo "ok no element ids"; fi

          # And that the nodes really are inline, not references.
          REFS=$(grep -c '"element" "[0-9a-f]\{8\}-' work/t1.vmap || true)
          if [ "$REFS" != "0" ]; then
            echo "FAIL: $REFS reference(s) by guid in the emitted text"; FAIL=1
          else echo "ok no guid references"; fi
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Fetch, reassemble, extract
        id: get
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess, shutil

          repo = os.environ['GITHUB_REPOSITORY']
          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/csdk-12'],
              capture_output=True, text=True, check=True).stdout)

          assets = rel['assets']
          if not assets:
              print("::error::no assets on release"); sys.exit(1)

          os.makedirs('dl', exist_ok=True)
          for a in assets:
              dest = os.path.join('dl', a['name'])
              with open(dest, 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          if not files:
              print("::error::no zip parts"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != h.hexdigest():
                  print("::error::checksum mismatch"); sys.exit(1)

          with zipfile.ZipFile('bin_cs2.zip') as z:
              z.extractall('csdk')
          ghosts = os.path.join('csdk', '__MACOSX')
          if os.path.isdir(ghosts):
              shutil.rmtree(ghosts)

          conv = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'dmxconvert.exe':
                      conv = os.path.abspath(os.path.join(root, f))
          if not conv:
              print("::error::dmxconvert.exe missing"); sys.exit(1)
          print("dmxconvert:", conv)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"conv={conv}\n")

      - name: Valve judges the emitted text
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          RC=0
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/work/t1.vmap" -ie keyvalues2_noids \
            -o "$ROOT/work/lane.vmap" -oe binary -of vmap > out/conv.txt 2>&1 || RC=$?
          cat out/conv.txt
          echo "exit: $RC" | tee -a out/conv.txt
          if [ ! -s work/lane.vmap ]; then
            echo "FAIL: dmxconvert rejected a map with inline path nodes."
            echo "That is the finding this workflow exists for: it would mean"
            echo "paths cannot be inline and ids are required after all."
            exit 1
          fi
          echo -n "header: "; head -c 60 work/lane.vmap | tr -d '\0'; echo
          RC=0
          head -c 60 work/lane.vmap | tr -d '\0' | grep -q "$EXPECT_HEADER" || RC=$?
          [ "$RC" -eq 0 ] || { echo "FAIL: not $EXPECT_HEADER"; exit 1; }
          wc -c work/lane.vmap

      - name: Read it back and re-census
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          RC=0
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/work/lane.vmap" -ie binary \
            -o "$ROOT/work/t2.vmap" -oe keyvalues2 > out/conv2.txt 2>&1 || RC=$?
          cat out/conv2.txt
          [ -s work/t2.vmap ] || { echo "FAIL: could not re-text"; exit 1; }
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- info work/t2.vmap > out/final.txt 2>&1 || RC=$?
          cat out/final.txt
          [ "$RC" -eq 0 ] || exit 1
          FAIL=0
          chk () {
            GOT=$(awk -v t="$1" '$2==t {print $1}' out/final.txt | head -1)
            GOT=${GOT:-0}
            if [ "$GOT" != "$2" ]; then echo "LOST $1: want $2 got $GOT"; FAIL=1
            else echo "ok $1 = $GOT"; fi
          }
          chk CMapMesh     "$EXPECT_MAPMESH"
          chk CMapEntity   "$EXPECT_ENTITY"
          chk CMapPath     "$EXPECT_PATH"
          chk CMapPathNode "$EXPECT_PATHNODE"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Verify — does the map still MEAN the plan
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- verify "$PLAN" work/t2.vmap > out/verify.txt 2>&1 || RC=$?
          cat out/verify.txt
          echo "exit: $RC"
          [ "$RC" -eq 0 ] || exit 1
          echo
          echo "RESULT: three paths and ten nodes emit INLINE, convert to"
          echo "binary vmap 40, come back, and every node is still in the"
          echo "right place in the right ORDER. No element ids anywhere."
          echo "STRUCTURALLY VALID. Not 'troopers walk it'."

      - name: What landed
        if: always()
        shell: bash
        run: |
          cp work/t1.vmap out/emitted-t1.vmap.txt 2>/dev/null || true
          cp work/lane.vmap out/lane.vmap 2>/dev/null || true
          ls -l out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: path-smoke
          path: out/
          if-no-files-found: ignore
