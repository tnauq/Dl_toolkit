# Does the Reduced CSDK 12 ship citadel.fgd?
#
# WHY THIS EXISTS. The FGD is the only thing that gives entity KEYVALUES —
# the entity list gives classnames only. Everything still open in NEXT.md is
# keyvalue-shaped: whether `target` is right on citadel_trigger_teleport,
# what the proxy's sub_objective_lane_* fields want for a non-lane shrine,
# and which of the seven probe spellings the compiler accepts.
#
# We have looked for it twice and missed both times:
#   - GameTracking ships NO .fgd at all (probe-compiler-flags, 2026-08-2x).
#   - A retail game/citadel folder ships none either, verified 2026-08-29
#     against a helper's install, even though gameinfo.gi line 194 declares
#     "fgd" "citadel.fgd" relative to the game path.
#
# The one place nobody has actually looked is the csdk-12 release this repo
# already downloads on every compile run. The FGD is a tools-side file and
# the CSDK is the tools. It may have been sitting in the cache the whole time.
#
# This job is deliberately cheap: download, extract, walk the tree, report.
# No compile, no wine, no timeout risk. If it comes back positive the FGD
# question is closed with no desktop and no further favours asked.
#
# While the tree is extracted anyway it also counts .vcs shader files, which
# settles the OTHER standing question — SHIPPING.md asserts the Reduced CSDK
# has no shaders and that this is why CI cannot compile. That assertion is
# read off community docs and has never been checked directly.

name: csdk-fgd-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      # Same key as the compile workflows, so a warm cache costs nothing and
      # this job is nearly free after the first run.
      - name: Cache the extracted CSDK
        id: csdk-cache
        uses: actions/cache@v4
        with:
          path: csdk
          key: csdk-12-v1

      - name: Fetch, reassemble, extract
        if: steps.csdk-cache.outputs.cache-hit != 'true'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess, shutil

          repo = os.environ['GITHUB_REPOSITORY']

          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/csdk-12'],
              capture_output=True, text=True, check=True).stdout)

          assets = rel['assets']
          print(f"assets: {len(assets)}")
          if not assets:
              print("::error::no assets on release"); sys.exit(1)

          os.makedirs('dl', exist_ok=True)
          for a in assets:
              dest = os.path.join('dl', a['name'])
              print(f"  downloading {a['name']} ({a['size']} bytes)")
              with open(dest, 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)

          # The CSDK is split across bin.cs2.N.zip parts and must be
          # reassembled in ordinal order before it will unzip.
          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          if not files:
              print("::error::no zip parts after download"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          got = h.hexdigest()
          print(f"reassembled {os.path.getsize('bin_cs2.zip')} bytes, sha256 {got}")

          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != got:
                  print(f"::error::checksum mismatch, expected {want}"); sys.exit(1)
              print("checksum OK")

          with zipfile.ZipFile('bin_cs2.zip') as z:
              z.extractall('csdk')

          # Zipped on macOS: __MACOSX holds AppleDouble `._` stubs that shadow
          # every real file. Anything walking the tree by name sees doubles.
          ghosts = os.path.join('csdk', '__MACOSX')
          if os.path.isdir(ghosts):
              shutil.rmtree(ghosts)
              print("removed the __MACOSX shadow tree")

      # THE QUESTION.
      - name: Look for the FGD
        id: fgd
        shell: python
        run: |
          import os, hashlib

          hits = []
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower().endswith('.fgd'):
                      hits.append(os.path.join(root, f))
          hits.sort()

          print(f"=== .fgd files in the CSDK: {len(hits)} ===")
          for p in hits:
              size = os.path.getsize(p)
              with open(p, 'rb') as fh:
                  sha = hashlib.sha1(fh.read()).hexdigest()[:12]
              print(f"  {size:>9}  {sha}  {p}")

          citadel = [p for p in hits
                     if os.path.basename(p).lower() == 'citadel.fgd']

          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"count={len(hits)}\n")
              g.write(f"citadel={'yes' if citadel else 'no'}\n")

          if citadel:
              print("::notice::citadel.fgd IS in the CSDK — the FGD question "
                    "is answerable without a desktop. Download the artifact.")
          elif hits:
              print("::warning::FGDs present but no citadel.fgd. Check the "
                    "listing above — a differently-named file may still "
                    "carry the citadel entity definitions.")
          else:
              print("::warning::no .fgd anywhere in the CSDK. That closes the "
                    "cheap options: GameTracking, retail and the CSDK have "
                    "all now been checked. Only the Source 2 Viewer export "
                    "of pak01_dir.vpk is left (SHIPPING.md step 3).")

      # THE SIDE QUESTION, since the tree is already unpacked. SHIPPING.md
      # claims the Reduced CSDK has no shaders and that this is the sole
      # reason CI cannot compile. Never verified directly — the evidence has
      # only ever been the compiler's own complaint about complex.vfx.
      - name: Count shaders while we are in here
        shell: python
        run: |
          import os
          from collections import Counter

          vcs, vfx = [], []
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  low = f.lower()
                  if low.endswith('.vcs'): vcs.append(os.path.join(root, f))
                  elif low.endswith('.vfx'): vfx.append(os.path.join(root, f))

          print(f"=== .vcs (compiled shaders): {len(vcs)} ===")
          for p in sorted(vcs)[:20]:
              print(f"  {p}")
          if len(vcs) > 20:
              print(f"  ... and {len(vcs) - 20} more")

          print(f"=== .vfx (shader sources): {len(vfx)} ===")
          for p in sorted(vfx)[:20]:
              print(f"  {p}")

          if any('complex' in os.path.basename(p).lower() for p in vcs):
              print("::notice::a complex.vcs EXISTS in the CSDK. The compile "
                    "failure may be a search-path problem, not a missing "
                    "file. Worth a compile run before doing the depot pull.")
          elif not vcs:
              print("::notice::zero .vcs in the CSDK, confirming SHIPPING.md. "
                    "The depot pull plus Source 2 Viewer export is genuinely "
                    "required to compile.")

      # Only the FGDs, and only if there are any. Small, and it is the payload.
      - name: Stage any FGDs for download
        if: steps.fgd.outputs.count != '0'
        shell: bash
        run: |
          mkdir -p out
          find csdk -iname '*.fgd' -exec cp {} out/ \;
          ls -la out

      - name: Upload
        if: steps.fgd.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: csdk-fgds
          path: out/

      - name: Verdict
        if: always()
        shell: bash
        run: |
          echo "fgd files found : ${{ steps.fgd.outputs.count }}"
          echo "citadel.fgd     : ${{ steps.fgd.outputs.citadel }}"
