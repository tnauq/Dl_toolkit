name: loop

# END TO END: plan -> dl-patch batch -> overlay -> resourcecompiler -> .vdata_c
#             -> dl-patch pack -> addon VPK
#
# Asserts every link TOGETHER, on the files the project actually cares about.
#
# WHAT CHANGED 2026-08-12 (second revision). The first version proved the chain
# on whatever small vdata the picker found first — nav_hulls. That asserted the
# plumbing but not the use case. It now runs a TWO-FILE plan over heroes.vdata
# and a second real file, which exercises the parts of batch that exist
# precisely for real work: cross-file atomicity, per-file reporting, and a plan
# whose guards span more than one document. Until now every multi-file
# assertion was against synthetic single-file plans.
#
# HARNESS RULES, learned the expensive way:
#   - GitHub runs steps as `bash -e`; `set -uo pipefail` does NOT clear it.
#     Use `RC=0; cmd || RC=$?` for anything expected to exit nonzero.
#   - `cat` output BEFORE asserting, or a failure shows nothing.
#   - `python3` may not resolve in Git bash: resolve it.
#   - PACK FROM A CURATED TREE. The compiler's output directory holds
#     gameinfo.gi and may hold stale artifacts. The first green run of this
#     workflow shipped the wrong file with every assertion passing.

on:
  push:
  workflow_dispatch:

jobs:
  loop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Fetch, reassemble, extract
        id: get
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess

          repo = os.environ['GITHUB_REPOSITORY']

          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/csdk-12'],
              capture_output=True, text=True, check=True).stdout)

          assets = rel['assets']
          print(f"assets: {len(assets)}")
          if not assets:
              print("::error::no assets on release"); sys.exit(1)

          os.makedirs('dl', exist_ok=True)
          for a in assets:
              dest = os.path.join('dl', a['name'])
              print(f"  downloading {a['name']} ({a['size']} bytes)")
              with open(dest, 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)
              print(f"    -> {os.path.getsize(dest)} bytes on disk")

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          print("order:")
          for f in files:
              print(f"  {ordinal(f):2d}  {f}  {os.path.getsize(os.path.join('dl', f))}")
          if len(files) == 0:
              print("::error::no zip parts after download"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          got = h.hexdigest()
          print(f"reassembled {os.path.getsize('bin_cs2.zip')} bytes")
          print(f"sha256 {got}")

          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != got:
                  print(f"::error::checksum mismatch, expected {want}"); sys.exit(1)
              print("checksum OK")

          with zipfile.ZipFile('bin_cs2.zip') as z:
              print(f"archive holds {len(z.namelist())} entries")
              z.extractall('csdk')

          # The CSDK was zipped on macOS: __MACOSX holds AppleDouble `._`
          # stubs that shadow every real file (128 real DLLs, 128 ghosts).
          # Harmless to the compiler, but anything walking the tree by name
          # sees doubles, so remove it. (Found 2026-08-12.)
          import shutil
          ghosts = os.path.join('csdk', '__MACOSX')
          if os.path.isdir(ghosts):
              shutil.rmtree(ghosts)
              print("removed the __MACOSX shadow tree")

          comp = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'resourcecompiler.exe':
                      comp = os.path.abspath(os.path.join(root, f))
          print("compiler:", comp or "NOT FOUND")

          # modtools.dll is NOT in the Reduced CSDK bin (verified 2026-08-12:
          # zero matches across 128 real DLLs), and the compiler loads it as an
          # application dependency — error 126 before any work begins. It ships
          # as a LOOSE release asset on the csdk-12 tag and is copied in here.
          # Its own static imports are only KERNEL32 and tier0.dll, and tier0
          # is already in bin_cs2/win64, so no further chain is predictable.
          loose = os.path.join('dl', 'modtools.dll')
          if comp and os.path.exists(loose):
              dest = os.path.join(os.path.dirname(comp), 'modtools.dll')
              shutil.copy(loose, dest)
              print(f"placed modtools.dll -> {dest} ({os.path.getsize(dest)} bytes)")
          elif not os.path.exists(loose):
              print("::warning::modtools.dll not among the release assets")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"ready={comp}\n")

      - name: Clone GameTracking (vdata + gameinfo)
        id: gt
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SteamDatabase/GameTracking-Deadlock.git gt
          cd gt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/**/gameinfo.gi' '/**/*.vdata'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the game tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/game/citadel build/content/citadel/scripts
          cp gt/game/citadel/gameinfo.gi build/game/citadel/gameinfo.gi
          if [ -f gt/game/core/gameinfo.gi ]; then
            mkdir -p build/game/core build/content/core
            cp gt/game/core/gameinfo.gi build/game/core/gameinfo.gi
          fi
          find build -type f

      - name: Build dl-patch
        shell: bash
        run: dotnet build src/Deadlock.Patch/Deadlock.Patch.csproj -c Release

      # ------------------------------------------------------------------
      # A TWO-FILE PLAN OVER REAL FILES
      # ------------------------------------------------------------------
      - name: Compose a multi-file plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          [ -n "$PY" ] || { echo "::error::no python on the runner"; exit 3; }

          HERO=$(find gt -name 'heroes.vdata' -not -path '*/.git/*' | head -1)
          [ -n "$HERO" ] || { echo "::error::no heroes.vdata"; exit 3; }
          echo "hero file: $HERO"

          # Second file: the smallest OTHER vdata that is both compilable
          # (declares generic_data_type) and patchable (has a plain float).
          find gt -name '*.vdata' -not -path '*/.git/*' -printf '%s\t%p\n' \
            | sort -n > all-vdata.txt
          SECOND=""
          while IFS=$'\t' read -r size path; do
            [ "$path" = "$HERO" ] && continue
            grep -q 'generic_data_type' "$path" 2>/dev/null || continue
            if "$PY" tools/pick_target.py "$path" "scripts/$(basename "$path")" \
                 > /tmp/p2.json 2>/dev/null; then
              SECOND="$path"; break
            fi
          done < all-vdata.txt
          [ -n "$SECOND" ] || { echo "::error::no second patchable vdata"; exit 3; }
          echo "second file: $SECOND"

          # Stage both under one root, addressed the way the plan will name them.
          mkdir -p patchroot/scripts
          H=$(basename "$HERO"); S=$(basename "$SECOND")
          cp "$HERO" "patchroot/scripts/$H"
          cp "$SECOND" "patchroot/scripts/$S"

          "$PY" tools/pick_target.py "$HERO" "scripts/$H" > /tmp/p1.json
          # p2 was already generated for $SECOND above, but regenerate against
          # the staged copy so both plans are derived identically.
          "$PY" tools/pick_target.py "$SECOND" "scripts/$S" > /tmp/p2.json

          "$PY" - <<'PYEOF' > plan.json
          import json
          a = json.load(open('/tmp/p1.json'))
          b = json.load(open('/tmp/p2.json'))
          plan = {
              "version": 1,
              "description": "loop: two real files, one atomic plan",
              "edits": a["edits"] + b["edits"],
          }
          print(json.dumps(plan, indent=2))
          PYEOF
          cat plan.json

          echo "hero_name=$H" >> "$GITHUB_OUTPUT"
          echo "second_name=$S" >> "$GITHUB_OUTPUT"
          echo "hero_src=$HERO" >> "$GITHUB_OUTPUT"
          echo "second_src=$SECOND" >> "$GITHUB_OUTPUT"

      - name: Assert the plan really spans two files and targets a hero stat
        shell: bash
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'PYEOF'
          import json
          p = json.load(open('plan.json'))
          files = [e["file"] for e in p["edits"]]
          assert len(files) == 2, files
          assert len(set(files)) == 2, "duplicate file in plan: %r" % files
          hero = [e for e in p["edits"] if e["file"].endswith("heroes.vdata")]
          assert hero, files
          path = hero[0]["set"][0]["path"]
          print("hero target:", path)
          # The whole point of the project is hero data. A target that is not
          # under a hero_* block means the picker drifted somewhere generic.
          assert path.startswith("hero_"), "not a hero stat: %r" % path
          for e in p["edits"]:
              s = e["set"][0]
              assert "expect" in s, s
              assert s["expect"] is not None, "guard opted out: %r" % s
          PYEOF

      - name: Apply the plan
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --project src/Deadlock.Patch -- \
            batch --plan plan.json --root patchroot --out-root overlay \
                  --source-build "${{ steps.gt.outputs.sha }}" --json > batch.json
          cat batch.json
          find overlay -type f

      - name: Assert batch reported both files
        shell: bash
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'PYEOF'
          import json
          d = json.load(open('batch.json'))
          assert d['ok'] is True, d
          data = d['data']
          assert data['files_total'] == 2, data
          assert data['applied'] == 2, data
          assert data['failed'] == 0, data
          for f in data['files']:
              assert f['written'] is True, f
              assert f['applied'] == 1, f
          print('applied across', data['files_total'], 'files')
          PYEOF

      - name: Compile both patched files
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          mkdir -p packroot/scripts
          for N in "${{ steps.plan.outputs.hero_name }}" "${{ steps.plan.outputs.second_name }}"; do
            cp "overlay/scripts/$N" "build/content/citadel/scripts/$N"
            cd build/game
            set +e
            "${{ steps.get.outputs.ready }}" -nop4 -f -v -game citadel \
              -i "$ROOT/build/content/citadel/scripts/$N" > "$ROOT/compile-$N.txt" 2>&1
            RC=$?
            set -e
            cd "$ROOT"
            tail -6 "compile-$N.txt"
            [ "$RC" = "0" ] || { echo "compile of $N failed" >&2; exit 1; }
            OUT="build/game/citadel/scripts/${N}_c"
            test -f "$OUT" || { echo "no compiled output for $N" >&2; exit 1; }
            # Stage into the CURATED pack tree immediately, before any later
            # step can overwrite the compiler's output directory.
            cp "$OUT" "packroot/scripts/${N}_c"
            echo "$N -> $(stat -c %s "$OUT") bytes"
          done
          find packroot -type f

      - name: Assert the edits survived compilation
        id: survived
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          # Compile the PRISTINE originals and require different bytes. Without
          # this, a chain that silently dropped the edit would still be green.
          for PAIR in "${{ steps.plan.outputs.hero_name }}:${{ steps.plan.outputs.hero_src }}" \
                      "${{ steps.plan.outputs.second_name }}:${{ steps.plan.outputs.second_src }}"; do
            N="${PAIR%%:*}"; SRC="${PAIR#*:}"
            cp "$SRC" "build/content/citadel/scripts/$N"
            cd build/game
            "${{ steps.get.outputs.ready }}" -nop4 -f -game citadel \
              -i "$ROOT/build/content/citadel/scripts/$N" > "$ROOT/pristine-$N.txt" 2>&1
            cd "$ROOT"
            PRIST="build/game/citadel/scripts/${N}_c"
            PATCHED="packroot/scripts/${N}_c"
            echo "$N  patched $(stat -c %s "$PATCHED")  pristine $(stat -c %s "$PRIST")"
            if cmp -s "$PATCHED" "$PRIST"; then
              echo "::error::$N — patched and pristine compiled output are IDENTICAL"
              exit 1
            fi
          done
          echo "both edits survived compilation"

      # ------------------------------------------------------------------
      # PACK — from the curated tree, never build/game/citadel
      # ------------------------------------------------------------------
      - name: Pack into an addon VPK
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --project src/Deadlock.Patch -- \
            pack --in packroot --out dist/pak01_dir.vpk \
                 --source-build "${{ steps.gt.outputs.sha }}" \
                 --verify --json > pack.json
          cat pack.json
          ls -la dist/

      - name: Assert the VPK is shippable
        shell: bash
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'PYEOF'
          import json, os
          d = json.load(open('pack.json'))
          assert d['ok'] is True, d
          assert d['pinned_build'], 'build id missing (D2)'
          data = d['data']
          assert data['verified'] is True, 'CRC round trip did not verify'
          paths = [e['path'] for e in data['entries']]
          print('entries:', paths)
          assert len(paths) == 2, paths
          for p in paths:
              assert '\\' not in p, 'backslash in entry path: %r' % p
              assert not p.startswith('/'), 'absolute entry path: %r' % p
              assert ':' not in p, 'drive letter in entry path: %r' % p
              assert p.endswith('.vdata_c'), 'unexpected entry: %r' % p
          # gameinfo.gi is game config, never mod content.
          assert not any('gameinfo' in p for p in paths), paths
          # Every entry must match the PATCHED artifact byte-for-byte.
          for e in data['entries']:
              local = os.path.join('packroot', e['path'])
              assert e['length'] == os.path.getsize(local), \
                  '%s: packed %d, staged %d' % (e['path'], e['length'], os.path.getsize(local))
          assert any('heroes' in p for p in paths), 'no hero data in the addon: %r' % paths
          print('total bytes:', data['total_bytes'])
          PYEOF

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "=== plan ==="
          cat plan.json 2>/dev/null || true
          echo "=== addon contents ==="
          cat pack.json 2>/dev/null | grep '"path"' || true
          echo "=== compiled ==="
          find build/game -name '*_c' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop
          path: |
            plan.json
            batch.json
            pack.json
            all-vdata.txt
            compile-*.txt
            pristine-*.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addon-vpk
          path: dist/pak01_dir.vpk
          if-no-files-found: warn
