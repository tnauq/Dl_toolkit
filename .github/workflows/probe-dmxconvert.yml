name: probe dmxconvert

# Two SEPARATE questions. Q1 can pass while Q2 fails.
#
#   Q1  Is dmxconvert.exe anywhere in the CSDK we actually have?
#   Q2  Does it round-trip dl_example.vmap at `binary 9 format vmap 40`?
#
# Why this matters: `.vmap` is DMX binary 9, NOT KV3 (FINDINGS 2026-08-14).
# If dmxconvert converts keyvalues2 text -> binary, the emitter only ever has
# to write TEXT and Valve's tool produces the binary. That deletes the binary
# DMX writer from the plan entirely.
#
# CAUTION, stated before running: every dmxconvert guide found in the wild
# uses it on MODELS and PARTICLES. None uses it on a map. Presence proves
# nothing about whether it knows `format vmap 40`. Q2 is the real question.
#
# The CSDK fetch below is copied from probe-compiler.yml. Only bin_cs2 was
# ever uploaded to the csdk-12 release, so Q1 searches the whole extracted
# tree and reports honestly if dmxconvert simply is not in what we have.
# A "not found" here is a real finding, not a workflow bug: it means
# dmxconvert lives elsewhere in the full CSDK and needs uploading separately.
#
# No workflow_dispatch inputs — an input-requiring workflow cannot be run
# from a phone at all. Everything is in env. Everything readable goes to an
# ARTIFACT, since the mobile Actions view shows no step summaries.

on: workflow_dispatch

env:
  # If the fixture lands somewhere else, change this ONE line.
  FIXTURE: dl_example.vmap
  # Floors, stated BEFORE any measurement is read. A probe that reports
  # "0 differences" from an empty file is the exact trap FINDINGS lesson 5
  # was written about.
  MIN_TEXT_BYTES: 1000000
  EXPECT_HEADER: 'binary 9 format vmap 40'
  EXPECT_MESH_TOKEN: 'CDmePolygonMesh'

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the fixture is present
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f "$FIXTURE" ]; then
            echo "::error::fixture not at $FIXTURE — fix env.FIXTURE"
            echo "--- .vmap files anywhere in the checkout ---"
            find . -iname '*.vmap' -not -path './.git/*' 2>/dev/null | head -40 \
              || echo "(none — the fixture is not committed)"
            exit 3
          fi
          ls -l "$FIXTURE"
          echo -n "header: "; head -c 60 "$FIXTURE" | tr -d '\0'; echo

      # ------------------------------------------------------------------
      # CSDK fetch — from probe-compiler.yml, unchanged in substance.
      # ------------------------------------------------------------------
      - name: Fetch, reassemble, extract
        id: get
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess, shutil

          repo = os.environ['GITHUB_REPOSITORY']

          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/csdk-12'],
              capture_output=True, text=True, check=True).stdout)

          assets = rel['assets']
          print(f"assets: {len(assets)}")
          if not assets:
              print("::error::no assets on release"); sys.exit(1)

          os.makedirs('dl', exist_ok=True)
          for a in assets:
              dest = os.path.join('dl', a['name'])
              print(f"  downloading {a['name']} ({a['size']} bytes)")
              with open(dest, 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)
              print(f"    -> {os.path.getsize(dest)} bytes on disk")

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          print("order:")
          for f in files:
              print(f"  {ordinal(f):2d}  {f}  {os.path.getsize(os.path.join('dl', f))}")
          if len(files) == 0:
              print("::error::no zip parts after download"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          got = h.hexdigest()
          print(f"reassembled {os.path.getsize('bin_cs2.zip')} bytes")
          print(f"sha256 {got}")

          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != got:
                  print(f"::error::checksum mismatch, expected {want}"); sys.exit(1)
              print("checksum OK")

          with zipfile.ZipFile('bin_cs2.zip') as z:
              print(f"archive holds {len(z.namelist())} entries")
              z.extractall('csdk')

          ghosts = os.path.join('csdk', '__MACOSX')
          if os.path.isdir(ghosts):
              shutil.rmtree(ghosts)
              print("removed the __MACOSX shadow tree")

          # Q1 — find dmxconvert. Search the WHOLE tree, not just the
          # compiler's directory: we do not know where Valve puts it.
          conv = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'dmxconvert.exe':
                      conv = os.path.abspath(os.path.join(root, f))
          print("dmxconvert:", conv or "NOT FOUND")

          # tier0 and friends live beside resourcecompiler; if dmxconvert is
          # somewhere else it may still need them on PATH.
          comp = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'resourcecompiler.exe':
                      comp = os.path.abspath(os.path.join(root, f))
          print("compiler dir:", os.path.dirname(comp) if comp else "NOT FOUND")

          # modtools.dll, same loose release asset as probe-compiler. Copied
          # in case dmxconvert loads it as an application dependency too.
          loose = os.path.join('dl', 'modtools.dll')
          if comp and os.path.exists(loose):
              dest = os.path.join(os.path.dirname(comp), 'modtools.dll')
              shutil.copy(loose, dest)
              print(f"placed modtools.dll -> {dest}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"conv={conv}\n")
              g.write(f"bin={os.path.dirname(comp) if comp else ''}\n")

      # ------------------------------------------------------------------
      # Q1
      # ------------------------------------------------------------------
      - name: Q1 — inventory
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p probe-out
          {
            echo "=== anything named dmxconvert, anywhere ==="
            find csdk -iname '*dmxconvert*' || true
            echo
            echo "=== every exe in the CSDK ==="
            find csdk -iname '*.exe' | sort
          } > probe-out/q1-inventory.txt 2>&1
          cat probe-out/q1-inventory.txt

      - name: Q1 — assert
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${{ steps.get.outputs.conv }}" ]; then
            echo "RESULT: dmxconvert.exe is NOT in the CSDK bin we uploaded."
            echo "This is a finding, not a bug. dmxconvert ships in the wider"
            echo "Source 2 Workshop Tools tree; only bin_cs2 was ever uploaded."
            echo "NEXT: either upload the dir containing it as a csdk-12 asset,"
            echo "or fall back to the VRF map-decompiler survey (vmap_c -> vmap)."
            exit 1
          fi
          echo "RESULT: found at ${{ steps.get.outputs.conv }}"

      - name: Q1 — does it run
        shell: bash
        run: |
          set -uo pipefail
          export PATH="${{ steps.get.outputs.bin }}:$PATH"
          RC=0
          "${{ steps.get.outputs.conv }}" > probe-out/q1-usage.txt 2>&1 || RC=$?
          echo "exit: $RC" | tee -a probe-out/q1-usage.txt
          head -40 probe-out/q1-usage.txt

      # ------------------------------------------------------------------
      # Q2 — the real question
      #
      # Relative/native paths only where it matters: do NOT hand a Unix
      # absolute path to a Windows binary. `pwd -W` gives the Windows form.
      # ------------------------------------------------------------------
      - name: Q2a — binary to keyvalues2 text
        shell: bash
        run: |
          set -uo pipefail
          export PATH="${{ steps.get.outputs.bin }}:$PATH"
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          mkdir -p work
          cp "$FIXTURE" work/in.vmap
          RC=0
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/work/in.vmap" -ie binary \
            -o "$ROOT/work/text.vmap" -oe keyvalues2 \
            > probe-out/q2a-log.txt 2>&1 || RC=$?
          cat probe-out/q2a-log.txt
          echo "exit: $RC" | tee -a probe-out/q2a-log.txt
          ls -l work | tee -a probe-out/q2a-log.txt

      - name: Q2a — assert the text is real
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f work/text.vmap ]; then
            echo "FAIL: no text output produced at all"; exit 1
          fi
          SZ=$(wc -c < work/text.vmap)
          echo "text bytes: $SZ (floor $MIN_TEXT_BYTES)"
          if [ "$SZ" -lt "$MIN_TEXT_BYTES" ]; then
            echo "FAIL: below floor — treat as no conversion, not a small one"
            head -c 400 work/text.vmap; exit 1
          fi
          RC=0
          grep -q "$EXPECT_MESH_TOKEN" work/text.vmap || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: no $EXPECT_MESH_TOKEN in the text output"; exit 1
          fi
          echo "--- first 300 bytes ---"
          head -c 300 work/text.vmap; echo
          echo "RESULT: text conversion looks genuine."

      - name: Q2b — text back to binary
        shell: bash
        run: |
          set -uo pipefail
          export PATH="${{ steps.get.outputs.bin }}:$PATH"
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          RC=0
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/work/text.vmap" -ie keyvalues2 \
            -o "$ROOT/work/rt.vmap" -oe binary -of vmap \
            > probe-out/q2b-log.txt 2>&1 || RC=$?
          cat probe-out/q2b-log.txt
          echo "exit: $RC" | tee -a probe-out/q2b-log.txt
          ls -l work | tee -a probe-out/q2b-log.txt

      - name: Q2b — assert the round trip
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "=== headers ==="
            echo -n "original : "; head -c 60 work/in.vmap | tr -d '\0'; echo
            if [ -f work/rt.vmap ]; then
              echo -n "roundtrip: "; head -c 60 work/rt.vmap | tr -d '\0'; echo
            else
              echo "roundtrip: FILE MISSING"
            fi
            echo
            echo "=== sizes ==="
            wc -c work/in.vmap work/rt.vmap 2>&1
            echo
            echo "=== byte identity ==="
            RC=0
            cmp work/in.vmap work/rt.vmap || RC=$?
            echo "cmp exit: $RC"
          } > probe-out/q2-result.txt 2>&1
          cat probe-out/q2-result.txt

          if [ ! -f work/rt.vmap ]; then
            echo "FAIL: no binary produced from the text"; exit 1
          fi
          # The HEADER is the gate. Byte identity is a bonus, not a
          # requirement: dmxconvert may legitimately reorder or renumber the
          # string table and still be perfectly correct.
          RC=0
          head -c 60 work/rt.vmap | tr -d '\0' | grep -q "$EXPECT_HEADER" || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: roundtrip is not '$EXPECT_HEADER'."
            echo "If it came back as a different encoding or format version,"
            echo "that is the answer: dmxconvert does not speak vmap 40."
            exit 1
          fi
          echo "RESULT: dmxconvert emits $EXPECT_HEADER from keyvalues2 text."
          echo "The emitter can write TEXT. No binary DMX writer needed."

      - name: What landed
        if: always()
        shell: bash
        run: |
          echo "=== summary ==="
          echo "dmxconvert: ${{ steps.get.outputs.conv }}"
          [ -f work/text.vmap ] && echo "text bytes: $(wc -c < work/text.vmap)" || echo "text: none"
          [ -f work/rt.vmap ] && echo "rt bytes:   $(wc -c < work/rt.vmap)" || echo "rt: none"
          cp work/text.vmap probe-out/text.vmap 2>/dev/null || true
          # The full text conversion is the single most valuable thing this
          # workflow can hand back: it is the schema, in a readable form.
          # Truncate only if it is enormous.
          if [ -f probe-out/text.vmap ]; then
            SZ=$(wc -c < probe-out/text.vmap)
            if [ "$SZ" -gt 40000000 ]; then
              head -c 8000000 probe-out/text.vmap > probe-out/text-head.vmap
              rm probe-out/text.vmap
              echo "text was ${SZ}B — kept the first 8MB only"
            fi
          fi
          ls -l probe-out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-dmxconvert
          path: probe-out/
          if-no-files-found: ignore
