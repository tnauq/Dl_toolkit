name: entity survey

# REPLACES the first version, which had two faults:
#
#   1. it converted with -oe keyvalues2, which stamps an id on EVERY element,
#      so the "elements carrying an id" figure was meaningless. This one uses
#      keyvalues2_noids, where an id appears ONLY on an element referenced
#      more than once. That count is the answer to "how much sharing is
#      there", which is what decides whether the emitter can grow paths.
#
#   2. its line scanner could not tell an array SCALAR item from an element
#      TYPE header, because both are a single quoted token on a line. The
#      difference is only visible on the NEXT line: an element is followed by
#      a brace. This version keeps a one-line lookahead, so the element type
#      census is trustworthy this time. Same fix for two-token lines, where
#      "name" "TypeName" (inline element) and "element" "someid" (a
#      reference inside an array) are otherwise identical in shape.
#
# THE QUESTION THIS RUN EXISTS TO ANSWER: how does a lane_marker_path hold
# its route? The keyvalues carry only lanenum and LaneSlot, so the ordered
# positions live somewhere else — as inline child elements, or as references
# to shared CMapPathNode elements. Inline means the emitter can grow into it
# with no id machinery. References mean ids come back, and MapEmitter's whole
# no-GUID simplification has to be reopened.
#
# It dumps VERBATIM subtrees for the entities that matter, so the answer is
# readable rather than inferred from counts.
#
# ADDED 2026-08-22, TEST 1 OF THE CVisibilityMgr QUESTION. The emitter leaves
# CVisibilityMgr's nodes array empty, which is why its path nodes stay inline
# and need no ids. Whether that array is REQUIRED is the open risk. First
# evidence: in dl_example, CMapWorld's children holds 767 references and
# CVisibilityMgr's nodes holds 765. If the array were a manifest the runtime
# depends on, those counts would match. This run diffs the two id sets and
# names what sits in one and not the other, so the discrepancy stops being a
# number and becomes a fact about which kinds of element the array skips.
#
# A LARGE, MEANINGFUL GAP is evidence the array is editor bookkeeping.
# A GAP OF EXACTLY NOTHING but a couple of odd singletons is evidence it is
# meant to be exhaustive, and the emitter probably has to populate it.

on: workflow_dispatch

env:
  FIXTURE: dl_example.vmap
  # Element types whose whole subtree gets captured verbatim.
  CAPTURE_TYPES: 'CMapEntity,CMapPath,CMapPathNode,CMapGroup,CMapInstance'
  # Classnames worth an excerpt, plus the path element types above.
  #
  # CHANGED 2026-08-22: swapped the path classnames, whose structure is now
  # settled, for the BRUSH ENTITIES. trigger_item_shop and trigger_team_base
  # carry model, local.origin and local.scales, so they are volumes rather
  # than points, and how a volume attaches to its geometry is the one
  # mechanism the emitter has not read. The previous run's nesting table is
  # the hypothesis: 150 of 222 CMapMesh sit under `children` rather than at
  # root, and `children -> CMapEntity` is 276, which is the shape of a brush
  # entity holding its mesh INLINE. If the dump confirms that, shops cost
  # nothing new — it is the same inline pattern already emitted for paths.
  # If instead `children` holds a guid, brush entities need ids and are a
  # different job.
  #
  # SECOND QUESTION IN THE SAME DUMP: is `model` authored or compiler-written?
  # func_nav_markup showed model = maps\dl_streets\entities\unnamed_14650_959.vmdl,
  # a generated name under the map's own directory, which looks baked on
  # export rather than typed by a level designer. Six trigger_item_shop exist
  # and only four carry a model. If the ones WITH a model differ from the ones
  # without in whether they hold a child mesh, that answers it.
  # CHANGED 2026-08-22 (third pass). The brush question is settled for shops;
  # this pass covers everything ELSE the map needs placing, to learn which are
  # POINTS and which are VOLUMES before writing tables for them. Anything
  # named trigger_* is probably a volume and needs a child mesh; the spawners
  # and ropes may be points.
  #
  # Known roles, from the user 2026-08-22:
  #   citadel_trigger_idol_return  urn dropoff AND spawn; the 2 alternate
  #   trigger_midboss_shield       the midboss pit
  #   citadel_item_powerup_spawner bridge buff; rolls one of 4; 2 on the map
  #   citadel_trigger_climb_rope   climbable rope
  #   trigger_catapult             jump pad, probably
  #   citadel_trigger_push         teleporter, probably
  #   func_regenerate              spawn-room regeneration
  #   trigger_tier3phase2_shield   patron phase 2
  #   citadel_trigger_speed_boost  zipline boost — believed GLOBAL, not placed
  #   citadel_zap_trigger          knocked off the zipline — same
  #
  # The last two are the interesting ones: if their subtrees show a real
  # volume with extents they are placed after all; if they are bare points
  # with empty children they are demo markers or global toggles.
  #
  # NOTE ON COUNTS: dl_example is a GYM, not a layout. It shows one of each
  # mechanism (1 powerup spawner, 1 rope, 1 catapult) where the real map has
  # more. Do not read its counts as a template for how many to place.
  CAPTURE_CLASSES: 'citadel_trigger_idol_return,trigger_midboss_shield,citadel_item_powerup_spawner,citadel_trigger_climb_rope,trigger_catapult,citadel_trigger_push,func_regenerate,trigger_tier3phase2_shield,citadel_trigger_speed_boost,citadel_zap_trigger,trigger_neutral_shield'
  # Property TUPLES to tabulate, as classname:key,key;classname:key
  #
  # THE QUESTION: is a lane_marker_path SHARED between the teams or one per
  # team? dl_example has 16 of them on a FOUR-lane map. Per-team would be 24
  # (4 lanes x 3 slots x 2 teams), shared-with-3-slots would be 12; neither
  # fits, so the assumption that there are three slots may itself be wrong.
  #
  # Strong hint already in hand: lane_marker_path carries NO teamnumber, while
  # every team-owned entity in the map does. That points at one shared path
  # walked in both directions. If each (lanenum, LaneSlot) pair appears ONCE,
  # it is shared and batch13 must NOT mirror lane paths — mirroring would lay
  # a second full-length route on top of the first. If each pair appears
  # TWICE, they are per-team and the mirroring is right.
  #
  # The slot count falls out of the same table: distinct LaneSlot values.
  # ZIPLINE NODE OWNERSHIP, the open question 2026-08-22. Nodes carry
  # teamnumber 2, 3 and 4 (38 of 270 at 4). Ownership is DYNAMIC in game —
  # a team that pushes can zip most of the map — so the authored value
  # cannot be the runtime state. Two readings:
  #
  #   a STARTING state, split near the middle and moved from there, or
  #   a fixed property, where 4 marks permanently neutral segments.
  #
  # `capturable` is the discriminator. If the 4s are capturable and the 2/3s
  # are not, ownership is a fixed property of the node. If everything is
  # capturable, it is a starting state. `corner_node`, `one_way` and
  # `always_usable` come along in the same table since they are free.
  # ONE SPEC PER CLASSNAME. The parser keys on classname, so a repeated one
  # silently overwrites the earlier — hence the single wide tuple below
  # rather than three narrow ones.
  TUPLE_SPECS: 'citadel_zipline_path_node:teamnumber,capturable,corner_node,one_way,always_usable,enabled,disable_zipping_to;lane_marker_path:lanenum,LaneSlot;citadel_zipline_path:lane_number,start_active;info_trooper_spawn:teamnumber,lanenum'

  # Excerpts per kind, and lines per excerpt. A brush entity's subtree
  # contains an entire CDmePolygonMesh if the mesh is inline, which is
  # thousands of lines — the cap is deliberately BELOW that, because the
  # question is answered by the first few lines of `children`, not by the
  # vertex streams. A truncation notice is printed, so a truncated block is
  # itself evidence the mesh is inline.
  MAX_EXCERPTS: 1
  MAX_EXCERPT_LINES: 120

jobs:
  survey:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fixture is present and is a binary vmap
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p work out
          [ -s "$FIXTURE" ] || { echo "FAIL: no $FIXTURE"; exit 1; }
          wc -c "$FIXTURE"
          echo -n "header: "; head -c 60 "$FIXTURE" | tr -d '\0'; echo

      - name: Fetch, reassemble, extract
        id: get
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess, shutil

          repo = os.environ['GITHUB_REPOSITORY']
          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/csdk-12'],
              capture_output=True, text=True, check=True).stdout)

          assets = rel['assets']
          if not assets:
              print("::error::no assets on release"); sys.exit(1)

          os.makedirs('dl', exist_ok=True)
          for a in assets:
              dest = os.path.join('dl', a['name'])
              with open(dest, 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          if not files:
              print("::error::no zip parts"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != h.hexdigest():
                  print("::error::checksum mismatch"); sys.exit(1)

          with zipfile.ZipFile('bin_cs2.zip') as z:
              z.extractall('csdk')
          ghosts = os.path.join('csdk', '__MACOSX')
          if os.path.isdir(ghosts):
              shutil.rmtree(ghosts)

          conv = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'dmxconvert.exe':
                      conv = os.path.abspath(os.path.join(root, f))
          if not conv:
              print("::error::dmxconvert.exe missing"); sys.exit(1)
          print("dmxconvert:", conv)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"conv={conv}\n")

      - name: Binary to keyvalues2_noids text
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          RC=0
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/$FIXTURE" -ie binary \
            -o "$ROOT/work/example.txt" -oe keyvalues2_noids > out/conv.txt 2>&1 || RC=$?
          cat out/conv.txt
          echo "exit: $RC" | tee -a out/conv.txt
          [ -s work/example.txt ] || { echo "FAIL: no text out"; exit 1; }
          wc -c work/example.txt | tee -a out/conv.txt

      - name: Survey
        timeout-minutes: 25
        shell: python
        run: |
          import re, os, json, collections

          SRC = 'work/example.txt'
          CAP_TYPES = set(os.environ['CAPTURE_TYPES'].split(','))
          CAP_CLASSES = set(os.environ['CAPTURE_CLASSES'].split(','))
          MAX_EX = int(os.environ['MAX_EXCERPTS'])
          MAX_LINES = int(os.environ['MAX_EXCERPT_LINES'])

          three = re.compile(r'^"([^"]*)"\s+"([^"]*)"\s+"(.*)"\s*,?$')
          two   = re.compile(r'^"([^"]*)"\s+"([^"]*)"\s*,?$')
          one   = re.compile(r'^"(.*)"\s*,?$')

          types    = collections.Counter()
          classes  = collections.Counter()
          keys     = collections.defaultdict(collections.Counter)
          ids      = 0
          refs     = collections.Counter()
          childof  = collections.Counter()

          # TEST 1 state. Every reference recorded against the element type
          # that holds it, so CMapWorld.children and CVisibilityMgr.nodes can
          # be compared as SETS rather than as counts. And every id-carrying
          # element described, so a gap can be named rather than counted.
          reflists = collections.defaultdict(list)   # "Owner.attr" -> [guid]
          idinfo   = {}                              # guid -> {type, classname}

          # classname -> {key,...} to tabulate, and the observed tuples.
          tuple_keys = {}
          for spec in os.environ.get('TUPLE_SPECS', '').split(';'):
              if not spec.strip():
                  continue
              cn, keys_csv = spec.split(':', 1)
              tuple_keys[cn] = keys_csv.split(',')
          tuples = collections.defaultdict(collections.Counter)

          excerpts = collections.defaultdict(list)

          # Each open element gets a frame, so an id line and a classname
          # found later can both be attached to the right element.
          frames = []              # [{'type':..,'id':None,'class':None}]
          attr_stack = []
          props_depth = None
          cur_props = {}

          cap_lines = None
          cap_depth = None
          cap_type = None
          cap_class = None

          def flush_capture():
              global cap_lines, cap_depth, cap_type, cap_class
              if cap_lines is None:
                  return
              kind = cap_class or cap_type
              if (cap_type in CAP_TYPES and
                      (cap_class is None or cap_class in CAP_CLASSES) and
                      len(excerpts[kind]) < MAX_EX):
                  body = cap_lines[:MAX_LINES]
                  if len(cap_lines) > MAX_LINES:
                      body.append(f'... truncated, {len(cap_lines)} lines total')
                  excerpts[kind].append(body)
              cap_lines = cap_depth = cap_type = cap_class = None

          def owner_type():
              return frames[-1]['type'] if frames else '(root)'

          def lines_with_lookahead(fh):
              prev = None
              for raw in fh:
                  s = raw.rstrip('\r\n').strip()
                  if not s:
                      continue
                  if prev is not None:
                      yield prev, s
                  prev = s
              if prev is not None:
                  yield prev, ''

          depth = 0
          pending_type = None
          pending_attr = None

          with open(SRC, 'r', encoding='utf-8', errors='replace') as fh:
              for s, nxt in lines_with_lookahead(fh):
                  if cap_lines is not None and len(cap_lines) < MAX_LINES + 1:
                      cap_lines.append('\t' * max(0, depth - cap_depth) + s)

                  if s in ('{', '['):
                      depth += 1
                      if s == '{':
                          frames.append({'type': pending_type, 'id': None,
                                         'class': None})
                          if pending_type == 'EditGameClassProps' and props_depth is None:
                              props_depth = depth
                              cur_props = {}
                      attr_stack.append(pending_attr)
                      pending_type = pending_attr = None
                      continue

                  if s in ('}', ']', '},', '],'):
                      closing_elem = s in ('}', '},')
                      if props_depth is not None and depth == props_depth:
                          cur_class = cur_props.pop('classname', '(none)')
                          classes[cur_class] += 1
                          for k, v in cur_props.items():
                              keys[cur_class][k] += 1
                          if cur_class in tuple_keys:
                              t = tuple(cur_props.get(k, '(missing)')
                                        for k in tuple_keys[cur_class])
                              tuples[cur_class][t] += 1
                          # EditGameClassProps is the frame being closed, so
                          # the classname belongs to the frame BELOW it.
                          if len(frames) >= 2:
                              frames[-2]['class'] = cur_class
                          if cap_lines is not None and cap_class is None:
                              cap_class = cur_class
                          props_depth = None
                      if closing_elem and frames:
                          f = frames.pop()
                          if f['id']:
                              idinfo[f['id']] = {'type': f['type'],
                                                 'classname': f['class'] or ''}
                      if attr_stack:
                          attr_stack.pop()
                      depth -= 1
                      if cap_lines is not None and depth < cap_depth:
                          flush_capture()
                      continue

                  m = three.match(s)
                  if m:
                      name, typ, val = m.groups()
                      if name == 'id' and typ == 'elementid':
                          ids += 1
                          if frames:
                              frames[-1]['id'] = val
                      elif typ == 'element' and val:
                          refs[f'{name} (attribute)'] += 1
                          reflists[f'{owner_type()}.{name}'].append(val)
                      elif props_depth is not None and depth == props_depth:
                          cur_props[name] = val
                      continue

                  m = two.match(s)
                  if m:
                      a, b = m.groups()
                      if nxt in ('{', '['):
                          pending_attr = a
                          pending_type = b if nxt == '{' else None
                          if pending_type:
                              types[pending_type] += 1
                              childof[f'{a} -> {b}'] += 1
                              if (pending_type in CAP_TYPES and cap_lines is None):
                                  cap_lines = [s]
                                  cap_depth = depth + 1
                                  cap_type = pending_type
                                  cap_class = None
                      elif a == 'element':
                          holder = attr_stack[-1] if attr_stack else '(root)'
                          refs[f'{holder} (array item)'] += 1
                          # The array's own frame is the element that owns it.
                          reflists[f'{owner_type()}.{holder}'].append(b)
                      continue

                  m = one.match(s)
                  if m:
                      tok = m.group(1)
                      if nxt == '{':
                          types[tok] += 1
                          holder = attr_stack[-1] if attr_stack else '(root)'
                          childof[f'{holder} -> {tok}'] += 1
                          pending_type = tok
                          if tok in CAP_TYPES and cap_lines is None:
                              cap_lines = [s]
                              cap_depth = depth + 1
                              cap_type = tok
                              cap_class = None
                      continue

          flush_capture()

          def describe(guid):
              d = idinfo.get(guid)
              if not d:
                  return f'{guid} (never defined in this file)'
              cn = f" classname={d['classname']}" if d['classname'] else ''
              return f"{d['type']}{cn}"

          def w(fh, s=''):
              fh.write(s + '\n')

          with open('out/entity-survey.md', 'w', encoding='utf-8') as fh:
              w(fh, '# Entity survey of dl_example.vmap (keyvalues2_noids)')
              w(fh)
              w(fh, f'elements referenced MORE THAN ONCE (carry an id): {ids}')
              w(fh)

              # ------------------------------------------------ TEST 1
              w(fh, '## Is CVisibilityMgr.nodes exhaustive?')
              w(fh)
              world = None
              vis = None
              for k in reflists:
                  if k.endswith('.children') and k.startswith('CMapWorld'):
                      world = k
                  if k.endswith('.nodes') and k.startswith('CVisibilityMgr'):
                      vis = k
              w(fh, '| array | references |')
              w(fh, '|---|---|')
              for k in sorted(reflists):
                  w(fh, f'| {k} | {len(reflists[k])} |')
              w(fh)
              if world and vis:
                  ws, vs = set(reflists[world]), set(reflists[vis])
                  only_w = ws - vs
                  only_v = vs - ws
                  w(fh, f'in world children but NOT in visibility nodes: {len(only_w)}')
                  for g in sorted(only_w):
                      w(fh, f'- {describe(g)}')
                  w(fh)
                  w(fh, f'in visibility nodes but NOT in world children: {len(only_v)}')
                  for g in sorted(only_v):
                      w(fh, f'- {describe(g)}')
                  w(fh)
                  # Path nodes are the case that matters: they are referenced
                  # from a CMapPath, not from the world. If the visibility
                  # array skips them, it is not a manifest of every element.
                  pathkids = set()
                  for k, v in reflists.items():
                      if k.startswith('CMapPath.'):
                          pathkids |= set(v)
                  w(fh, f'nodes referenced by a CMapPath: {len(pathkids)}')
                  w(fh, f'  of those, also in visibility nodes: {len(pathkids & vs)}')
                  w(fh, f'  of those, also in world children:  {len(pathkids & ws)}')
              else:
                  w(fh, 'Could not find both arrays. world=' + str(world) +
                        ' vis=' + str(vis))
              w(fh)

              w(fh, '## Property tuples')
              w(fh)
              for cn, keyset in tuple_keys.items():
                  w(fh, f'### {cn} — ' + ', '.join(keyset))
                  seen = tuples[cn]
                  if not seen:
                      w(fh, '- none found')
                      w(fh)
                      continue
                  w(fh, '')
                  w(fh, '| ' + ' | '.join(keyset) + ' | count |')
                  w(fh, '|' + '---|' * (len(keyset) + 1))
                  for t, c in sorted(seen.items()):
                      w(fh, '| ' + ' | '.join(t) + f' | {c} |')
                  total = sum(seen.values())
                  uniq = len(seen)
                  every_once = all(c == 1 for c in seen.values())
                  every_twice = all(c == 2 for c in seen.values())
                  w(fh, '')
                  w(fh, f'  {total} total, {uniq} distinct combination(s)')
                  if cn == 'lane_marker_path':
                      slots = sorted({t[keyset.index('LaneSlot')] for t in seen}) \
                          if 'LaneSlot' in keyset else []
                      lanes = sorted({t[keyset.index('lanenum')] for t in seen}) \
                          if 'lanenum' in keyset else []
                      w(fh, f'  lanes seen: {lanes}')
                      w(fh, f'  slots seen: {slots}')
                      if every_once:
                          w(fh, '  VERDICT: each (lane, slot) appears ONCE.')
                          w(fh, '  The path is SHARED between the teams and runs')
                          w(fh, '  the full length of the lane. batch13 must NOT')
                          w(fh, '  mirror lane paths.')
                      elif every_twice:
                          w(fh, '  VERDICT: each (lane, slot) appears TWICE.')
                          w(fh, '  Paths are PER TEAM and the mirroring is right.')
                      else:
                          w(fh, '  VERDICT: mixed counts — read the table, the')
                          w(fh, '  simple shared/per-team split does not hold.')
                  w(fh)

              w(fh, '## Element types')
              w(fh, '')
              w(fh, '| count | type |')
              w(fh, '|---|---|')
              for t, c in types.most_common():
                  w(fh, f'| {c} | {t} |')
              w(fh)
              w(fh, '## Element references, by holder')
              w(fh)
              if refs:
                  for n, c in refs.most_common():
                      w(fh, f'- {n}: {c}')
              else:
                  w(fh, '- NONE. Nothing in this map is referenced by id.')
              w(fh)
              w(fh, '## Inline nesting: which types sit under which attribute')
              w(fh)
              for n, c in childof.most_common(60):
                  w(fh, f'- {n}: {c}')
              w(fh)
              w(fh, '## Classnames')
              w(fh)
              w(fh, '| count | classname |')
              w(fh, '|---|---|')
              for cn, c in classes.most_common():
                  w(fh, f'| {c} | {cn} |')
              w(fh)
              w(fh, '## Keys per classname')
              for cn, _ in classes.most_common():
                  w(fh)
                  w(fh, f'### {cn}')
                  for k, c in keys[cn].most_common():
                      w(fh, f'- {k} ({c})')

          with open('out/excerpts.md', 'w', encoding='utf-8') as fh:
              w(fh, '# Verbatim subtrees')
              w(fh)
              w(fh, 'Indented from the capture root. Truncated per the caps in env.')
              for kind, blocks in sorted(excerpts.items()):
                  for i, b in enumerate(blocks):
                      w(fh)
                      w(fh, f'## {kind} [{i}]')
                      w(fh)
                      w(fh, '```')
                      for ln in b:
                          w(fh, ln)
                      w(fh, '```')

          json.dump({
              'ids': ids,
              'types': dict(types),
              'refs': dict(refs),
              'reflists': {k: v for k, v in reflists.items()},
              'idinfo': idinfo,
              'childof': dict(childof),
              'classes': dict(classes),
              'tuples': {k: {'|'.join(t): c for t, c in v.items()}
                         for k, v in tuples.items()},
              'keys': {k: dict(v) for k, v in keys.items()},
          }, open('out/entity-survey.json', 'w'), indent=1)

          # A parse that is working reports 222 CMapMesh and 767 ids on this
          # fixture. Both were confirmed on the previous run. If either is
          # wrong, nothing else in the report is safe.
          print('CMapMesh:', types.get('CMapMesh'), '(want 222)')
          print('elements with an id:', ids, '(want 767)')
          print('described ids:', len(idinfo))
          for k in sorted(reflists):
              print(f'  {k}: {len(reflists[k])}')

      - name: What landed
        if: always()
        shell: bash
        run: |
          ls -l out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entity-survey
          path: out/
