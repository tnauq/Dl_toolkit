name: plan roundtrip

# Q16, the identity check that was agreed and never built.
#
#   sealed-room.mapplan.json
#     -> dl emit      -> KV2 text
#     -> dmxconvert   -> binary vmap 40      <- Valve accepts it
#     -> dmxconvert   -> KV2 text
#     -> dl verify    -> compared BACK to the plan
#
# WHY THIS IS NOT emit-smoke. emit-smoke counts elements. A box emitted at
# half size, a spawn that lost its teamnumber, or a material silently
# replaced would all pass a census untouched. This asserts the map still
# MEANS the plan: every origin, extent, angle and keyvalue.
#
# Extents are RECOMPUTED from the vertex positions in the file, not read
# from a field, so a geometry bug cannot hide behind matching metadata.
#
# Comparison is to 0.1 units (2.5 mm), not exact: values make a float round
# trip through text twice, and asserting equality would fail on noise
# instead of on error.

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/Deadlock.Format/Dmx/**'
      - 'src/Deadlock.Contracts/MapPlan.cs'
      - 'examples/*.mapplan.json'

env:
  PLAN: examples/sealed-room.mapplan.json

jobs:
  roundtrip:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build
        shell: bash
        run: |
          set -uo pipefail
          RC=0
          dotnet build src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -c Release > build.txt 2>&1 || RC=$?
          cat build.txt
          [ "$RC" -eq 0 ] || exit 1

      - name: Emit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p work out
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- emit "$PLAN" work/t1.vmap > out/emit.txt 2>&1 || RC=$?
          cat out/emit.txt
          [ "$RC" -eq 0 ] || exit 1

      # Verify our OWN text first. If this fails, the emitter and reader
      # disagree and nothing downstream is worth running.
      - name: Verify before Valve touches it
        shell: bash
        run: |
          set -uo pipefail
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- verify "$PLAN" work/t1.vmap > out/verify-pre.txt 2>&1 || RC=$?
          cat out/verify-pre.txt
          [ "$RC" -eq 0 ] || exit 1

      - name: Fetch, reassemble, extract
        id: get
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess, shutil

          repo = os.environ['GITHUB_REPOSITORY']
          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/csdk-12'],
              capture_output=True, text=True, check=True).stdout)
          assets = rel['assets']
          if not assets:
              print("::error::no assets on release"); sys.exit(1)

          os.makedirs('dl', exist_ok=True)
          for a in assets:
              with open(os.path.join('dl', a['name']), 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          if not files:
              print("::error::no zip parts"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              if open(sums).read().split()[0] != h.hexdigest():
                  print("::error::checksum mismatch"); sys.exit(1)

          with zipfile.ZipFile('bin_cs2.zip') as z:
              z.extractall('csdk')
          ghosts = os.path.join('csdk', '__MACOSX')
          if os.path.isdir(ghosts): shutil.rmtree(ghosts)

          conv = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'dmxconvert.exe':
                      conv = os.path.abspath(os.path.join(root, f))
          if not conv:
              print("::error::dmxconvert.exe missing"); sys.exit(1)
          print("dmxconvert:", conv)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"conv={conv}\n")

      - name: Through the binary and back
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          RC=0
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/work/t1.vmap" -ie keyvalues2_noids \
            -o "$ROOT/work/room.vmap" -oe binary -of vmap > out/conv1.txt 2>&1 || RC=$?
          cat out/conv1.txt
          [ -s work/room.vmap ] || { echo "FAIL: dmxconvert rejected our text"; exit 1; }
          echo -n "header: "; head -c 60 work/room.vmap | tr -d '\0'; echo

          RC=0
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/work/room.vmap" -ie binary \
            -o "$ROOT/work/t2.vmap" -oe keyvalues2 > out/conv2.txt 2>&1 || RC=$?
          cat out/conv2.txt
          [ -s work/t2.vmap ] || { echo "FAIL: could not re-text"; exit 1; }
          wc -c work/t1.vmap work/room.vmap work/t2.vmap

      - name: Verify after the round trip
        shell: bash
        run: |
          set -uo pipefail
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- verify "$PLAN" work/t2.vmap > out/verify-post.txt 2>&1 || RC=$?
          cat out/verify-post.txt
          [ "$RC" -eq 0 ] || exit 1
          echo
          echo "RESULT: the plan survives emit -> binary -> text intact."
          echo "STRUCTURALLY VALID and semantically unchanged. Still not"
          echo "'Hammer opens it' and still not 'Deadlock loads it'."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-roundtrip
          path: |
            out/
            build.txt
          if-no-files-found: ignore
