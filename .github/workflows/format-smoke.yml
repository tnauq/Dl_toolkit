name: format smoke

# Validates the Format layer end to end with NO game files at all.
#
# The archive under test is GENERATED, not committed:
#   dl-mkfixture writes a VPK from known content and reports checksums it
#   computed itself; dl-extract reads the same archive back; compare.py asserts
#   they agree. That is what actually verifies PackageEntry.CRC32 means the
#   CRC32 of file contents — the assumption dl-diff's whole design rests on.
#
# Also checked: the build, layer boundaries, the exit-code contract, and
# byte-identical output across repeated runs.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Preflight - repo tree intact
        run: |
          MISSING=""
          for d in src/Deadlock.Contracts src/Deadlock.Format \
                   src/Deadlock.Tools src/Deadlock.MakeFixture; do
            [ -d "$d" ] || MISSING="$MISSING $d"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing directories:$MISSING"
            echo "Commit is incomplete - files were likely copied flat."
            find . -type f -not -path './.git/*' | sort
            exit 1
          fi
          echo "tree ok"

      - name: Restore and build
        run: |
          rm -f Deadlock.sln Deadlock.slnx
          dotnet new sln -n Deadlock
          dotnet sln add $(find src -name '*.csproj')
          dotnet build -c Release --nologo

      - name: Enforce layer boundaries
        run: |
          if [ -d src/Deadlock.Transform ] && \
             grep -rl 'ValvePak\|ValveResourceFormat' src/Deadlock.Transform | grep -q .; then
            echo "::error::Deadlock.Transform references a binary-format library. See TOOLING.md section 1."
            exit 1
          fi
          if grep -q 'Deadlock.Tools\|Deadlock.Harness\|Deadlock.MakeFixture' \
                  src/Deadlock.Format/*.csproj; then
            echo "::error::Deadlock.Format references a layer above it."
            exit 1
          fi
          echo "layer boundaries ok"

      - name: Missing-fixture contract
        run: |
          set +e
          dotnet run --project src/Deadlock.Tools -c Release --no-build -- \
            /nonexistent.vpk > out.json
          CODE=$?
          set -e
          [ "$CODE" -eq 3 ] || { echo "::error::expected exit 3, got $CODE"; exit 1; }
          grep -q FIXTURE_MISSING out.json || { echo "::error::missing error code"; exit 1; }
          echo "exit-code contract ok"

      - name: Generate a VPK
        run: |
          dotnet run --project src/Deadlock.MakeFixture -c Release --no-build -- \
            build/synthetic_dir.vpk > manifest.json
          ls -la build/

      - name: Read it back
        run: |
          dotnet run --project src/Deadlock.Tools -c Release --no-build -- \
            build/synthetic_dir.vpk > index-a.json
          dotnet run --project src/Deadlock.Tools -c Release --no-build -- \
            build/synthetic_dir.vpk > index-b.json
          diff -q index-a.json index-b.json \
            || { echo "::error::output not deterministic across runs"; exit 1; }
          echo "determinism ok"

      - name: Verify round trip
        run: python3 compare.py manifest.json index-a.json

      - name: Determinism of the writer
        run: |
          mv build/synthetic_dir.vpk build/first.vpk
          dotnet run --project src/Deadlock.MakeFixture -c Release --no-build -- \
            build/synthetic_dir.vpk > /dev/null
          if cmp -s build/first.vpk build/synthetic_dir.vpk; then
            echo "writer is byte-deterministic"
          else
            echo "::warning::VPK writer output is not byte-identical across runs."
            echo "Not fatal, but content-addressed caching must key on the"
            echo "manifest rather than the archive bytes. Record in FINDINGS.md."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: |
            *.json
          if-no-files-found: ignore
