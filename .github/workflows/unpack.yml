name: unpack zip
on: workflow_dispatch

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip at root
        run: |
          ZIP=$(find . -maxdepth 2 -name 'deadlock-toolkit.zip' | head -1)
          [ -n "$ZIP" ] || { echo "::error::zip not found"; exit 1; }
          unzip -o "$ZIP" -x '.github/workflows/*' -d .
          rm -f "$ZIP"
          rm -f .github/workflows/unpack.yml
          find . -type f -not -path './.git/*' | sort

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.nore
