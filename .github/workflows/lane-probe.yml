name: lane probe

# TWO FOLLOW-UPS FROM npc-probe, which found npc_boss_tier2's size is not
# written out but delegated (m_navHull = 2), and found NO lane numbering
# anywhere in the vdata.
#
# 1. HOW BIG IS NAV HULL 2? scripts/nav_hulls.vdata is 628 bytes, so it is
#    dumped WHOLE rather than searched. The hull is the walker's collision
#    size, which is the clearance a map has to leave. For scale, the voxel in
#    walkcheck.py is 26.70 and the gen_man figure is 98.00 tall.
#
# 2. WHAT LANE NUMBERS DOES A 3-LANE MAP USE? npc-probe searched only *.vdata
#    and found nothing, so this widens the sparse checkout to the other text
#    in the tree — localization, panorama, config — and searches that. Lane
#    NAMES are searched alongside the numeric keys, because the wiki records
#    the modern lanes as York, Broadway and Park (Greenwich), and a file that
#    maps a name to an index answers the question directly.
#
# WHAT A NULL RESULT MEANS HERE. If lane numbering appears nowhere in shipped
# text either, then it lives only in compiled code, and dl_example's 1/3/4/6
# stays the only sample there is — from a FOUR-lane map. That is a real
# finding and it should be recorded rather than worked around: placing
# trooper spawns on a guessed lanenum fails silently in game.

on: workflow_dispatch

env:
  # Numeric keys, then the lane names from the modern map.
  NEEDLES: 'lanenum,lane_number,LaneSlot,m_nLane,lane_count,num_lanes,lane_marker_path,ELane,York,Broadway,Greenwich'
  # Dumped whole, not searched. Small files only.
  DUMP: 'nav_hulls.vdata,nav_hulls_presets.vdata'
  CONTEXT: 6
  MAX_HITS: 12

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Wider than npc-probe's checkout: text of every kind, not just vdata.
      # Binary blobs are excluded by pattern rather than by size, so a big
      # localization file is still fetched.
      - name: Clone GameTracking (text)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SteamDatabase/GameTracking-Deadlock.git gt
          cd gt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone \
            '/**/*.vdata' '/**/*.txt' '/**/*.js' '/**/*.vjs' '/**/*.xml' \
            '/**/*.css' '/**/*.vcss' '/**/*.kv3' '/**/*.cfg' '/**/*.gi' \
            '/**/*.json' '/**/*.res'
          echo "$(git rev-parse --short HEAD)" > ../gt-sha.txt
          cat ../gt-sha.txt

      - name: Inventory
        run: |
          set -euo pipefail
          mkdir -p out
          find gt -type f -not -path '*/.git/*' -printf '%s\t%p\n' \
            | sort -rn > out/files.txt
          wc -l out/files.txt
          echo "--- by extension ---"
          awk -F'\t' '{n=split($2,a,"."); print a[n]}' out/files.txt \
            | sort | uniq -c | sort -rn | head -20

      - name: Dump the small files whole
        run: |
          set -euo pipefail
          : > out/dumped.md
          IFS=',' read -ra NAMES <<< "$DUMP"
          for n in "${NAMES[@]}"; do
            F=$(find gt -name "$n" -not -path '*/.git/*' | head -1)
            if [ -z "$F" ]; then
              echo "## $n — NOT FOUND" >> out/dumped.md
              echo "::warning::$n not found"
              continue
            fi
            {
              echo "## $F"
              echo ""
              echo '```'
              cat "$F"
              echo '```'
              echo ""
            } >> out/dumped.md
          done
          cat out/dumped.md

      - name: Search for lane numbering
        timeout-minutes: 20
        run: |
          python3 - <<'PY' | tee out/lane-probe.log
          import os, re, json, collections

          needles = os.environ['NEEDLES'].split(',')
          ctx = int(os.environ['CONTEXT'])
          max_hits = int(os.environ['MAX_HITS'])

          files = []
          for line in open('out/files.txt'):
              size, path = line.rstrip('\n').split('\t', 1)
              files.append(path)
          print(f'{len(files)} files')

          hits = collections.defaultdict(list)
          values = collections.defaultdict(collections.Counter)
          # Key = value and "key" "value", both spellings appear in the tree.
          pair = re.compile(r'^[\s"]*([A-Za-z_][A-Za-z0-9_]*)["\s]*[=:]\s*"?([^",\n]*)')

          for path in files:
              try:
                  text = open(path, 'r', encoding='utf-8', errors='replace').read()
              except Exception:
                  continue
              if '\x00' in text[:4096]:
                  continue          # binary that slipped through by extension
              lines = text.split('\n')
              for i, line in enumerate(lines):
                  for n in needles:
                      if n in line:
                          hits[n].append((path, i, line.strip()[:200]))
                          m = pair.match(line.strip())
                          if m and m.group(1) == n:
                              values[n][m.group(2).strip()] += 1

          def w(fh, s=''):
              fh.write(s + '\n')
              print(s)

          sha = open('gt-sha.txt').read().strip()
          with open('out/lane-probe.md', 'w') as fh:
              w(fh, '# Lane probe')
              w(fh)
              w(fh, f'GameTracking {sha}')
              w(fh)
              for n in needles:
                  w(fh, f'## {n}')
                  if not hits[n]:
                      w(fh, '- found NOWHERE in the shipped text')
                      w(fh)
                      continue
                  where = collections.Counter(p for p, _, _ in hits[n])
                  for p, c in where.most_common(8):
                      w(fh, f'- {p}: {c}')
                  if values[n]:
                      w(fh, '  values: ' +
                            ', '.join(f'{v} x{c}' for v, c in values[n].most_common(12)))
                  w(fh)
                  w(fh, '  first lines:')
                  for p, i, line in hits[n][:max_hits]:
                      w(fh, f'    {p}:{i}  {line}')
                  w(fh)

              # The question, answered plainly rather than left in the tables.
              w(fh, '## Verdict')
              w(fh)
              numeric = [n for n in ('lanenum', 'lane_number', 'm_nLane')
                         if hits[n]]
              named = [n for n in ('York', 'Broadway', 'Greenwich') if hits[n]]
              if numeric:
                  w(fh, 'Lane numbering IS present in shipped text: ' +
                        ', '.join(numeric) + '. Read the values above.')
              elif named:
                  w(fh, 'No numeric key, but the lane NAMES appear: ' +
                        ', '.join(named) + '. If a file lists them in order,')
                  w(fh, 'that ordering is the best evidence available for which')
                  w(fh, 'index belongs to which lane.')
              else:
                  w(fh, 'NOTHING. Lane numbering exists only in compiled code.')
                  w(fh, "dl_example's 1/3/4/6 stays the only sample, and it is")
                  w(fh, 'from a four-lane map. Do not guess a three-lane set;')
                  w(fh, 'ask someone who has shipped one.')

          json.dump({
              'values': {k: dict(v) for k, v in values.items()},
              'counts': {k: len(v) for k, v in hits.items()},
          }, open('out/lane-probe.json', 'w'), indent=1)

          print()
          for n in needles:
              print(f'{n}: {len(hits[n])}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-probe
          path: out/
          if-no-files-found: ignore
