name: probe compiler
on: workflow_dispatch

# PROBE (b): does the Deadlock CSDK's resourcecompiler.exe run headless on a
# GitHub Windows runner, and what layout does it expect?
#
# Needs csdk/ committed with resourcecompiler.exe and its DLLs. Until then it
# reports what is missing and exits 3, not failure.

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the compiler
        id: find
        shell: bash
        run: |
          RC=""
          if [ -d csdk ]; then
            RC=$(find csdk -iname 'resourcecompiler.exe' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$RC" ]; then
            echo "::warning::No resourcecompiler.exe under csdk/"
            echo "Commit the CSDK bin_cs2/win64 slice, then re-run."
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            echo "found=$RC" >> "$GITHUB_OUTPUT"
            echo "found: $RC"
            ls -la "$(dirname "$RC")" | head -40
          fi

      - name: Missing dependency
        if: steps.find.outputs.found == ''
        shell: bash
        run: |
          echo "csdk/ not present - nothing to probe"
          exit 3

      - name: Does it run at all
        if: steps.find.outputs.found != ''
        shell: bash
        run: |
          RC="${{ steps.find.outputs.found }}"
          set +e
          "$RC" > usage.txt 2>&1
          echo "exit: $?"
          set -e
          head -60 usage.txt || true
          echo "--- printed usage without hanging? that is the headline result ---"

      - name: Build a source vdata
        if: steps.find.outputs.found != ''
        shell: bash
        run: |
          mkdir -p content/citadel_addons/probe/scripts
          cat > content/citadel_addons/probe/scripts/probe.vdata <<'VD'
          <!-- kv3 encoding:text:version{e21c7f3c-8a33-41c5-9977-a76d3a32aa0d} format:generic:version{7412167c-06e9-4698-aff2-e63eb59037e7} -->
          {
            probe_value = 1
          }
          VD
          find content -type f

      - name: Try compiling it
        if: steps.find.outputs.found != ''
        shell: bash
        run: |
          RC="${{ steps.find.outputs.found }}"
          SRC="$(pwd -W 2>/dev/null || pwd)/content/citadel_addons/probe/scripts/probe.vdata"
          set +e
          "$RC" -nop4 -v -i "$SRC" > compile.txt 2>&1
          echo "exit: $?"
          set -e
          tail -60 compile.txt || true
          echo "--- searching for output ---"
          find . -name '*.vdata_c' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-compiler
          path: |
            usage.txt
            compile.txt
          if-no-files-found: ignore
