name: probe compiler
on: workflow_dispatch

# PROBE (b): does the Deadlock CSDK's resourcecompiler.exe run headless here?
#
# CSDK is split across release assets on tag csdk-12. Mobile renamed the parts
# to "bin cs2.zip", "bin cs2 2.zip" ... "bin cs2 14.zip" (GitHub turns spaces
# into dots). Order is derived from the trailing number, unnumbered = 1, and
# confirmed by SHA256 - if the checksum passes, the order was right.

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and reassemble the CSDK
        id: get
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ready=" >> "$GITHUB_OUTPUT"
          mkdir -p dl && cd dl

          set +e
          gh release download csdk-12 --clobber
          set -e

          echo "--- assets as downloaded ---"
          ls -la || true

          COUNT=0
          for f in *; do [ -f "$f" ] && COUNT=$((COUNT+1)); done
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No assets downloaded - if you just uploaded, wait and re-run"
            gh release list || true
            exit 0
          fi

          mv SHA256SUMS.txt ../ 2>/dev/null || true

          # order: trailing number before .zip, unnumbered counts as 1
          for f in *; do
            [ -f "$f" ] || continue
            n=$(printf '%s' "$f" | sed -n 's/.*[^0-9]\([0-9]\{1,\}\)\.zip$/\1/p')
            [ -z "$n" ] && n=1
            printf '%05d\t%s\n' "$n" "$f"
          done | sort -n > ../order.txt

          echo "--- concatenation order ---"
          cat ../order.txt
          cd ..

          : > bin_cs2.zip
          while IFS=$'\t' read -r n f; do
            cat "dl/$f" >> bin_cs2.zip
          done < order.txt
          ls -la bin_cs2.zip

          if [ -f SHA256SUMS.txt ]; then
            if sha256sum -c SHA256SUMS.txt; then
              echo "checksum OK - reassembly correct"
            else
              echo "::error::checksum mismatch. Order used:"
              cat order.txt
              exit 1
            fi
          else
            echo "::warning::no SHA256SUMS.txt - cannot confirm order"
          fi

          unzip -q bin_cs2.zip -d csdk || { echo "::error::unzip failed"; exit 1; }
          COMP=$(find csdk -iname 'resourcecompiler.exe' | head -1)
          if [ -z "$COMP" ]; then
            echo "::warning::archive has no resourcecompiler.exe"
            exit 0
          fi
          echo "ready=$COMP" >> "$GITHUB_OUTPUT"
          echo "found: $COMP"

      - name: Does it run at all
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          set +e
          "${{ steps.get.outputs.ready }}" > usage.txt 2>&1
          echo "exit: $?"
          set -e
          head -60 usage.txt || true

      - name: Build a source vdata
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          mkdir -p content/citadel_addons/probe/scripts
          cat > content/citadel_addons/probe/scripts/probe.vdata <<'VD'
          <!-- kv3 encoding:text:version{e21c7f3c-8a33-41c5-9977-a76d3a32aa0d} format:generic:version{7412167c-06e9-4698-aff2-e63eb59037e7} -->
          {
            probe_value = 1
          }
          VD
          find content -type f

      - name: Try compiling it
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          SRC="$(pwd -W 2>/dev/null || pwd)/content/citadel_addons/probe/scripts/probe.vdata"
          set +e
          "${{ steps.get.outputs.ready }}" -nop4 -v -i "$SRC" > compile.txt 2>&1
          echo "exit: $?"
          set -e
          tail -80 compile.txt || true
          echo "--- searching for output ---"
          find . -name '*.vdata_c' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-compiler
          path: |
            usage.txt
            compile.txt
          if-no-files-found: ignore
