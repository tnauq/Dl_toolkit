name: probe compiler

# Closes the one remaining gap from FINDINGS "Compiling":
#
#   Application unable to load gameinfo.gi file from directory "game\citadel"
#
# The compiler needs a game directory to build FOR. `-game <path>` names it.
#
# PATH RESOLUTION — read off gameinfo.gi 2026-08-12, not inferred. The file
# comments that "Search paths are relative to the exe directory\..\" and
# declares two mounts, `Game citadel` and `Game core`. What the compiler
# actually printed shows the rule:
#
#   GAMEROOT  = the CURRENT WORKING DIRECTORY
#   GAME      = GAMEROOT + "citadel"   and   GAMEROOT + "core"
#   CONTENT   = GAMEROOT\..\content\<game>
#
# Therefore the compiler must be RUN FROM build/game. Every earlier failure
# was working directory: from the repo root, CONTENT resolved outside the repo
# entirely, and "Failed to split full path ... FS: Tried to FileExists NULL"
# is the compiler reporting that the input lies under no content mount.
#
# CONFIRMED 2026-08-12. Running from build/game, the compiler split the input
# correctly — ContentRoot=build/content/, ModName=citadel,
# RelativePath=scripts/... — and reached actual compilation. Path resolution
# is SOLVED. The only remaining failure was the toy fixture being invalid:
#   RESOURCE COMPILE ERROR: VData must have a 'generic_data_type' key
# so the input is now a real vdata from GameTracking instead.
# gameinfo.gi is fetched from GameTracking-Deadlock rather than written by
# hand — a synthesized approximation that the compiler rejects would look
# identical to the compiler not accepting the flag, and the two need telling
# apart.
#
# Layout built here, which is the standard Source 2 shape:
#
#   build/game/citadel/gameinfo.gi     what -game points at
#   build/content/citadel/scripts/     where source assets live
#
# ANSWERED 2026-08-12: -game DOES work, and must name the directory holding
# gameinfo.gi (build/game/citadel), not its parent — pointing at build/game
# failed instantly with the original error. The compiler then loaded the file,
# resolved its whole search-path table, and ran on for 50+ lines before dying
# on a DIFFERENT problem:
#
#   CAppSystemDict:Unable to load module modtools (Dependency of application),
#   error 126
#
# 126 is ERROR_MOD_NOT_FOUND. SETTLED 2026-08-12: the Reduced CSDK simply does
# not ship modtools — zero matches across its 128 real DLLs, and retries with
# both bin dirs on PATH and with the compiler dir as CWD failed identically,
# which ruled out resolution as the cause. The upload was complete and
# checksum-verified; only bin_cs2 was ever uploaded, and modtools lives
# elsewhere in the CSDK tree.
#
# It is now a LOOSE release asset on csdk-12, copied beside the compiler by the
# fetch step. Its static imports are only KERNEL32 and tier0.dll (tier0 already
# present), so no further missing module is predictable from the binary —
# though a runtime LoadLibrary could still surface one.
#
# The hundreds of "Failed loading resource ... vmat_c" lines above the crash
# are NOT the problem; that is the compiler booting without a content tree and
# carrying on regardless.

on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, reassemble, extract
        id: get
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess

          repo = os.environ['GITHUB_REPOSITORY']

          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/csdk-12'],
              capture_output=True, text=True, check=True).stdout)

          assets = rel['assets']
          print(f"assets: {len(assets)}")
          if not assets:
              print("::error::no assets on release"); sys.exit(1)

          os.makedirs('dl', exist_ok=True)
          for a in assets:
              dest = os.path.join('dl', a['name'])
              print(f"  downloading {a['name']} ({a['size']} bytes)")
              with open(dest, 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)
              print(f"    -> {os.path.getsize(dest)} bytes on disk")

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          print("order:")
          for f in files:
              print(f"  {ordinal(f):2d}  {f}  {os.path.getsize(os.path.join('dl', f))}")
          if len(files) == 0:
              print("::error::no zip parts after download"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          got = h.hexdigest()
          print(f"reassembled {os.path.getsize('bin_cs2.zip')} bytes")
          print(f"sha256 {got}")

          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != got:
                  print(f"::error::checksum mismatch, expected {want}"); sys.exit(1)
              print("checksum OK")

          with zipfile.ZipFile('bin_cs2.zip') as z:
              print(f"archive holds {len(z.namelist())} entries")
              z.extractall('csdk')

          # The CSDK was zipped on macOS: __MACOSX holds AppleDouble `._`
          # stubs that shadow every real file (128 real DLLs, 128 ghosts).
          # Harmless to the compiler, but anything walking the tree by name
          # sees doubles, so remove it. (Found 2026-08-12.)
          import shutil
          ghosts = os.path.join('csdk', '__MACOSX')
          if os.path.isdir(ghosts):
              shutil.rmtree(ghosts)
              print("removed the __MACOSX shadow tree")

          comp = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'resourcecompiler.exe':
                      comp = os.path.abspath(os.path.join(root, f))
          print("compiler:", comp or "NOT FOUND")

          # modtools.dll is NOT in the Reduced CSDK bin (verified 2026-08-12:
          # zero matches across 128 real DLLs), and the compiler loads it as an
          # application dependency — error 126 before any work begins. It ships
          # as a LOOSE release asset on the csdk-12 tag and is copied in here.
          # Its own static imports are only KERNEL32 and tier0.dll, and tier0
          # is already in bin_cs2/win64, so no further chain is predictable.
          loose = os.path.join('dl', 'modtools.dll')
          if comp and os.path.exists(loose):
              dest = os.path.join(os.path.dirname(comp), 'modtools.dll')
              shutil.copy(loose, dest)
              print(f"placed modtools.dll -> {dest} ({os.path.getsize(dest)} bytes)")
          elif not os.path.exists(loose):
              print("::warning::modtools.dll not among the release assets")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"ready={comp}\n")

      - name: Does it run at all
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          set +e
          "${{ steps.get.outputs.ready }}" > usage.txt 2>&1
          echo "exit: $?"
          set -e
          head -60 usage.txt || true

      # ------------------------------------------------------------------
      # NEW — the game directory
      # ------------------------------------------------------------------
      - name: Fetch the real gameinfo.gi
        id: gameinfo
        shell: bash
        run: |
          set -euo pipefail
          # From GameTracking-Deadlock, not written by hand. A hand-made file
          # the compiler rejects is indistinguishable from the compiler
          # rejecting the flag, and those need telling apart.
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SteamDatabase/GameTracking-Deadlock.git gt
          cd gt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/**/gameinfo.gi'
          echo "--- gameinfo.gi found in the tracking repo ---"
          find . -name 'gameinfo.gi' -not -path './.git/*' | tee ../found.txt
          COUNT=$(wc -l < ../found.txt)
          if [ "$COUNT" = "0" ]; then
            echo "::error::no gameinfo.gi in GameTracking-Deadlock"
            exit 3
          fi
          # Prefer the citadel one if several exist.
          SRC=$(grep -m1 'citadel/gameinfo.gi' ../found.txt || head -1 ../found.txt)
          echo "using: $SRC"
          cd ..
          mkdir -p build/game/citadel build/content/citadel
          cp "gt/$SRC" build/game/citadel/gameinfo.gi
          # gameinfo declares TWO mounts: "Game citadel" and "Game core".
          # core is a real search path and the tracking repo has its gameinfo.
          if [ -f gt/game/core/gameinfo.gi ]; then
            mkdir -p build/game/core build/content/core
            cp gt/game/core/gameinfo.gi build/game/core/gameinfo.gi
            echo "copied core gameinfo too"
          else
            echo "::warning::no core gameinfo.gi in the tracking repo"
          fi
          echo "--- contents ---"
          cat build/game/citadel/gameinfo.gi
          echo "found=1" >> "$GITHUB_OUTPUT"

      - name: Stage a REAL vdata as the compile input
        id: input
        shell: bash
        run: |
          set -euo pipefail
          # The toy fixture `{ probe_value = 1 }` failed with
          #   RESOURCE COMPILE ERROR: VData must have a 'generic_data_type' key
          # which is correct — a vdata declares its type. Rather than invent
          # that key, compile a real file from GameTracking. It is also the
          # better test: real vdata is exactly what dl-patch emits.
          mkdir -p build/content/citadel/scripts
          git -C gt sparse-checkout set --no-cone '/**/gameinfo.gi' '/**/*.vdata'
          echo "--- smallest vdata files carrying generic_data_type ---"
          find gt -name '*.vdata' -not -path '*/.git/*' -printf '%s\t%p\n' \
            | sort -n > all-vdata.txt
          head -10 all-vdata.txt
          PICK=""
          while IFS=$'\t' read -r size path; do
            if grep -q 'generic_data_type' "$path" 2>/dev/null; then
              PICK="$path"; PICKSZ="$size"; break
            fi
          done < all-vdata.txt
          if [ -z "$PICK" ]; then
            echo "::error::no vdata with generic_data_type found"
            exit 3
          fi
          echo "picked: $PICK ($PICKSZ bytes)"
          echo "--- its declared type ---"
          grep -m1 'generic_data_type' "$PICK"
          NAME=$(basename "$PICK")
          cp "$PICK" "build/content/citadel/scripts/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "--- head of the staged input ---"
          head -8 "build/content/citadel/scripts/$NAME"
          find build -type f | head -20

      # READ OFF gameinfo.gi, not guessed. The file says search paths are
      # relative, and the table the compiler printed shows how:
      #
      #   GAMEROOT   = the CURRENT WORKING DIRECTORY
      #   GAME       = GAMEROOT + "citadel"        (from `Game citadel`)
      #   CONTENT    = GAMEROOT\..\content\citadel
      #
      # So GAMEROOT must be the directory CONTAINING citadel/ — that is
      # build/game — and content then resolves to build/content/citadel, which
      # is where the source already sits. Earlier attempts failed purely on
      # working directory: from the repo root CONTENT landed outside the repo,
      # and "Failed to split full path" is the compiler saying the input is not
      # under any content mount.
      - name: A — run from build/game so GAMEROOT is correct
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          cd build/game
          echo "cwd: $(pwd -W 2>/dev/null || pwd)"
          set +e
          "${{ steps.get.outputs.ready }}" -nop4 -v \
            -game citadel \
            -i "$ROOT/build/content/citadel/scripts/${{ steps.input.outputs.name }}" > "$ROOT/compile-a.txt" 2>&1
          echo "exit: $?"
          set -e
          cd "$ROOT"
          echo "--- search paths as resolved ---"
          grep -A6 "^CONTENT" compile-a.txt | head -12 || true
          tail -20 compile-a.txt || true

      # Fallback: relative input path, in case it wants the input expressed
      # relative to the content mount rather than absolute.
      - name: B — same, with a content-relative input
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          cd build/game
          set +e
          "${{ steps.get.outputs.ready }}" -nop4 -v \
            -game citadel \
            -i "../content/citadel/scripts/${{ steps.input.outputs.name }}" > "$ROOT/compile-b.txt" 2>&1
          echo "exit: $?"
          set -e
          cd "$ROOT"
          tail -20 compile-b.txt || true

      - name: Inventory the CSDK for modtools
        if: steps.get.outputs.ready != ''
        id: inv
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(dirname "${{ steps.get.outputs.ready }}")
          echo "compiler dir: $BIN"
          echo "--- anything named modtools, anywhere in the CSDK ---"
          find csdk -iname '*modtools*' | tee modtools.txt || true
          COUNT=$(wc -l < modtools.txt || echo 0)
          echo "modtools matches: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "--- dll count by directory ---"
          find csdk -iname '*.dll' | sed 's|/[^/]*$||' | sort | uniq -c | sort -rn | head -10
          echo "--- first 40 dlls beside the compiler ---"
          ls -1 "$BIN"/*.dll 2>/dev/null | head -40 || true
          echo "--- full inventory written to csdk-dlls.txt ---"
          find csdk -iname '*.dll' | sort > csdk-dlls.txt
          wc -l csdk-dlls.txt

      - name: What landed
        if: always()
        shell: bash
        run: |
          echo "=== did the compile succeed? ==="
          grep -E "^ *(ERROR|Success|[0-9]+ compiled)" compile-a.txt 2>/dev/null | tail -5 || true
          grep "RESOURCE COMPILE ERROR" compile-a.txt 2>/dev/null || echo "no resource compile error"
          echo "=== compiled output ==="
          FOUND=$(find . -name '*.vdata_c' -not -path './csdk/*' 2>/dev/null | tee compiled.txt | wc -l)
          echo "vdata_c files: $FOUND"
          cat compiled.txt || true
          echo "=== build tree after ==="
          find build -type f 2>/dev/null | head -40 || true
          echo "=== did we clear error 126? ==="
          if grep -q "error 126" compile-a.txt 2>/dev/null; then
            echo "NO — still failing on a missing module:"
            grep "Unable to load module" compile-a.txt || true
          else
            echo "YES — no module-load failure in compile-a.txt"
          fi
          echo "=== last 10 lines of compile-a ==="
          tail -10 compile-a.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-compiler
          path: |
            usage.txt
            compile-a.txt
            compile-b.txt
            found.txt
            all-vdata.txt
            modtools.txt
            csdk-dlls.txt
            compiled.txt
          if-no-files-found: ignore
