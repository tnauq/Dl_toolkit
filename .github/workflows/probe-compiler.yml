name: probe compiler
on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the CSDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/csdk-12" > rel.json
          N=$(jq '.assets | length' rel.json)
          echo "asset count: $N"
          [ "$N" -eq 0 ] && { echo "::error::no assets"; exit 1; }
          mkdir -p dl
          jq -r '.assets[] | "\(.id)\t\(.name)"' rel.json | while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/$id" > "dl/$name"
          done

      - name: Reassemble
        id: get
        shell: python
        run: |
          import os, re, hashlib, zipfile, sys

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(name):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', name)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          print("order:")
          for f in files:
              print("  %2d  %s  %d bytes" % (ordinal(f), f, os.path.getsize(os.path.join('dl', f))))

          ords = [ordinal(f) for f in files]
          if len(set(ords)) != len(ords):
              print("::error::duplicate ordinals"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as part:
                      while True:
                          chunk = part.read(1 << 20)
                          if not chunk: break
                          out.write(chunk); h.update(chunk)
          got = h.hexdigest()
          print("reassembled %d bytes, sha256 %s" % (os.path.getsize('bin_cs2.zip'), got))

          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != got:
                  print("::error::checksum mismatch, expected %s" % want); sys.exit(1)
              print("checksum OK")
          else:
              print("::warning::no SHA256SUMS.txt")

          with zipfile.ZipFile('bin_cs2.zip') as z:
              names = z.namelist()
              print("archive holds %d entries" % len(names))
              z.extractall('csdk')

          comp = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'resourcecompiler.exe':
                      comp = os.path.join(root, f); break
          print("compiler:", comp or "NOT FOUND")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write("ready=%s\n" % comp)

      - name: Does it run at all
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          set +e
          "${{ steps.get.outputs.ready }}" > usage.txt 2>&1
          echo "exit: $?"
          set -e
          head -60 usage.txt || true

      - name: Build a source vdata
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          mkdir -p content/citadel_addons/probe/scripts
          cat > content/citadel_addons/probe/scripts/probe.vdata <<'VD'
          <!-- kv3 encoding:text:version{e21c7f3c-8a33-41c5-9977-a76d3a32aa0d} format:generic:version{7412167c-06e9-4698-aff2-e63eb59037e7} -->
          {
            probe_value = 1
          }
          VD
          find content -type f

      - name: Try compiling it
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          SRC="$(pwd -W 2>/dev/null || pwd)/content/citadel_addons/probe/scripts/probe.vdata"
          set +e
          "${{ steps.get.outputs.ready }}" -nop4 -v -i "$SRC" > compile.txt 2>&1
          echo "exit: $?"
          set -e
          tail -80 compile.txt || true
          find . -name '*.vdata_c' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-compiler
          path: |
            usage.txt
            compile.txt
          if-no-files-found: ignore
