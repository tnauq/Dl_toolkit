name: probe compiler
on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and reassemble the CSDK
        id: get
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ready=" >> "$GITHUB_OUTPUT"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/csdk-12" > rel.json || {
            echo "::warning::cannot read release csdk-12"; exit 0; }

          N=$(jq '.assets | length' rel.json)
          echo "asset count: $N"
          [ "$N" -eq 0 ] && { echo "::warning::no assets"; exit 0; }

          mkdir -p dl
          jq -r '.assets[] | "\(.id)\t\(.name)"' rel.json | while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/$id" > "dl/$name"
          done

          # no globbing: list the directory and filter
          ls dl | grep -i '\.zip$' > parts.txt
          echo "--- parts found ---"
          cat parts.txt

          : > ordered.txt
          while read -r b; do
            n=$(printf '%s' "$b" | sed -n 's/^bin\.cs2\.\([0-9]\{1,\}\)\.zip$/\1/p')
            [ -z "$n" ] && n=1
            printf '%05d\t%s\n' "$n" "$b" >> ordered.txt
          done < parts.txt
          sort -n ordered.txt > order.txt

          echo "--- concatenation order ---"
          cat order.txt

          COUNT=$(wc -l < order.txt)
          UNIQ=$(cut -f1 order.txt | sort -u | wc -l)
          [ "$COUNT" -ne "$UNIQ" ] && { echo "::error::duplicate ordinals"; exit 1; }
          echo "parts: $COUNT"

          : > bin_cs2.zip
          while IFS=$'\t' read -r n f; do cat "dl/$f" >> bin_cs2.zip; done < order.txt
          ls -la bin_cs2.zip

          if [ -f dl/SHA256SUMS.txt ]; then
            cp dl/SHA256SUMS.txt .
            sha256sum -c SHA256SUMS.txt || {
              echo "::error::checksum mismatch. Order used:"; cat order.txt; exit 1; }
            echo "checksum OK"
          fi

          unzip -q bin_cs2.zip -d csdk || { echo "::error::unzip failed"; exit 1; }
          COMP=$(find csdk -iname 'resourcecompiler.exe' | head -1)
          [ -z "$COMP" ] && { echo "::warning::no resourcecompiler.exe"; exit 0; }
          echo "ready=$COMP" >> "$GITHUB_OUTPUT"
          echo "found: $COMP"

      - name: Does it run at all
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          set +e
          "${{ steps.get.outputs.ready }}" > usage.txt 2>&1
          echo "exit: $?"
          set -e
          head -60 usage.txt || true

      - name: Build a source vdata
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          mkdir -p content/citadel_addons/probe/scripts
          cat > content/citadel_addons/probe/scripts/probe.vdata <<'VD'
          <!-- kv3 encoding:text:version{e21c7f3c-8a33-41c5-9977-a76d3a32aa0d} format:generic:version{7412167c-06e9-4698-aff2-e63eb59037e7} -->
          {
            probe_value = 1
          }
          VD
          find content -type f

      - name: Try compiling it
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          SRC="$(pwd -W 2>/dev/null || pwd)/content/citadel_addons/probe/scripts/probe.vdata"
          set +e
          "${{ steps.get.outputs.ready }}" -nop4 -v -i "$SRC" > compile.txt 2>&1
          echo "exit: $?"
          set -e
          tail -80 compile.txt || true
          find . -name '*.vdata_c' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-compiler
          path: |
            usage.txt
            compile.txt
          if-no-files-found: ignore
