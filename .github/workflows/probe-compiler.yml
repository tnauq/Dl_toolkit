name: probe compiler

# Closes the one remaining gap from FINDINGS "Compiling":
#
#   Application unable to load gameinfo.gi file from directory "game\citadel"
#
# The compiler needs a game directory to build FOR. `-game <path>` names it.
# gameinfo.gi is fetched from GameTracking-Deadlock rather than written by
# hand — a synthesized approximation that the compiler rejects would look
# identical to the compiler not accepting the flag, and the two need telling
# apart.
#
# Layout built here, which is the standard Source 2 shape:
#
#   build/game/citadel/gameinfo.gi     what -game points at
#   build/content/citadel/scripts/     where source assets live
#
# Unknown going in: whether gameinfo.gi alone satisfies it or whether it then
# wants more of the content tree. That is what this run answers.

on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, reassemble, extract
        id: get
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess

          repo = os.environ['GITHUB_REPOSITORY']

          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/csdk-12'],
              capture_output=True, text=True, check=True).stdout)

          assets = rel['assets']
          print(f"assets: {len(assets)}")
          if not assets:
              print("::error::no assets on release"); sys.exit(1)

          os.makedirs('dl', exist_ok=True)
          for a in assets:
              dest = os.path.join('dl', a['name'])
              print(f"  downloading {a['name']} ({a['size']} bytes)")
              with open(dest, 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)
              print(f"    -> {os.path.getsize(dest)} bytes on disk")

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          print("order:")
          for f in files:
              print(f"  {ordinal(f):2d}  {f}  {os.path.getsize(os.path.join('dl', f))}")
          if len(files) == 0:
              print("::error::no zip parts after download"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          got = h.hexdigest()
          print(f"reassembled {os.path.getsize('bin_cs2.zip')} bytes")
          print(f"sha256 {got}")

          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != got:
                  print(f"::error::checksum mismatch, expected {want}"); sys.exit(1)
              print("checksum OK")

          with zipfile.ZipFile('bin_cs2.zip') as z:
              print(f"archive holds {len(z.namelist())} entries")
              z.extractall('csdk')

          comp = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'resourcecompiler.exe':
                      comp = os.path.abspath(os.path.join(root, f))
          print("compiler:", comp or "NOT FOUND")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"ready={comp}\n")

      - name: Does it run at all
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          set +e
          "${{ steps.get.outputs.ready }}" > usage.txt 2>&1
          echo "exit: $?"
          set -e
          head -60 usage.txt || true

      # ------------------------------------------------------------------
      # NEW — the game directory
      # ------------------------------------------------------------------
      - name: Fetch the real gameinfo.gi
        id: gameinfo
        shell: bash
        run: |
          set -euo pipefail
          # From GameTracking-Deadlock, not written by hand. A hand-made file
          # the compiler rejects is indistinguishable from the compiler
          # rejecting the flag, and those need telling apart.
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SteamDatabase/GameTracking-Deadlock.git gt
          cd gt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/**/gameinfo.gi'
          echo "--- gameinfo.gi found in the tracking repo ---"
          find . -name 'gameinfo.gi' -not -path './.git/*' | tee ../found.txt
          COUNT=$(wc -l < ../found.txt)
          if [ "$COUNT" = "0" ]; then
            echo "::error::no gameinfo.gi in GameTracking-Deadlock"
            exit 3
          fi
          # Prefer the citadel one if several exist.
          SRC=$(grep -m1 'citadel/gameinfo.gi' ../found.txt || head -1 ../found.txt)
          echo "using: $SRC"
          cd ..
          mkdir -p build/game/citadel
          cp "gt/$SRC" build/game/citadel/gameinfo.gi
          echo "--- contents ---"
          cat build/game/citadel/gameinfo.gi
          echo "found=1" >> "$GITHUB_OUTPUT"

      - name: Build the content tree
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/content/citadel/scripts
          cat > build/content/citadel/scripts/probe.vdata <<'VD'
          <!-- kv3 encoding:text:version{e21c7f3c-8a33-41c5-9977-a76d3a32aa0d} format:generic:version{7412167c-06e9-4698-aff2-e63eb59037e7} -->
          {
            probe_value = 1
          }
          VD
          find build -type f | head -20

      # Three attempts, narrowing. Each writes its own log so a partial
      # success is legible: if A fails and B succeeds, -game is the answer;
      # if both fail the same way, the content tree is the next suspect.
      - name: A — compile with -game
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          set +e
          "${{ steps.get.outputs.ready }}" -nop4 -v \
            -game "$ROOT/build/game/citadel" \
            -i "$ROOT/build/content/citadel/scripts/probe.vdata" > compile-a.txt 2>&1
          echo "exit: $?"
          set -e
          tail -60 compile-a.txt || true

      - name: B — compile with -game pointed at the game root
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          set +e
          "${{ steps.get.outputs.ready }}" -nop4 -v \
            -game "$ROOT/build/game" \
            -i "$ROOT/build/content/citadel/scripts/probe.vdata" > compile-b.txt 2>&1
          echo "exit: $?"
          set -e
          tail -60 compile-b.txt || true

      - name: C — run from inside the tree, no -game
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          cd build
          set +e
          "${{ steps.get.outputs.ready }}" -nop4 -v \
            -i "$ROOT/build/content/citadel/scripts/probe.vdata" > ../compile-c.txt 2>&1
          echo "exit: $?"
          set -e
          cd ..
          tail -60 compile-c.txt || true

      - name: What landed
        if: always()
        shell: bash
        run: |
          echo "--- any compiled output anywhere ---"
          find . -name '*.vdata_c' -not -path './csdk/*' 2>/dev/null || true
          echo "--- build tree after ---"
          find build -type f 2>/dev/null | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-compiler
          path: |
            usage.txt
            compile-a.txt
            compile-b.txt
            compile-c.txt
            found.txt
          if-no-files-found: ignore
