name: probe compiler
on: workflow_dispatch

# PROBE (b): does the Deadlock CSDK's resourcecompiler.exe run headless here?
#
# The CSDK is a RELEASE ASSET (tag csdk-12), split into 20 MB parts because
# mobile upload caps at 25 MB. Parts are recombined and checksummed at run time.
# No release yet -> the run PASSES with a warning.

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and reassemble the CSDK
        id: get
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release download csdk-12 --pattern 'bin_cs2.zip.part*' --clobber
          DL=$?
          gh release download csdk-12 --pattern 'SHA256SUMS.txt' --clobber
          set -e
          COUNT=$(ls bin_cs2.zip.part* 2>/dev/null | wc -l)
          if [ "$DL" -ne 0 ] || [ "$COUNT" -eq 0 ]; then
            echo "::warning::No csdk-12 parts found - probe skipped, nothing tested"
            echo "ready=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found $COUNT parts"
          cat $(ls bin_cs2.zip.part* | sort) > bin_cs2.zip
          ls -la bin_cs2.zip
          if [ -f SHA256SUMS.txt ]; then
            sha256sum -c SHA256SUMS.txt || { echo "::error::checksum mismatch - a part is missing or corrupt"; exit 1; }
          else
            echo "::warning::no SHA256SUMS.txt, skipping integrity check"
          fi
          unzip -q bin_cs2.zip -d csdk
          COMP=$(find csdk -iname 'resourcecompiler.exe' | head -1)
          if [ -z "$COMP" ]; then
            echo "::warning::archive has no resourcecompiler.exe"
            echo "ready=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=$COMP" >> "$GITHUB_OUTPUT"
          echo "found: $COMP"

      - name: Does it run at all
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          set +e
          "${{ steps.get.outputs.ready }}" > usage.txt 2>&1
          echo "exit: $?"
          set -e
          head -60 usage.txt || true

      - name: Build a source vdata
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          mkdir -p content/citadel_addons/probe/scripts
          cat > content/citadel_addons/probe/scripts/probe.vdata <<'VD'
          <!-- kv3 encoding:text:version{e21c7f3c-8a33-41c5-9977-a76d3a32aa0d} format:generic:version{7412167c-06e9-4698-aff2-e63eb59037e7} -->
          {
            probe_value = 1
          }
          VD
          find content -type f

      - name: Try compiling it
        if: steps.get.outputs.ready != ''
        shell: bash
        run: |
          SRC="$(pwd -W 2>/dev/null || pwd)/content/citadel_addons/probe/scripts/probe.vdata"
          set +e
          "${{ steps.get.outputs.ready }}" -nop4 -v -i "$SRC" > compile.txt 2>&1
          echo "exit: $?"
          set -e
          tail -80 compile.txt || true
          echo "--- searching for output ---"
          find . -name '*.vdata_c' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-compiler
          path: |
            usage.txt
            compile.txt
          if-no-files-found: ignore
