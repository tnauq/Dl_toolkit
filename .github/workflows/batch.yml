name: batch

# Runs the plan-editing scripts against docs/plans/dust2_full.json IN ORDER
# and commits the result. Same pattern as dump-files.yml, and for the same
# reason: the mobile Actions view renders the Run button but NOT
# workflow_dispatch input fields, so a dispatch input is unreachable from a
# phone.
#
# A LIST, NOT ONE SCRIPT (changed 2026-08-23). It used to run a single script
# named in SCRIPT, which meant every drop had to edit this file to point at
# the next one, from a phone, before anything could run. SCRIPTS is now a
# space-separated list run left to right in one job, so the normal case is
# pressing Run and changing nothing.
#
# ORDER MATTERS AND IS NOT ALPHABETICAL. batch13 rebuilds the entity set from
# scratch, deleting everything it previously added; batch15 then reads those
# entities and attaches wiring to them. Running 15 before 13 leaves the
# relays pointing at entities that are about to be deleted and recreated.
# Any script that edits BOXES (batch14) is independent of both and can sit
# anywhere in the list.
#
# EACH SCRIPT MUST BE RERUNNABLE, because this list re-runs all of them every
# time. Every batch script here already is: they strip what they previously
# added, by name or by mark, and rebuild.
#
# Nothing in the repo ran the batch scripts before this. batch8 through
# batch12 were applied some way that left no trace here, so this is the first
# recorded runner rather than a replacement for one.
#
# CHAINS INTO MAPCHECK. mapcheck.yml triggers on any push touching
# docs/plans/dust2_full.json, so the commit at the end of this run starts a
# mapcheck run by itself. Do not run mapcheck by hand afterwards; watch for
# the second run instead.
#
# THE TRIPWIRE. Every batch script so far edits boxes; batch13 edits only
# entities and paths. Either way the box count is the thing that must not
# move by accident, so it is asserted against EXPECT_BOXES. A script that
# legitimately changes the count needs that number changed in the same drop,
# which is the point: the count changes deliberately or not at all.
#
# batch14 EDITS boxes without adding or removing any: it lowers one wall,
# recolours four, and extends one to close a gap. So EXPECT_BOXES stays at
# 4179 and the tripwire still means something. batch14 asserts the same count
# internally as well, which is belt and braces on purpose: an edit-in-place
# script is the easy way to lose a box by accident.
#
# batch17 CHANGES THE BOX COUNT, 4179 -> 4269: it splits axis_571 and
# axis_451 to set an arch into each, and builds the two teleporter rooms. EXPECT_BOXES moved with it
# deliberately. It must run after batch13, which rebuilds the wall it eats,
# and before batch16, which only reads entities.
#
# batch16 RUNS LAST. It reads the entity set batch13 rebuilt, adds the camps
# and the powerup from crosshair readings, and removes three batch13
# placeholders it supersedes by name. It touches ENTITIES only, so
# EXPECT_BOXES is still the right tripwire, now 4269 after batch17. It
# asserts the same count internally and refuses to write the plan at all if
# a reading has nothing under it.
#
# batch13 and batch14 both ran green 2026-08-23. batch15 adds the shop relay
# network: it touches ENTITIES only, so EXPECT_BOXES is still the right
# tripwire and still 4179.

on: workflow_dispatch

env:
  # Space-separated, run in this order. Repo root.
  SCRIPTS: preclean.py batch13.py batch17.py batch18.py batch14.py batch15.py batch16.py
  PLAN: docs/plans/dust2_full.json
  EXPECT_BOXES: "4347"
  COMMIT_PLAN: "true"

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cheap checks before anything is written. A missing script or an
      # unparseable plan should cost seconds, not a failed commit.
      - name: Before
        run: |
          set -euo pipefail
          for S in $SCRIPTS; do
            [ -f "$S" ] || { echo "::error::no such script: $S"; exit 1; }
          done
          [ -f "$PLAN" ] || { echo "::error::no such plan: $PLAN"; exit 1; }
          ls -l $SCRIPTS "$PLAN"
          python3 - <<'PY' | tee before.txt
          import json, os
          p = json.load(open(os.environ["PLAN"]))
          print("boxes", len(p["boxes"]))
          print("entities", len(p.get("entities", [])))
          print("paths", len(p.get("paths", [])))
          print("pathnodes", sum(len(q.get("nodes", [])) for q in p.get("paths", [])))
          PY

      - name: Run the scripts, in order
        run: |
          set -uo pipefail
          : > run.log
          for S in $SCRIPTS; do
            echo "=== $S ===" | tee -a run.log
            RC=0
            timeout 600 python3 "$S" "$PLAN" >> run.log 2>&1 || RC=$?
            tail -80 run.log
            echo "exit: $RC" | tee -a run.log
            # STOP AT THE FIRST FAILURE. The plan is edited in place, so
            # carrying on after a script died would run the next one against a
            # half-written file and the commit at the end would preserve it.
            [ "$RC" -eq 0 ] || { echo "::error::$S failed"; exit 1; }
          done

      - name: After, and assert the box count held
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee after.txt
          import json, os, sys
          p = json.load(open(os.environ["PLAN"]))
          want = int(os.environ["EXPECT_BOXES"])
          got = len(p["boxes"])
          print("boxes", got)
          print("entities", len(p.get("entities", [])))
          print("paths", len(p.get("paths", [])))
          print("pathnodes", sum(len(q.get("nodes", [])) for q in p.get("paths", [])))
          if got != want:
              print(f"::error::box count moved: want {want}, got {got}")
              sys.exit(1)
          PY
          echo "--- before / after ---"
          paste -d'|' before.txt after.txt || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch
          path: |
            run.log
            before.txt
            after.txt
            docs/plans/dust2_full.json
          if-no-files-found: ignore

      - name: Commit the plan
        if: env.COMMIT_PLAN == 'true'
        run: |
          set -euo pipefail
          git config user.name  "batch"
          git config user.email "batch@users.noreply.github.com"
          git add -A "$PLAN"
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "batch: $SCRIPTS"
          git push
