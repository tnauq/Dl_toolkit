name: npc probe

# ROUND THREE. Round two dumped four blocks of eight and missed every trooper,
# which is the same mistake twice: it searched for names somebody GUESSED
# rather than asking the file what it contains. npc_units.vdata mentions a
# trooper 131 times and yet no key is called npc_trooper, so the real subclass
# names are simply unknown.
#
# So this run INDEXES FIRST. Every block-shaped key in npc_units.vdata is
# listed before anything is dumped. That index is the answer to "what is a
# trooper actually called", and it is a list nobody has to guess at again.
# Blocks are then dumped by PATTERN, not by exact name: anything whose key
# contains trooper or shrine gets printed whole.
#
# WHY SHRINES ARE NOW WORTH DUMPING. Round two found models/npc/core_shrine,
# an animgraph under npc_units/shrines/sapphire_shrine, and two shrine keys
# living inside npc_boss_tier3 itself: m_flShrineAttackHealthLossPerAttack and
# m_flPostShrineTransition. So shrines are real units, they sit in the npc
# tree, and the patron reads their state. There are 37 shrine lines in
# npc_units.vdata that nobody has looked at.
#
# WHAT ROUND TWO DID SETTLE, so it is not re-asked here:
#   guardian clip capsule  radius 32, height 224
#   guardian invul range   944.882
#   walker sight/invul     866, navHull 2
#   patron core radius     130, pit radius 550
# Clearance is answered. Only speed and the shrine classname remain.

on: workflow_dispatch

env:
  # The file whose contents are being enumerated.
  INDEX_FILES: 'npc_units.vdata,misc.vdata'
  # Dump any block whose KEY contains one of these. Patterns, not names.
  BLOCK_PATTERNS: 'trooper,shrine,barrack,boss'
  # Flag these inside a dumped block so a speed is findable by eye.
  SPEED_HINTS: 'speed,rate,velocity,move'
  MAX_BLOCK_LINES: 400
  MAX_DUMPS: 24
  MAX_FILE_MB: 12

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone GameTracking (vdata only)
        id: gt
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SteamDatabase/GameTracking-Deadlock.git gt
          cd gt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/**/*.vdata'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "cloned $(git rev-parse --short HEAD)"

      - name: What is even here
        run: |
          set -euo pipefail
          mkdir -p out
          find gt -name '*.vdata' -not -path '*/.git/*' -printf '%s\t%p\n' \
            | sort -rn > out/files.txt
          echo "vdata: $(wc -l < out/files.txt)"
          head -10 out/files.txt

      - name: Index then dump
        timeout-minutes: 20
        env:
          GT_SHA: ${{ steps.gt.outputs.sha }}
        run: |
          python3 - <<'PY' | tee out/npc-probe3.log
          import os, re, json

          index_files = os.environ['INDEX_FILES'].split(',')
          patterns = [p.lower() for p in os.environ['BLOCK_PATTERNS'].split(',')]
          hints = [h.lower() for h in os.environ['SPEED_HINTS'].split(',')]
          max_block = int(os.environ['MAX_BLOCK_LINES'])
          max_dumps = int(os.environ['MAX_DUMPS'])
          cap = int(os.environ['MAX_FILE_MB']) * 1024 * 1024

          files = []
          for line in open('out/files.txt'):
              size, path = line.rstrip('\n').split('\t', 1)
              if int(size) <= cap:
                  files.append(path)

          targets = [p for p in files
                     if any(b in os.path.basename(p) for b in index_files)]
          if not targets:
              print('NO index files matched, check INDEX_FILES')

          pair = re.compile(r'^[\s"]*([A-Za-z_][A-Za-z0-9_]*)["\s]*[=:]\s*(.*)$')
          numeric = re.compile(r'^-?\d+(\.\d+)?$')

          def read(path):
              return open(path, 'r', encoding='utf-8',
                          errors='replace').read().split('\n')

          def extract(lines, start):
              depth, out, seen_open = 0, [], False
              for i in range(start, min(len(lines), start + max_block)):
                  ln = lines[i]
                  out.append(ln)
                  depth += ln.count('{') + ln.count('[')
                  depth -= ln.count('}') + ln.count(']')
                  if ln.count('{') or ln.count('['):
                      seen_open = True
                  if seen_open and depth <= 0:
                      break
              return out

          def w(fh, s=''):
              fh.write(s + '\n')
              print(s)

          # An index entry is a key whose value opens a block, at ANY depth.
          # Depth is tracked so a top-level subclass is distinguishable from a
          # nested struct, which is the difference between a unit and a field.
          index = {}      # path -> [(depth, key, lineno)]
          for path in targets:
              lines = read(path)
              depth, entries = 0, []
              for i, ln in enumerate(lines):
                  m = pair.search(ln)
                  if m and m.group(2).strip() in ('{', '['):
                      entries.append((depth, m.group(1), i))
                  depth += ln.count('{') + ln.count('[')
                  depth -= ln.count('}') + ln.count(']')
              index[path] = entries

          with open('out/npc-probe3.md', 'w') as fh:
              w(fh, '# NPC probe, round three')
              w(fh)
              w(fh, f"GameTracking {os.environ.get('GT_SHA','')}")
              w(fh)

              w(fh, '## Index of every block key')
              w(fh)
              w(fh, 'Depth 0 and 1 are the subclass level. Anything deeper is a')
              w(fh, 'field inside a unit, not a unit. This is the list that says')
              w(fh, 'what a trooper is really called.')
              for path, entries in index.items():
                  w(fh)
                  w(fh, f'### {path}, {len(entries)} block keys')
                  w(fh)
                  shallow = [e for e in entries if e[0] <= 1]
                  w(fh, f'depth 0 to 1 ({len(shallow)}):')
                  for d, k, i in shallow:
                      w(fh, f'  {d}  {k}  :{i}')

              w(fh)
              w(fh, '## Blocks matching a pattern')
              w(fh)
              w(fh, 'Speed-shaped keys flagged with ++. A units-per-second value')
              w(fh, 'will be in the hundreds; a multiplier will be near 1.')
              dumped = 0
              hit_keys = []
              for path, entries in index.items():
                  lines = read(path)
                  for d, k, i in entries:
                      if dumped >= max_dumps:
                          break
                      if not any(p in k.lower() for p in patterns):
                          continue
                      if d > 1:
                          continue
                      hit_keys.append(k)
                      dumped += 1
                      body = extract(lines, i)
                      w(fh)
                      w(fh, f'### {k}  ({path}:{i}, depth {d}, {len(body)} lines)')
                      w(fh)
                      nums = []
                      for ln in body:
                          m = pair.search(ln)
                          if not m:
                              continue
                          v = m.group(2).strip().strip('",')
                          if numeric.match(v):
                              nums.append(f'{m.group(1)} = {v}')
                      w(fh, 'numeric keys: ' + (', '.join(nums) if nums else 'none'))
                      w(fh)
                      w(fh, '```')
                      for ln in body:
                          mark = '++ ' if any(h in ln.lower() for h in hints) else '   '
                          w(fh, mark + ln)
                      w(fh, '```')

              if dumped >= max_dumps:
                  w(fh)
                  w(fh, f'STOPPED at MAX_DUMPS={max_dumps}. Narrow BLOCK_PATTERNS.')

          json.dump({
              'index': {p: [list(e) for e in v] for p, v in index.items()},
              'dumped': hit_keys,
          }, open('out/npc-probe3.json', 'w'), indent=1)

          print()
          print(f'blocks dumped: {dumped}')
          print('keys: ' + ', '.join(hit_keys))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-probe3
          path: out/
          if-no-files-found: ignore
