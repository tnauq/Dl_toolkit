name: npc probe

# TWO QUESTIONS THE MAP PLAN CANNOT ANSWER, both from the vdata tree.
#
# 1. HOW BIG IS A WALKER? npc_boss_tier2 in dl_example.vmap carries no model,
#    no extents and no scale — only subclass_name. So the body comes from a
#    subclass definition in vdata, and the clearance a map has to leave for it
#    is written there, not in the map. Placing a walker in a corridor it does
#    not fit in would be invisible in the plan and invisible in the viewer.
#
# 2. WHAT ARE THE LANE NUMBERS? dl_example uses lanenum 1, 3, 4 and 6 — a
#    four-lane map with a numbering that is plainly not 1..n. A three-lane map
#    might use 1/2/3, or keep a sparse set. Guessing wrong produces troopers
#    spawning for lanes that do not exist, with nothing to catch it.
#
# METHOD. Sparse-clone the vdata out of GameTracking-Deadlock, exactly as
# loop.yml already does, then search it as TEXT. No dl-patch build, no CSDK,
# no dotnet: this only reads. Search terms are hardcoded in env because the
# mobile Actions view does not render workflow_dispatch inputs.
#
# WHY TEXT AND NOT THE KV3 READER. The question is "where is this mentioned",
# not "what is the value at this path". A grep finds the file and the
# surrounding block; reading it properly is the follow-up once the file is
# known. Reading a surface before writing against it is the standing rule.
#
# WHAT THIS CANNOT DO. Clearance may be expressed as a collision radius, a
# hull name, a model reference, or nothing at all — in which case the size
# lives in the .vmdl and this run will say so by finding only a model path.
# That is still an answer.

on: workflow_dispatch

env:
  # Names to locate. Each gets its own section with surrounding context.
  NEEDLES: 'npc_boss_tier2,npc_boss_tier3,npc_barrack_boss,alt_npc_boss_tier3'
  # Keys that would carry a size, wherever they appear near a needle.
  SIZE_KEYS: 'radius,height,hull,collision,bounds,scale,model,mins,maxs,width'
  # Lane numbering evidence.
  LANE_KEYS: 'lanenum,lane_number,LaneSlot,m_nLane,lane_count,num_lanes'
  CONTEXT: 40

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone GameTracking (vdata only)
        id: gt
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SteamDatabase/GameTracking-Deadlock.git gt
          cd gt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/**/*.vdata'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "cloned $(git rev-parse --short HEAD)"

      - name: What vdata is even here
        run: |
          set -euo pipefail
          mkdir -p out
          find gt -name '*.vdata' -not -path '*/.git/*' -printf '%s\t%p\n' \
            | sort -rn > out/vdata-files.txt
          wc -l out/vdata-files.txt
          echo "--- 30 largest ---"
          head -30 out/vdata-files.txt

      - name: Search
        timeout-minutes: 20
        run: |
          python3 - <<'PY' | tee out/npc-probe.log
          import os, re, json, collections

          needles = os.environ['NEEDLES'].split(',')
          size_keys = os.environ['SIZE_KEYS'].split(',')
          lane_keys = os.environ['LANE_KEYS'].split(',')
          ctx = int(os.environ['CONTEXT'])

          files = []
          for line in open('out/vdata-files.txt'):
              size, path = line.rstrip('\n').split('\t', 1)
              files.append(path)
          print(f'{len(files)} vdata files')

          hits = collections.defaultdict(list)      # needle -> [(path, line)]
          lane_hits = collections.defaultdict(collections.Counter)
          lane_values = collections.defaultdict(collections.Counter)

          # Any "key" "value" or key = value pair, both spellings appear.
          pair = re.compile(r'^[\s"]*([A-Za-z_][A-Za-z0-9_]*)["\s]*[=:]\s*"?([^",\n]*)')

          for path in files:
              try:
                  text = open(path, 'r', encoding='utf-8', errors='replace').read()
              except Exception as ex:
                  print(f'  skip {path}: {ex}')
                  continue
              lines = text.split('\n')
              for i, line in enumerate(lines):
                  for n in needles:
                      if n in line:
                          hits[n].append((path, i))
                  for k in lane_keys:
                      if k in line:
                          lane_hits[k][path] += 1
                          m = pair.search(line)
                          if m and m.group(1) == k:
                              lane_values[k][m.group(2).strip()] += 1

          def block(path, at):
              lines = open(path, 'r', encoding='utf-8',
                           errors='replace').read().split('\n')
              lo = max(0, at - 4)
              hi = min(len(lines), at + ctx)
              return lines[lo:hi]

          def w(fh, s=''):
              fh.write(s + '\n')
              print(s)

          with open('out/npc-probe.md', 'w') as fh:
              w(fh, '# NPC probe')
              w(fh)
              w(fh, f"GameTracking {os.environ.get('GT_SHA','')}")
              w(fh)

              w(fh, '## Where each name appears')
              w(fh)
              for n in needles:
                  where = collections.Counter(p for p, _ in hits[n])
                  w(fh, f'### {n}')
                  if not where:
                      w(fh, '- found in NO vdata file')
                      w(fh)
                      continue
                  for p, c in where.most_common(10):
                      w(fh, f'- {p}: {c}')
                  w(fh)

              w(fh, '## Context around the first hit of each name')
              w(fh)
              w(fh, 'Size-bearing keys are flagged with >> so they are findable')
              w(fh, 'in a long block.')
              for n in needles:
                  if not hits[n]:
                      continue
                  path, at = hits[n][0]
                  w(fh)
                  w(fh, f'### {n} — {path}:{at}')
                  w(fh)
                  w(fh, '```')
                  for ln in block(path, at):
                      mark = '>> ' if any(k.lower() in ln.lower()
                                          for k in size_keys) else '   '
                      w(fh, mark + ln)
                  w(fh, '```')

              w(fh)
              w(fh, '## Lane numbering')
              w(fh)
              for k in lane_keys:
                  w(fh, f'### {k}')
                  if not lane_hits[k]:
                      w(fh, '- not found')
                      w(fh)
                      continue
                  for p, c in lane_hits[k].most_common(8):
                      w(fh, f'- {p}: {c}')
                  vals = lane_values[k]
                  if vals:
                      w(fh, '  values seen: ' +
                            ', '.join(f'{v} x{c}' for v, c in vals.most_common(12)))
                  w(fh)

          json.dump({
              'hits': {k: [list(x) for x in v] for k, v in hits.items()},
              'lane_hits': {k: dict(v) for k, v in lane_hits.items()},
              'lane_values': {k: dict(v) for k, v in lane_values.items()},
          }, open('out/npc-probe.json', 'w'), indent=1)

          print()
          for n in needles:
              print(f'{n}: {len(hits[n])} line(s)')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-probe
          path: out/
          if-no-files-found: ignore
