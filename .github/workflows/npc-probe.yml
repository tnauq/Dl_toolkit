name: npc probe

# ROUND TWO. Round one answered the wrong half of each question, and both
# failures were the same failure: a substring search finds WHERE a thing is
# mentioned, which is useful exactly once. After that the question becomes
# "what does its block actually say", and only a block dump answers that.
#
# 1. TROOPER SPEED. Round one found no speed key anywhere in npc_units.vdata,
#    and 119 false hits from abilities.vdata, because the filter was "any
#    file mentioning a trooper". So this run stops guessing at key spellings
#    and instead dumps the WHOLE subclass block for each trooper unit, with
#    every numeric key listed. If a speed is in there under a name nobody
#    predicted, it is visible. If the block genuinely has no speed, that is
#    also an answer and the value lives in the model or a base class.
#
# 2. SHRINES. Destructible buildings with a curse ability that release super
#    troopers when broken. No shipped classname for them has turned up in
#    dl_example's 55 or in round one, because round one never searched for
#    one. The ability is the way in: an ability named for a curse or a shrine
#    will carry the unit that owns it, or the unit block will name the
#    ability. Searched from both ends here.
#
# 3. THE CAPTURE POINT is NOT pursued further. Round one found
#    citadel_capture_point and CCitadelTriggerCapturePoint, and dl_example
#    predates the rift by months, so a class that IS in the shipped binary
#    but NOT in dl_example is consistent with it and cannot be confirmed
#    either way from text alone. Left as the standing candidate.
#
# BRACE MATCHING, and its limit. The dumper walks braces from the line a name
# appears on, so a block ends where its braces balance. vdata is well formed,
# so this holds. What it cannot do is follow INHERITANCE: if a trooper
# subclass derives its speed from a base unit, the derived block will not
# contain it and the base will be somewhere else in the file. Every block
# printed therefore also has its _class / _base / parent-shaped keys called
# out at the top, so the next hop is visible without another round trip.

on: workflow_dispatch

env:
  # Units to dump whole. Matched as a KEY, not as a mention.
  UNIT_BLOCKS: 'npc_trooper,trooper_neutral,npc_super_trooper,super_trooper,npc_barrack_boss,npc_boss_tier2,npc_boss_tier3,alt_npc_boss_tier3'
  # Files worth dumping blocks out of. Everything else is searched only.
  BLOCK_FILES: 'npc_units.vdata,misc.vdata'
  # The shrine hunt, from both ends.
  SHRINE_NEEDLES: 'shrine,curse,cursed,super_trooper,supertrooper,barrack,destructible,building'
  # Keys that name a parent, so inheritance can be followed by eye.
  PARENT_KEYS: '_class,_base,BaseClass,subclass_name,m_strBaseClass,ParentClass'
  MAX_BLOCK_LINES: 400
  MAX_FILE_MB: 12

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone GameTracking (vdata and txt)
        id: gt
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SteamDatabase/GameTracking-Deadlock.git gt
          cd gt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/**/*.vdata' '/**/*.txt'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "cloned $(git rev-parse --short HEAD)"

      - name: What is even here
        run: |
          set -euo pipefail
          mkdir -p out
          find gt \( -name '*.vdata' -o -name '*.txt' \) -not -path '*/.git/*' \
            -printf '%s\t%p\n' | sort -rn > out/files.txt
          echo "all: $(wc -l < out/files.txt)"
          head -20 out/files.txt

      - name: Dump blocks and hunt shrines
        timeout-minutes: 20
        env:
          GT_SHA: ${{ steps.gt.outputs.sha }}
        run: |
          python3 - <<'PY' | tee out/npc-probe2.log
          import os, re, json, collections

          unit_blocks = os.environ['UNIT_BLOCKS'].split(',')
          block_files = os.environ['BLOCK_FILES'].split(',')
          shrine_needles = os.environ['SHRINE_NEEDLES'].split(',')
          parent_keys = [k.lower() for k in os.environ['PARENT_KEYS'].split(',')]
          max_block = int(os.environ['MAX_BLOCK_LINES'])
          cap = int(os.environ['MAX_FILE_MB']) * 1024 * 1024

          files = []
          for line in open('out/files.txt'):
              size, path = line.rstrip('\n').split('\t', 1)
              if int(size) <= cap:
                  files.append(path)
          print(f'{len(files)} files under the size cap')

          pair = re.compile(r'^[\s"]*([A-Za-z_][A-Za-z0-9_]*)["\s]*[=:]\s*"?([^",\n]*)')
          numeric = re.compile(r'^-?\d+(\.\d+)?$')

          def read(path):
              return open(path, 'r', encoding='utf-8',
                          errors='replace').read().split('\n')

          def extract(lines, start):
              depth, out, seen_open = 0, [], False
              for i in range(start, min(len(lines), start + max_block)):
                  ln = lines[i]
                  out.append(ln)
                  depth += ln.count('{') + ln.count('[')
                  depth -= ln.count('}') + ln.count(']')
                  if ln.count('{') or ln.count('['):
                      seen_open = True
                  if seen_open and depth <= 0:
                      break
              return out

          def w(fh, s=''):
              fh.write(s + '\n')
              print(s)

          targets = [p for p in files
                     if any(b in os.path.basename(p) for b in block_files)]
          if targets:
              print('block files: ' + ', '.join(targets))
          else:
              print('NO block files matched, check BLOCK_FILES')

          blocks = {}
          for path in targets:
              lines = read(path)
              for i, ln in enumerate(lines):
                  m = pair.search(ln)
                  key = m.group(1) if m else ''
                  for u in unit_blocks:
                      if u in blocks:
                          continue
                      if key == u or ln.strip().strip('"').startswith(u + '"'):
                          blocks[u] = (path, i, extract(lines, i))

          shrine_hits = collections.defaultdict(collections.Counter)
          shrine_lines = collections.defaultdict(list)
          for path in files:
              try:
                  lines = read(path)
              except Exception as ex:
                  print(f'  skip {path}: {ex}')
                  continue
              for i, ln in enumerate(lines):
                  low = ln.lower()
                  for n in shrine_needles:
                      if n in low:
                          shrine_hits[n][path] += 1
                          if len(shrine_lines[n]) < 40:
                              shrine_lines[n].append((path, i, ln.strip()[:180]))

          with open('out/npc-probe2.md', 'w') as fh:
              w(fh, '# NPC probe, round two')
              w(fh)
              w(fh, f"GameTracking {os.environ.get('GT_SHA','')}")
              w(fh)

              w(fh, '## Unit blocks')
              w(fh)
              w(fh, 'Numeric keys are listed first as a summary, then the raw')
              w(fh, 'block. A speed will be a number in the hundreds if it is')
              w(fh, 'units per second, or single digits if it is a multiplier.')
              for u in unit_blocks:
                  w(fh)
                  w(fh, f'### {u}')
                  if u not in blocks:
                      w(fh, '- NOT FOUND as a block key')
                      continue
                  path, at, body = blocks[u]
                  w(fh, f'{path}:{at}, {len(body)} lines')
                  w(fh)
                  parents, nums = [], []
                  for ln in body:
                      m = pair.search(ln)
                      if not m:
                          continue
                      k, v = m.group(1), m.group(2).strip()
                      if k.lower() in parent_keys and v:
                          parents.append(f'{k} = {v}')
                      if numeric.match(v):
                          nums.append(f'{k} = {v}')
                  if parents:
                      w(fh, 'INHERITS: ' + '; '.join(parents))
                  else:
                      w(fh, 'INHERITS: nothing named, block is self contained')
                  w(fh)
                  w(fh, 'numeric keys: ' + (', '.join(nums) if nums else 'none'))
                  w(fh)
                  w(fh, '```')
                  for ln in body:
                      w(fh, ln)
                  w(fh, '```')

              w(fh)
              w(fh, '## Shrine hunt')
              w(fh)
              w(fh, 'A classname or an ability name is what matters here.')
              w(fh, 'English UI strings are noise unless they name a key.')
              for n in shrine_needles:
                  w(fh)
                  w(fh, f'### {n}')
                  if not shrine_hits[n]:
                      w(fh, '- not found anywhere')
                      continue
                  for p, c in shrine_hits[n].most_common(10):
                      w(fh, f'- {p}: {c}')
                  for path, i, ln in shrine_lines[n][:15]:
                      w(fh, f'    {path}:{i}  {ln}')

          json.dump({
              'blocks': {u: {'path': blocks[u][0], 'line': blocks[u][1],
                             'lines': len(blocks[u][2])}
                         for u in blocks},
              'shrine_hits': {k: dict(v) for k, v in shrine_hits.items()},
              'shrine_lines': {k: [list(x) for x in v]
                               for k, v in shrine_lines.items()},
          }, open('out/npc-probe2.json', 'w'), indent=1)

          print()
          print(f'blocks found: {len(blocks)} of {len(unit_blocks)}')
          for u in unit_blocks:
              if u not in blocks:
                  print(f'  MISSING {u}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-probe2
          path: out/
          if-no-files-found: ignore
