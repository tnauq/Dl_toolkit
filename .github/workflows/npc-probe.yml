name: npc probe

# ROUND FIVE. Round four's index worked, the assertion passed, and it answered
# the trooper question outright: the unit is trooper_normal, not npc_trooper,
# with m_flWalkSpeed 248 and m_flRunSpeed 512. That value is now in batch13.
#
# WHAT IS LEFT is two identifications, both currently guesses:
#
# 1. THE SHRINE UNIT. destroyable_building sits at depth 1 in npc_units.vdata,
#    immediately after the three barrack boss variants, and the user describes
#    shrines as destructible buildings with a curse that release super
#    troopers when broken. That is a good match and nothing more. What would
#    settle it is the block itself: a curse-shaped modifier, a super trooper
#    reference, or a core_shrine model path.
#
# 2. WHAT npc_boss_tier1 IS. The user has established that the LANE guardian
#    is generic npc_barrack_boss and the BASE guardians are its amber and
#    sapphire variants, which the vdata confirms: all three are identical
#    except for m_sModelName. That leaves the tier1 slot with nothing obvious
#    to be, so either it is legacy or it is the shrine, competing with
#    destroyable_building for the same job.
#
# 3. THE m_VS TABLES. Every trooper block carries a damage table split by
#    target: m_VSPlayer, m_VSTrooper, m_VSWatcher, m_VSWalker, m_VSPatron,
#    m_VSPatronPhase2, m_VSGuardian, m_VSShrine. That is EIGHT target
#    categories, and guardian and watcher are separate entries, which is the
#    same distinction the user drew from the game. Whatever the shrine unit
#    turns out to be called, m_VSShrine proves a shrine is a first-class
#    thing the damage model knows about, so the tables are worth reading
#    whole rather than as a line of numbers.
#
# METHOD is unchanged from round four, which is the point: the index and the
# lookahead both worked and the assertion caught nothing, so only the patterns
# move. The assertion keys move with them.

on: workflow_dispatch

env:
  INDEX_FILES: 'npc_units.vdata,misc.vdata'
  # Round four already dumped the barrack bosses and the troopers. These are
  # the blocks nobody has read yet.
  BLOCK_PATTERNS: 'destroyable_building,npc_boss_tier1,shrine,watcher,curse'
  # Flag anything that would identify a shrine by behaviour rather than name.
  SPEED_HINTS: 'shrine,curse,super,model,vmdl,trooper,modifier'
  MAX_BLOCK_LINES: 400
  MAX_DUMPS: 24
  MAX_FILE_MB: 12
  # Assert a known value so a broken parse is visible instead of plausible.
  # Round two read these blocks successfully at these exact lines.
  # Read successfully in round four at these names, so the index must still
  # see them. trooper_normal is included because it is the round that found
  # it, and a regression there would be silent otherwise.
  EXPECT_KEYS: 'npc_barrack_boss,npc_boss_tier2,npc_boss_tier3,trooper_normal,destroyable_building'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone GameTracking (vdata only)
        id: gt
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SteamDatabase/GameTracking-Deadlock.git gt
          cd gt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/**/*.vdata'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "cloned $(git rev-parse --short HEAD)"

      - name: What is even here
        run: |
          set -euo pipefail
          mkdir -p out
          find gt -name '*.vdata' -not -path '*/.git/*' -printf '%s\t%p\n' \
            | sort -rn > out/files.txt
          echo "vdata: $(wc -l < out/files.txt)"
          head -10 out/files.txt

      - name: Index then dump
        timeout-minutes: 20
        env:
          GT_SHA: ${{ steps.gt.outputs.sha }}
        run: |
          python3 - <<'PY' | tee out/npc-probe5.log
          import os, re, json

          index_files = os.environ['INDEX_FILES'].split(',')
          patterns = [p.lower() for p in os.environ['BLOCK_PATTERNS'].split(',')]
          hints = [h.lower() for h in os.environ['SPEED_HINTS'].split(',')]
          expect = os.environ['EXPECT_KEYS'].split(',')
          max_block = int(os.environ['MAX_BLOCK_LINES'])
          max_dumps = int(os.environ['MAX_DUMPS'])
          cap = int(os.environ['MAX_FILE_MB']) * 1024 * 1024

          files = []
          for line in open('out/files.txt'):
              size, path = line.rstrip('\n').split('\t', 1)
              if int(size) <= cap:
                  files.append(path)

          targets = [p for p in files
                     if any(b in os.path.basename(p) for b in index_files)]
          if not targets:
              print('NO index files matched, check INDEX_FILES')

          pair = re.compile(r'^[\s"]*([A-Za-z_][A-Za-z0-9_]*)["\s]*[=:]?\s*(.*)$')
          numeric = re.compile(r'^-?\d+(\.\d+)?$')

          def read(path):
              return open(path, 'r', encoding='utf-8',
                          errors='replace').read().split('\n')

          def opens_block(lines, i):
              """LOOKAHEAD. The brace may be on this line or the next non-blank
              one. Round three checked only this line and indexed nothing."""
              m = pair.search(lines[i])
              if not m:
                  return None
              key, val = m.group(1), m.group(2).strip().rstrip(',')
              if val in ('{', '['):
                  return key
              if val not in ('', '='):
                  return None
              for j in range(i + 1, min(len(lines), i + 3)):
                  nxt = lines[j].strip()
                  if not nxt:
                      continue
                  return key if nxt[:1] in ('{', '[') else None
              return None

          def extract(lines, start):
              depth, out, seen_open = 0, [], False
              for i in range(start, min(len(lines), start + max_block)):
                  ln = lines[i]
                  out.append(ln)
                  depth += ln.count('{') + ln.count('[')
                  depth -= ln.count('}') + ln.count(']')
                  if ln.count('{') or ln.count('['):
                      seen_open = True
                  if seen_open and depth <= 0:
                      break
              return out

          def w(fh, s=''):
              fh.write(s + '\n')
              print(s)

          index = {}
          for path in targets:
              lines = read(path)
              depth, entries = 0, []
              for i, ln in enumerate(lines):
                  key = opens_block(lines, i)
                  if key:
                      entries.append((depth, key, i))
                  depth += ln.count('{') + ln.count('[')
                  depth -= ln.count('}') + ln.count(']')
              index[path] = entries

          all_keys = {k for v in index.values() for _, k, _ in v}
          missing = [k for k in expect if k not in all_keys]

          with open('out/npc-probe5.md', 'w') as fh:
              w(fh, '# NPC probe, round five')
              w(fh)
              w(fh, f"GameTracking {os.environ.get('GT_SHA','')}")
              w(fh)
              w(fh, '## Parse assertion')
              w(fh)
              if missing:
                  w(fh, 'FAILED. These keys were read successfully in round four')
                  w(fh, 'and the index cannot see them, so the index is wrong:')
                  for k in missing:
                      w(fh, f'  - {k}')
              else:
                  w(fh, f'OK, all {len(expect)} known keys present in the index.')
              w(fh)

              w(fh, '## Index of every block key')
              w(fh)
              w(fh, 'Depth 0 to 2 is the subclass level. Deeper is a field')
              w(fh, 'inside a unit, not a unit.')
              for path, entries in index.items():
                  w(fh)
                  w(fh, f'### {path}, {len(entries)} block keys')
                  w(fh)
                  shallow = [e for e in entries if e[0] <= 2]
                  w(fh, f'depth 0 to 2 ({len(shallow)}):')
                  for d, k, i in shallow:
                      w(fh, f'  {d}  {k}  :{i}')

              w(fh)
              w(fh, '## Blocks matching a pattern')
              w(fh)
              w(fh, 'Speed-shaped keys flagged with ++. Units per second will')
              w(fh, 'be in the hundreds; a multiplier will be near 1.')
              dumped, hit_keys = 0, []
              for path, entries in index.items():
                  lines = read(path)
                  for d, k, i in entries:
                      if dumped >= max_dumps:
                          break
                      if d > 2 or not any(p in k.lower() for p in patterns):
                          continue
                      hit_keys.append(k)
                      dumped += 1
                      body = extract(lines, i)
                      w(fh)
                      w(fh, f'### {k}  ({path}:{i}, depth {d}, {len(body)} lines)')
                      w(fh)
                      nums = []
                      for ln in body:
                          m = pair.search(ln)
                          if not m:
                              continue
                          v = m.group(2).strip().strip('",')
                          if numeric.match(v):
                              nums.append(f'{m.group(1)} = {v}')
                      w(fh, 'numeric keys: ' + (', '.join(nums) if nums else 'none'))
                      w(fh)
                      w(fh, '```')
                      for ln in body:
                          mark = '++ ' if any(h in ln.lower() for h in hints) else '   '
                          w(fh, mark + ln)
                      w(fh, '```')

              if dumped >= max_dumps:
                  w(fh)
                  w(fh, f'STOPPED at MAX_DUMPS={max_dumps}. Narrow BLOCK_PATTERNS.')

              # The damage tables, dumped whole rather than flattened into a
              # numeric line. Eight target categories, and guardian and
              # watcher are separate, which is the distinction that matters
              # for what goes in the base room versus the lane.
              w(fh)
              w(fh, '## Damage tables, trooper_normal')
              w(fh)
              vs_seen = []
              for path, entries in index.items():
                  if 'npc_units' not in path:
                      continue
                  lines = read(path)
                  for d, k, i in entries:
                      if not k.startswith('m_VS'):
                          continue
                      # Only the ones belonging to trooper_normal, which
                      # round four located at line 543. Bounded by the next
                      # depth-1 key after it.
                      if not (543 < i < 769):
                          continue
                      vs_seen.append(k)
                      body = extract(lines, i)
                      w(fh, f'### {k}  (:{i})')
                      w(fh, '```')
                      for ln in body:
                          w(fh, ln)
                      w(fh, '```')
              if not vs_seen:
                  w(fh, 'NONE found in the trooper_normal line range. Either')
                  w(fh, 'the file moved or the range is wrong; check the index')
                  w(fh, 'above for where trooper_normal actually starts.')
              else:
                  w(fh, 'categories: ' + ', '.join(vs_seen))

          json.dump({
              'index': {p: [list(e) for e in v] for p, v in index.items()},
              'dumped': hit_keys,
              'assertion_missing': missing,
          }, open('out/npc-probe5.json', 'w'), indent=1)

          print()
          for p, v in index.items():
              print(f'{p}: {len(v)} block keys')
          print(f'blocks dumped: {dumped}')
          print('assertion: ' + ('OK' if not missing else 'FAILED ' + ','.join(missing)))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-probe5
          path: out/
          if-no-files-found: ignore
