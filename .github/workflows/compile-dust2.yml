name: compile dust2

# THE ANSWER IS NO, AND HERE IS THE PROOF. Kept runnable because the moment
# someone drops a real content tree next to it, it works - but nobody should
# spend another runner hour expecting a compiled map out of this as it is.
#
# WHAT WAS ESTABLISHED, 2026-08-28 and 29, over seven runs:
#
#   1. resourcecompiler RUNS on a CI runner. It came up on 'Microsoft Basic
#      Render Driver' - the software rasterizer - so the 2026-08-14 ruling
#      that it needs a GPU is wrong.
#   2. It DOES NOT HANG. Every timeout was our own cap. With a stall watcher
#      it now dies in about 90 seconds instead of 270 minutes.
#   3. It ACCEPTS OUR MAP. "- citadel\maps\testmap.vmap", path split
#      correctly, Embree initialised. The emitter's output is a map as far as
#      Valve's own compiler is concerned, which is worth something on its own.
#   4. Content compiling WORKS. A single material compiled in 0m:00s and
#      failed with a real named error rather than sitting there.
#   5. AND THAT ERROR IS THE WALL:
#
#          No valid vcs file found for shader complex.vfx
#
#      .vcs files are COMPILED SHADERS, and the CSDK has none. A scan of the
#      whole extracted SDK found zero .vcs, zero .vfx and no shader directory
#      of any kind. Shaders ship with the GAME, not the SDK.
#
# SO: no shaders means no material can ever compile, which means the map's
# materials can never resolve, which means no compiled map. Not a tuning
# problem, not a timeout, not a core count. A missing input that is licensed
# and cannot be put in this repo.
#
# WHAT WOULD MAKE THIS WORK: a Deadlock install's content tree, at which
# point everything above says the rest of the pipeline is ready. That means
# a desktop or a cloud Windows VM - roughly two to five dollars for one
# attempt - and the map is waiting for it.
#
# The map compile also goes quiet after the material line and gets killed by
# the watcher. Whether that is the same missing-shader problem or something
# else is UNRESOLVED and not worth resolving until there is content.

on: workflow_dispatch

env:
  # WHICH PLAN. docs/plans/sealed_room.json is a SIX BOX fixture and exists
  # here as the decisive cheap experiment: if a six box map finishes, the
  # pipeline works and the only problem is scale, so the answer is cores or a
  # desktop. If even six boxes never finish, something is wrong that no
  # amount of hardware fixes, and the log from a tiny map is readable in a
  # way that dust2's is not.
  #
  # RUN IT ON sealed_room FIRST. Switch back to dust2_full only once a small
  # one has been seen to finish.
  # Back on the real map: the fixture served its purpose, which was proving
  # that six boxes stall exactly like 4700 and so the size was never it.
  PLAN: docs/plans/dust2_full.json
  RELEASE_TAG: csdk-12
  MAPNAME: dust2
  # THERE IS NO LIGHTING FLAG. out/usage.txt from 2026-08-28 lists the whole
  # option set and it is generic resource-compiler plumbing - -i, -game,
  # -nop4, -f, -novpk, -skiptype, -crc. Nothing about lighting, bake speed
  # or quality. Those live in Hammer's build dialog, not on this executable,
  # so a CI compile takes the lighting it is given.
  #
  # -skiptype vmat,vtex is here because the content tree is ABSENT: every
  # material and texture reference fails to resolve anyway, so not attempting
  # them saves whatever that attempt costs. It is not a lighting fix.
  # -skiptype REMOVED. It was there because the content tree is absent so
  # material compiles fail anyway - but it also stops the compiler compiling
  # OUR two dev materials, which is the opposite of helpful. The last log
  # ended on "Failed loading dev_measuregeneric01.vmat_c" and then ground for
  # 270 minutes, so whether that missing material is what it was stuck on is
  # exactly the sort of thing this run should not be hiding.
  # -v so the log says WHERE it stops. Both runs so far ended on the same
  # line - failing to load one of our two dev materials - and then produced
  # nothing more for the rest of their timeout.
  EXTRA_FLAGS: '-v'
  # FIVE MINUTES, not thirty. Every run so far has stopped producing output
  # within the first minute and then sat there. A process that went quiet at
  # minute one is no more informative at minute 270, and four runs have now
  # paid that price.
  #
  # The STALL WATCHER in the compile step is what actually decides: it kills
  # the compiler when the log stops growing, so a hang costs about a minute.
  # Raise this only once something is seen to make progress.
  TIMEOUT_MIN: '5'
  # Kill the compiler when the log has not grown for this many seconds.
  STALL_SECS: '60'
  # LEAN BUILD. The runner has two cores and Embree lights on the CPU, so the
  # cost is roughly the map's surface area. Measured on the current plan:
  #
  #     sky cap      287 boxes   1708.8 M u^2      50% of all surface
  #     everything else 4459 boxes 1725.4 M u^2
  #
  # The cap is half the lighting work and it is 287 enormous slabs of a
  # material that may not even exist. It contributes nothing to the question
  # "does this compile and can it be walked", so lean mode drops it, along
  # with the 20 spelling-probe entities that this compile cannot judge
  # anyway - no citadel.fgd, no entity validation.
  #
  # LEAN EDITS A COPY. The committed plan is untouched; the filtering happens
  # on the file this job feeds the emitter. Set to 'false' for a full run
  # once a lean one has finished.
  # Lean does nothing on the fixtures - they have no sky cap - and matters
  # only when PLAN is back on dust2_full.
  LEAN: 'true'

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Cheap checks first: a missing plan should cost seconds, not the
      # CSDK download.
      - name: Before
        shell: bash
        run: |
          set -euo pipefail
          [ -s "$PLAN" ] || { echo "::error::no $PLAN"; exit 1; }
          mkdir -p out work
          python3 - <<'PY'
          import json, os
          p = json.load(open(os.environ["PLAN"]))
          print("boxes", len(p["boxes"]), "entities", len(p.get("entities", [])))
          PY

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the emitter
        shell: bash
        run: |
          set -euo pipefail
          dotnet build -c Release \
            src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj

      - name: Fetch the CSDK, and modtools beside the compiler
        id: get
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess, shutil

          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/{tag}'],
              capture_output=True, text=True, check=True).stdout)

          os.makedirs('dl', exist_ok=True)
          for a in rel['assets']:
              with open(os.path.join('dl', a['name']), 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          if not files:
              print("::error::no zip parts"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != h.hexdigest():
                  print("::error::checksum mismatch"); sys.exit(1)

          with zipfile.ZipFile('bin_cs2.zip') as z:
              z.extractall('csdk')
          ghosts = os.path.join('csdk', '__MACOSX')
          if os.path.isdir(ghosts):
              shutil.rmtree(ghosts)

          conv = comp = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'dmxconvert.exe':
                      conv = os.path.abspath(os.path.join(root, f))
                  if f.lower() == 'resourcecompiler.exe':
                      comp = os.path.abspath(os.path.join(root, f))
          if not conv or not comp:
              print("::error::dmxconvert or resourcecompiler missing")
              sys.exit(1)

          # modtools.dll is NOT in the reduced CSDK bin - probe compiler
          # settled that on 2026-08-12 - and is a loose asset on the release.
          loose = os.path.join('dl', 'modtools.dll')
          if os.path.exists(loose):
              shutil.copy(loose, os.path.join(os.path.dirname(comp),
                                              'modtools.dll'))
              print("placed modtools.dll beside the compiler")
          else:
              print("::warning::modtools.dll not among the release assets; "
                    "expect error 126 again")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"conv={conv}\ncomp={comp}\n")

      - name: Lean the plan
        shell: bash
        run: |
          set -euo pipefail
          cp "$PLAN" work/plan.json
          if [ "$LEAN" != "true" ]; then
            echo "LEAN off - compiling the whole plan"
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          p = json.load(open("work/plan.json"))
          b0, e0 = len(p["boxes"]), len(p.get("entities", []))
          # .get, not [...]: the fixtures' entities have no "name" key at
          # all, and dust2's do. A filter that assumes one crashes on
          # sealed_room, which is the map this run exists to compile.
          p["boxes"] = [b for b in p["boxes"]
                        if not b.get("name", "").startswith("skycap")]
          p["entities"] = [e for e in p.get("entities", [])
                           if not e.get("name", "").startswith("probe_")]
          json.dump(p, open("work/plan.json", "w"), indent=1)
          print("lean: boxes %d -> %d, entities %d -> %d"
                % (b0, len(p["boxes"]), e0, len(p["entities"])))
          PY

      - name: Emit the map
        timeout-minutes: 25
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- emit work/plan.json work/t1.vmap > out/emit.txt 2>&1 || RC=$?
          tail -20 out/emit.txt
          [ "$RC" -eq 0 ] || { echo "::error::emit failed"; exit 1; }
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/work/t1.vmap" -ie keyvalues2_noids \
            -o "$ROOT/work/$MAPNAME.vmap" -oe binary -of vmap \
            > out/conv.txt 2>&1 || RC=$?
          cat out/conv.txt
          [ -s "work/$MAPNAME.vmap" ] || { echo "::error::no vmap"; exit 1; }
          wc -c "work/$MAPNAME.vmap"

      # The layout probe compiler established. The compiler resolves CONTENT
      # as GAMEROOT\..\content\<game>, and GAMEROOT is the working directory -
      # so it must be run from build/game and the map must sit under
      # build/content/citadel/maps.
      # THE MATERIALS OUR MAP ASKS FOR, as source the compiler can build.
      #
      # A SIX BOX MAP TIMED OUT IN THE SAME PLACE AS THE 4700 BOX ONE, on
      # 2026-08-28: after Embree, on "Failed loading resource
      # materials/dev/reflectivity_30.vmat_c". That rules out scale - a six
      # box map is seconds of lighting - and points at the missing material.
      #
      # THE SHADER NAME IS A GUESS AND MAY WELL BE WRONG. That is the point:
      # a wrong shader should make the compiler ERROR, quickly and by name,
      # where a missing file apparently makes it sit there. An error is
      # progress; a hang is not.
      - name: Author the two dev materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/content/citadel/materials/dev
          for m in reflectivity_30 dev_measuregeneric01; do
            cat > "build/content/citadel/materials/dev/$m.vmat" <<'VMAT'
          // Minimal material so the compiler has something to build.
          // shader name UNREAD - see the note in the workflow.
          Layer0
          {
              shader "complex.vfx"
              g_flMetalness "0.000"
              g_vColorTint "[1.000000 1.000000 1.000000 0.000000]"
          }
          VMAT
          done
          ls -l build/content/citadel/materials/dev/

      - name: Lay out game and content trees
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/game/citadel build/content/citadel/maps \
                   build/content/citadel/materials/dev
          cp "work/$MAPNAME.vmap" "build/content/citadel/maps/$MAPNAME.vmap"
          # gameinfo.gi is FETCHED, not written by hand: a synthesized
          # approximation the compiler rejects looks identical to the
          # compiler rejecting the flag, and the two need telling apart.
          curl -sSL -o build/game/citadel/gameinfo.gi \
            https://raw.githubusercontent.com/SteamDatabase/GameTracking-Deadlock/master/game/citadel/gameinfo.gi \
            || echo "::warning::could not fetch gameinfo.gi"
          [ -s build/game/citadel/gameinfo.gi ] \
            || { echo "::error::no gameinfo.gi; the compiler cannot start"; exit 1; }
          head -20 build/game/citadel/gameinfo.gi
          ls -R build | head -30

      # WHAT THE COMPILER ACCEPTS. The first run never printed its usage, so
      # the flag that skips lighting - if there is one - is unknown, and
      # lighting is what the 40 minutes went on. Cheap to ask.
      - name: Usage
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cd build/game
          "${{ steps.get.outputs.comp }}" -h > "../../out/usage.txt" 2>&1 || true
          "${{ steps.get.outputs.comp }}" -help >> "../../out/usage.txt" 2>&1 || true
          cd ../..
          echo "=== the whole usage dump, %d bytes ==="
          wc -c out/usage.txt || true
          cat out/usage.txt || true
          echo
          echo "=== lines that might name a lighting-skip flag ==="
          grep -iE "light|bake|fast|quality|skip|threads|nolight|draft" \
            out/usage.txt | head -40 || echo "(nothing matched)"

      # ONE MATERIAL, ON A FIVE MINUTE LEASH.
      #
      # Three runs have now stopped at the same line - "Failed loading
      # resource materials/dev/reflectivity_30.vmat_c" - and then produced
      # nothing until the timeout, at six boxes and at 4700 alike. Authoring
      # the material as source did not change it: the compiler never tried to
      # build it.
      #
      # So before another map compile, compile A SINGLE MATERIAL and nothing
      # else. If that works, content compiling is fine and the map compile is
      # stuck on something after it. If that hangs too, then this compiler
      # cannot build anything in this environment and the CI route is dead -
      # which is worth knowing in five minutes rather than five hours.
      # WHICH SHADERS ACTUALLY EXIST. The material compile failed instantly
      # with "No valid vcs file found for shader complex.vfx" - a real,
      # fast, named error, which is what a working compiler looks like. The
      # shader name was my guess and it was wrong. Compiled shaders are .vcs
      # files, so the ones this SDK has are on disk and can simply be listed
      # rather than guessed at again.
      - name: What shaders are available
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          # INTO THE ARTIFACT, not just the workflow log. The last run
          # printed this to the console only, so the one thing it was for
          # could not be read afterwards.
          {
            echo "=== .vcs files in the CSDK ==="
            find csdk -iname '*.vcs' 2>/dev/null | head -60
            echo "=== unique shader names ==="
            find csdk -iname '*.vcs' 2>/dev/null \
              | sed 's#.*/##; s/_[^_]*\.vcs$//' | sort -u | head -60
            echo "=== any .vfx ==="
            find csdk -iname '*.vfx' 2>/dev/null | head -30
            echo "=== shader-ish directories ==="
            find csdk -type d -iname '*shader*' 2>/dev/null | head -20
            echo "=== everything under the game tree, two levels ==="
            find build/game -maxdepth 3 2>/dev/null | head -40
            echo "=== counts by extension in the CSDK ==="
            find csdk -type f 2>/dev/null | sed 's/.*\.//' | sort \
              | uniq -c | sort -rn | head -25
          } > out/shaders.txt 2>&1
          cat out/shaders.txt

      - name: Compile one material alone
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          cd build/game
          RC=0
          timeout 300 "${{ steps.get.outputs.comp }}" \
            -game citadel -nop4 -v \
            -i "../content/citadel/materials/dev/reflectivity_30.vmat" \
            > "$ROOT/out/compile_mat.txt" 2>&1 || RC=$?
          cd "$ROOT"
          echo "material compile exit: $RC" | tee -a out/compile_mat.txt
          tail -40 out/compile_mat.txt
          echo "--- did it produce anything? ---"
          find build -name '*.vmat_c' | head

      - name: Compile
        timeout-minutes: 320
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          cd build/game
          echo "cwd: $(pwd -W 2>/dev/null || pwd)"
          RC=0
          # -nop4 keeps it from looking for Perforce. The rest is the
          # invocation probe compiler got working.
          SECS=$(( TIMEOUT_MIN * 60 ))
          echo "compiling for at most $TIMEOUT_MIN minutes, flags: '$EXTRA_FLAGS'"
          RC=0
          # THE STALL WATCHER. The compiler is started in the background and
          # a watcher checks the log's size every 10 seconds. If it has not
          # grown for STALL_SECS the compiler is killed and the run says so.
          #
          # This is the difference between learning "it stalls after the
          # material line" in ninety seconds and learning the same thing in
          # four and a half hours, which is what the last four runs did.
          timeout "$SECS" "${{ steps.get.outputs.comp }}" \
            -game citadel -nop4 $EXTRA_FLAGS \
            -i "../content/citadel/maps/$MAPNAME.vmap" \
            > "$ROOT/out/compile.txt" 2>&1 &
          CPID=$!
          LAST=0
          QUIET=0
          STALLED=0
          while kill -0 "$CPID" 2>/dev/null; do
            sleep 10
            NOW=$(wc -c < "$ROOT/out/compile.txt" 2>/dev/null || echo 0)
            if [ "$NOW" -eq "$LAST" ]; then
              QUIET=$(( QUIET + 10 ))
            else
              QUIET=0
              LAST=$NOW
            fi
            if [ "$QUIET" -ge "$STALL_SECS" ]; then
              echo "STALLED: no output for ${QUIET}s, killing it" \
                | tee -a "$ROOT/out/compile.txt"
              STALLED=1
              kill "$CPID" 2>/dev/null || true
              break
            fi
          done
          wait "$CPID" 2>/dev/null || RC=$?
          [ "$STALLED" -eq 1 ] && RC=99
          cd "$ROOT"
          echo "exit: $RC" | tee -a out/compile.txt
          if [ "$RC" -eq 99 ]; then
            echo "::warning::the compiler went quiet for ${STALL_SECS}s and "\
                 "was killed. The last lines of the log are where it stopped "\
                 "- that is the whole finding, and it cost a minute."
          fi
          if [ "$RC" -eq 124 ]; then
            echo "::warning::the compile hit the $TIMEOUT_MIN minute cap. It "\
                 "was not stuck - the first run reached Embree and kept "\
                 "going. Either pass a lighting-skip flag in EXTRA_FLAGS or "\
                 "raise TIMEOUT_MIN."
          fi
          echo "--- last 120 lines ---"
          tail -120 out/compile.txt

      # The point of the run even when the compile dies.
      # citadel.fgd is NOT in the repo and the first run said so:
      #     Unable to find fgd file citadel.fgd!
      # Without it the compiler does no entity validation, so the seven
      # probe spellings in this map get no verdict from a CI compile. That
      # question still needs the real file or a desktop.
      - name: What the compiler said about our classnames
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "=== lines naming a probe spelling ==="
          grep -iE "teleport|sinners_sacrifice|breakable_prop" out/compile.txt \
            | sort -u | head -40 || echo "(none)"
          echo
          echo "=== unknown or missing classnames ==="
          grep -iE "unknown class|no such class|unrecognized|not a valid|missing class" \
            out/compile.txt | sort -u | head -40 || echo "(none)"
          echo
          echo "=== errors ==="
          grep -iE "error|fail|assert" out/compile.txt | sort -u | head -60 \
            || echo "(none)"
          echo
          echo "=== anything compiled ==="
          find build -name '*_c' -o -name '*.vpk' | head -20 || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-dust2
          path: |
            out/
            build/game/citadel/gameinfo.gi
          if-no-files-found: warn
