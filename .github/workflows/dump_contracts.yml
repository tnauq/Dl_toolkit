name: dump contracts

on: workflow_dispatch

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump surface
        run: |
          set -euo pipefail
          {
            echo "## Contracts + Patch surface"
            find src/Deadlock.Contracts src/Deadlock.Patch \
              \( -name '*.cs' -o -name '*.csproj' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                echo ""
                echo "### \`$f\`"
                echo '```'
                cat "$f"
                echo '```'
              done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "dumped $(find src/Deadlock.Contracts src/Deadlock.Patch \
            \( -name '*.cs' -o -name '*.csproj' \) | wc -l) files"
