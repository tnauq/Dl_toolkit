name: dump files

# Generic surface dumper. Takes a glob, writes every match into one markdown
# file, uploads it as an artifact. Replaces the ad-hoc dump-contracts workflow:
# the mobile Actions view does not render step summaries, so artifacts are the
# only reliable read path.

on:
  workflow_dispatch:
    inputs:
      glob:
        description: "Paths to dump, space-separated (globs allowed)"
        required: true
        default: ".github/workflows/*.yml"

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump
        run: |
          set -euo pipefail
          mkdir -p out
          COUNT=0
          {
            echo "# Surface dump"
            echo ""
            echo "glob: \`${{ github.event.inputs.glob }}\`"
            for f in ${{ github.event.inputs.glob }}; do
              [ -f "$f" ] || continue
              COUNT=$((COUNT+1))
              echo ""
              echo "## $f"
              echo '```'
              cat "$f"
              echo '```'
            done
          } > out/surface.md
          echo "dumped $COUNT files"
          wc -l out/surface.md

      - uses: actions/upload-artifact@v4
        with:
          name: surface
          path: out/surface.md
