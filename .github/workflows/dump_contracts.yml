name: dump contracts

on: workflow_dispatch

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump surface
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "# Contracts + Patch surface"
            find src/Deadlock.Contracts src/Deadlock.Patch \
              \( -name '*.cs' -o -name '*.csproj' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                echo ""
                echo "## $f"
                echo '```'
                cat "$f"
                echo '```'
              done
          } > out/surface.md
          wc -l out/surface.md

      - uses: actions/upload-artifact@v4
        with:
          name: surface
          path: out/surface.md
