name: inbox
on: workflow_dispatch

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack anything in inbox/
        run: |
          shopt -s nullglob
          ZIPS=(inbox/*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "::error::No zip in inbox/"
            exit 1
          fi
          mkdir -p _pending_workflows
          for Z in "${ZIPS[@]}"; do
            echo "unpacking $Z"
            unzip -o "$Z" -x '.github/workflows/*' -d .
            unzip -o "$Z" '.github/workflows/*' -d _pending_workflows 2>/dev/null || true
            rm -f "$Z"
          done
          rmdir _pending_workflows 2>/dev/null || true
          find . -type f -not -path './.git/*' | sort

      - name: Commit
        run: |
          git config user.name actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Unpack inbox" || { echo "nothing to commit"; exit 0; }
          git push

      - name: Note pending workflows
        if: always()
        run: |
          if [ -d _pending_workflows/.github/workflows ]; then
            echo "::warning::Workflow files need applying by hand:"
            ls _pending_workflows/.github/workflows
          fi
