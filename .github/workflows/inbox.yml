name: inbox
on: workflow_dispatch

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Unpack zips
        run: |
          shopt -s nullglob
          ZIPS=(inbox/*.zip *.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "::error::No zip found"
            exit 1
          fi
          for Z in "${ZIPS[@]}"; do
            echo "unpacking $Z"
            unzip -o "$Z" -d .
            rm -f "$Z"
          done
          rm -rf _pending_workflows
          find . -type f -not -path './.git/*' | sort

      - name: Commit
        env:
          GIT_AUTHOR_NAME: actions
          GIT_AUTHOR_EMAIL: actions@github.com
          GIT_COMMITTER_NAME: actions
          GIT_COMMITTER_EMAIL: actions@github.com
        run: |
          git add -A
          git commit -m "Unpack inbox" || { echo "nothing to commit"; exit 0; }
          git push
