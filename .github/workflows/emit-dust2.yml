name: emit dust2

# THE SCALE RUN. Same chain as `emit smoke`, one plan bigger:
#
#   docs/plans/dust2_full.json
#     -> OUR emitter   -> t1 (keyvalues2_noids text)
#     -> dmxconvert    -> binary .vmap        <-- Valve judges it
#     -> dmxconvert    -> t2 (text)
#     -> OUR reader    -> census + verify     <-- nothing lost, nothing moved
#
# emit smoke proved the chain on 6 boxes / 122 elements. This is 4,179 boxes
# and ~75,000 elements, an order of magnitude past dl_example.vmap's 222
# meshes. The three things being tested that emit smoke could not test:
#
#   1. does dmxconvert cope with a ~50 MB keyvalues2_noids input at all
#   2. do pitched boxes survive at volume (3,201 of the 4,179 are rotated;
#      ramps run 12 to 58 degrees), which `verify` checks per box
#   3. do the two materials survive, including
#      materials/dev/dev_measuregeneric01.vmat on the 428 floor boxes,
#      whose content path is still UNCONFIRMED against the Deadlock tree
#
# CENSUS, derived from the emitter's structure and stated BEFORE the run.
# Per MESH: 1 CMapMesh, 1 CDmePolygonMesh, 4 CDmePolygonMeshDataArray,
# 11 CDmePolygonMeshDataStream, 1 CDmePolygonMeshSubdivisionData = 18.
#
# THERE ARE TWO SOURCES OF MESHES NOW, which is what changed. 4,179 boxes,
# plus 27 BRUSH ENTITIES that each carry an inline child mesh: shops,
# shields, regen, urn returns, ropes, catapults, pushes, zap and boost
# volumes. A brush entity is a mesh AND a node, so it is counted in both
# places and neither count alone is the whole story.
#
#   meshes      4179 + 27          = 4206, at 18 each = 75,708
#   nodes      113 entities + 15 paths + 236 path nodes = 364
#   node props  364 x (EditGameClassProps + DmePlugList) = 728
#   wires       56 DmeConnectionData, no props of their own =  56
#   world       its own classprops and pluglist         =   2
#   singletons                                          =   6
#   TOTAL       75,708 + 364 + 728 + 56 + 2 + 6         = 76,864
#
# A RELAY IS A POINT ENTITY, so the 50 batch15 adds move the node count and
# NOT the mesh count. A DmeConnectionData carries no EditGameClassProps and
# no DmePlugList, which is why 56 wires add exactly 56 elements.
#
# UPDATED 2026-08-26 for the batch13/17/18/14/15/16 chain. What moved since
# the 2026-08-23 numbers, and why:
#
#   boxes     4179 -> 4347. batch17 splits axis_571 and axis_451 to set an
#             arch into each and builds two teleporter rooms; batch18 builds
#             the hexagon room over the sky bridge, cuts a square through the
#             room floor and the bridge ceiling, cuts four triangles off the
#             cover blocks, and lays the midboss lid.
#   entities   113 -> 345, the last 16 being six base guards, a patron and
#             a final-objective proxy, each with a twin.
#   entities   113 -> 329. 19 camps with their creature spawns, the midboss
#             camp, four vault camps, two jump pads with landing markers,
#             four climb ropes, the powerup pair and the relocated shield.
#   brush      27 -> 33: the six added volumes are two catapults, two ropes
#             and the shield, plus twins where they are not on the mirror
#             point.
#   wires      unchanged at 56.
#
# COUNTED off the plan this chain produces, not derived by hand - the 2026-08
# -23 note below is the reason to distrust hand arithmetic here.
#
# UPDATED 2026-08-23 for batch13 with the real survey coordinates, then
# corrected the same day. The first attempt said 61 entities, counting only
# what batch13 writes, and the run came back with 63: the plan also carried
# TWO info_team_spawn from an earlier session that batch13 neither created
# nor knew about. Both census assumptions below held exactly; the arithmetic
# was simply counting the wrong population.
#
# batch13 now owns the team spawns, so the 63 is 61 plus an authored spawn
# and its mirrored twin, and the two unnamed legacy ones are gone. The total
# is unchanged at 63 by coincidence, not by design: if that strip is ever
# removed, this number moves.
#
# EVERY NUMBER ABOVE IS ARITHMETIC, not a measurement. Two assumptions are
# load-bearing and neither has been checked at this size:
#
#   1. an entity's inline mesh costs the same 18 elements as a box, i.e. it
#      gets its own subdivision data and full stream set
#   2. a mesh carries NO classprops and NO pluglist, which is why the old
#      count of 39 classprops was 38 nodes plus the world and not 4,217
#
# If the census fails by a multiple of 27, assumption 1 is wrong. If it fails
# by a multiple of 4,206, assumption 2 is. Check the arithmetic before
# suspecting the emitter.
#
# THE COMBINATION THIS RUN IS FOR. path-smoke proves paths at 6 boxes;
# the last emit-dust2 proved 4,179 boxes with no paths. Nothing has yet
# emitted both together, and the box-heavy case is where a per-element cost
# in the path code would show up.
#
# SCOPE. Green here means STRUCTURALLY VALID AT SIZE and accepted by
# dmxconvert. It does NOT mean Hammer opens it and it does NOT mean Deadlock
# loads it. resourcecompiler stays out of this: it needs a GPU and hangs on a
# CI runner, closed by decision 2026-08-14.

on: workflow_dispatch

env:
  PLAN: docs/plans/dust2_full.json
  EXPECT_HEADER: 'binary 9 format vmap 40'
  EXPECT_BOXES: 4451
  EXPECT_ENTS: 351
  # 4451 boxes + 33 brush entities, each carrying an inline child mesh.
  EXPECT_MAPMESH: 4484
  EXPECT_POLYMESH: 4484
  EXPECT_ENTITY: 351
  EXPECT_PATH: 15
  EXPECT_PATHNODE: 236
  EXPECT_DATAARRAY: 17936      # 4 x 4484
  EXPECT_STREAM: 49324         # 11 x 4484
  EXPECT_SUBDIV: 4484
  # 602 nodes plus the world's own.
  EXPECT_CLASSPROPS: 603
  EXPECT_PLUGLIST: 603
  EXPECT_ELEMENTS: 82582
  # ENTITY IO, batch15. Unchanged: nothing since has written a connection,
  # and the midboss lid deliberately does not - see PROBE.md item 5.
  EXPECT_CONN: 56

jobs:
  emit:
    runs-on: windows-latest
    # Nothing here should take an hour. If it does, something hung and the
    # artifact from the last completed step is what tells us where.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Cheap steps first. Build, then emit, then census — all before the
      # multi-part CSDK download, so a bad build costs seconds not minutes.
      - name: Build
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p work out
          RC=0
          dotnet build src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -c Release > out/build.txt 2>&1 || RC=$?
          cat out/build.txt
          [ "$RC" -eq 0 ] || exit 1

      - name: Plan sanity, before anything expensive
        shell: python
        env:
          PLAN: ${{ env.PLAN }}
        run: |
          import json, os, sys, collections

          plan = json.load(open(os.environ['PLAN']))
          boxes = plan['boxes']
          ents = plan.get('entities', [])
          bad = 0
          paths = plan.get('paths', [])
          nodes = sum(len(p.get('nodes', [])) for p in paths)
          print(f"plan {plan.get('name')} boxes={len(boxes)} entities={len(ents)} "
                f"paths={len(paths)} pathnodes={nodes}")

          for i, p in enumerate(paths):
              if len(p.get('nodes', [])) < 2:
                  print(f"::error::{p.get('name', i)}: a path needs 2+ nodes")
                  bad += 1

          mats = collections.Counter()
          rot = 0
          names = collections.Counter()
          for i, b in enumerate(boxes):
              label = b.get('name') or f'box[{i}]'
              names[label] += 1
              ext = b.get('extents', [64, 64, 64])
              org = b.get('origin', [0, 0, 0])
              ang = b.get('angles', [0, 0, 0])
              mats[b.get('material', '(default)')] += 1
              if any(a != 0 for a in ang):
                  rot += 1
              for v, what in ((ext, 'extents'), (org, 'origin'), (ang, 'angles')):
                  if len(v) != 3 or any(x != x or abs(x) == float('inf') for x in v):
                      print(f"::error::{label}: bad {what} {v}")
                      bad += 1
              # A zero or negative extent makes a degenerate mesh that the
              # sealed-box check would catch later and much more expensively.
              if any(x <= 0 for x in ext):
                  print(f"::error::{label}: non-positive extent {ext}")
                  bad += 1

          dupes = [n for n, c in names.items() if c > 1]
          if dupes:
              # Not fatal: the emitter is index-ordered and never looks at
              # names. Worth knowing, because `verify` reports by name.
              print(f"::warning::{len(dupes)} duplicate box name(s), first: {dupes[:5]}")

          print(f"rotated boxes: {rot}")
          for m, c in mats.most_common():
              print(f"  {c:6d}  {m}")

          if len(boxes) != int(os.environ.get('EXPECT_BOXES', len(boxes))):
              print("::error::box count is not what this workflow expects")
              bad += 1
          if bad:
              sys.exit(1)
          print("plan ok")

      - name: Emit — plan to KV2 text
        shell: bash
        run: |
          set -uo pipefail
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- emit "$PLAN" work/t1.vmap > out/emit.txt 2>&1 || RC=$?
          # The census is ~10 lines; the geometry gate prints one line total.
          cat out/emit.txt
          echo "exit: $RC" | tee -a out/emit.txt
          [ "$RC" -eq 0 ] || exit 1
          [ -s work/t1.vmap ] || { echo "FAIL: empty emit"; exit 1; }
          wc -c work/t1.vmap | tee -a out/emit.txt
          echo "--- first 40 lines ---"
          head -40 work/t1.vmap

      - name: Assert the emitted census
        shell: bash
        run: |
          set -uo pipefail
          FAIL=0
          chk () {
            GOT=$(awk -v t="$1" '$2==t {print $1}' out/emit.txt | head -1)
            GOT=${GOT:-0}
            if [ "$GOT" != "$2" ]; then echo "MISMATCH $1: want $2 got $GOT"; FAIL=1
            else echo "ok $1 = $GOT"; fi
          }
          chk CMapMesh                        "$EXPECT_MAPMESH"
          chk CDmePolygonMesh                 "$EXPECT_POLYMESH"
          chk CMapEntity                      "$EXPECT_ENTITY"
          chk CDmePolygonMeshDataArray        "$EXPECT_DATAARRAY"
          chk CDmePolygonMeshDataStream       "$EXPECT_STREAM"
          chk CMapPath                        "$EXPECT_PATH"
          chk CMapPathNode                    "$EXPECT_PATHNODE"
          chk CDmePolygonMeshSubdivisionData  "$EXPECT_SUBDIV"
          chk EditGameClassProps              "$EXPECT_CLASSPROPS"
          chk DmePlugList                     "$EXPECT_PLUGLIST"
          chk DmeConnectionData               "$EXPECT_CONN"
          TOT=$(awk -F= '/^elements=/ {print $2}' out/emit.txt | head -1)
          TOT=${TOT:-0}
          if [ "$TOT" != "$EXPECT_ELEMENTS" ]; then
            echo "MISMATCH elements: want $EXPECT_ELEMENTS got $TOT"; FAIL=1
          else echo "ok elements = $TOT"; fi

          # The no-GUID property, asserted rather than assumed. Inline path
          # nodes are the whole reason this emitter needs no id machinery;
          # the day something becomes referenced twice, ids appear here first.
          IDS=$(grep -c '"elementid"' work/t1.vmap || true)
          if [ "$IDS" != "0" ]; then
            echo "FAIL: $IDS element id(s) emitted."; FAIL=1
          else echo "ok no element ids"; fi
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Fetch, reassemble, extract
        id: get
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, json, hashlib, zipfile, sys, subprocess, shutil

          repo = os.environ['GITHUB_REPOSITORY']
          rel = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/csdk-12'],
              capture_output=True, text=True, check=True).stdout)

          assets = rel['assets']
          if not assets:
              print("::error::no assets on release"); sys.exit(1)

          os.makedirs('dl', exist_ok=True)
          for a in assets:
              dest = os.path.join('dl', a['name'])
              with open(dest, 'wb') as fh:
                  subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repo}/releases/assets/{a['id']}"],
                      stdout=fh, check=True)

          files = [f for f in os.listdir('dl') if f.lower().endswith('.zip')]
          def ordinal(n):
              m = re.match(r'^bin\.cs2\.(\d+)\.zip$', n)
              return int(m.group(1)) if m else 1
          files.sort(key=ordinal)
          if not files:
              print("::error::no zip parts"); sys.exit(1)

          h = hashlib.sha256()
          with open('bin_cs2.zip', 'wb') as out:
              for f in files:
                  with open(os.path.join('dl', f), 'rb') as p:
                      for chunk in iter(lambda: p.read(1 << 20), b''):
                          out.write(chunk); h.update(chunk)
          sums = os.path.join('dl', 'SHA256SUMS.txt')
          if os.path.exists(sums):
              want = open(sums).read().split()[0]
              if want != h.hexdigest():
                  print("::error::checksum mismatch"); sys.exit(1)

          with zipfile.ZipFile('bin_cs2.zip') as z:
              z.extractall('csdk')
          ghosts = os.path.join('csdk', '__MACOSX')
          if os.path.isdir(ghosts):
              shutil.rmtree(ghosts)

          conv = ''
          for root, _, fs in os.walk('csdk'):
              for f in fs:
                  if f.lower() == 'dmxconvert.exe':
                      conv = os.path.abspath(os.path.join(root, f))
          if not conv:
              print("::error::dmxconvert.exe missing"); sys.exit(1)
          print("dmxconvert:", conv)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"conv={conv}\n")

      - name: Valve judges the emitted text
        # dmxconvert on a ~50 MB input is the single most likely place for
        # this run to hang. Cap it rather than burn the job timeout.
        timeout-minutes: 25
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          RC=0
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/work/t1.vmap" -ie keyvalues2_noids \
            -o "$ROOT/work/dust2.vmap" -oe binary -of vmap > out/conv.txt 2>&1 || RC=$?
          cat out/conv.txt
          echo "exit: $RC" | tee -a out/conv.txt
          if [ ! -s work/dust2.vmap ]; then
            echo "FAIL: dmxconvert rejected the emitted map at dust2 scale."
            echo "This is the finding this workflow exists for. Read out/conv.txt."
            exit 1
          fi
          echo -n "header: "; head -c 60 work/dust2.vmap | tr -d '\0'; echo
          RC=0
          head -c 60 work/dust2.vmap | tr -d '\0' | grep -q "$EXPECT_HEADER" || RC=$?
          [ "$RC" -eq 0 ] || { echo "FAIL: not $EXPECT_HEADER"; exit 1; }
          wc -c work/dust2.vmap | tee -a out/conv.txt

      - name: Read it back and re-census
        timeout-minutes: 25
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          RC=0
          "${{ steps.get.outputs.conv }}" \
            -i "$ROOT/work/dust2.vmap" -ie binary \
            -o "$ROOT/work/t2.vmap" -oe keyvalues2 > out/conv2.txt 2>&1 || RC=$?
          cat out/conv2.txt
          [ -s work/t2.vmap ] || { echo "FAIL: could not re-text"; exit 1; }
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- info work/t2.vmap > out/final.txt 2>&1 || RC=$?
          cat out/final.txt
          [ "$RC" -eq 0 ] || exit 1
          FAIL=0
          chk () {
            GOT=$(awk -v t="$1" '$2==t {print $1}' out/final.txt | head -1)
            GOT=${GOT:-0}
            if [ "$GOT" != "$2" ]; then echo "LOST $1: want $2 got $GOT"; FAIL=1
            else echo "ok $1 = $GOT"; fi
          }
          chk CMapMesh                  "$EXPECT_MAPMESH"
          chk CDmePolygonMesh           "$EXPECT_POLYMESH"
          chk CMapEntity                "$EXPECT_ENTITY"
          chk CMapPath                  "$EXPECT_PATH"
          chk CMapPathNode              "$EXPECT_PATHNODE"
          chk CDmePolygonMeshDataStream "$EXPECT_STREAM"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Verify — does the map still MEAN the plan
        timeout-minutes: 25
        shell: bash
        run: |
          set -uo pipefail
          # verify prints one ok line per box: 4,179 lines. Into a file, and
          # only the tail plus any stderr into the log.
          RC=0
          dotnet run --no-build -c Release \
            --project src/Deadlock.MapSmoke/Deadlock.MapSmoke.csproj \
            -- verify "$PLAN" work/t2.vmap > out/verify.txt 2>&1 || RC=$?
          echo "--- head ---"; head -5 out/verify.txt
          echo "--- anything that is not an ok line ---"
          grep -v '^  ok  ' out/verify.txt | head -60
          echo "ok lines: $(grep -c '^  ok  ' out/verify.txt)"
          echo "exit: $RC"
          [ "$RC" -eq 0 ] || exit 1
          echo
          echo "RESULT: 4,179 boxes and 2 spawns emit, convert to binary"
          echo "vmap 40, come back as text, and every box is still at its"
          echo "plan origin, size, angle and material within 0.1 u."
          echo "STRUCTURALLY VALID AT SIZE. Not 'Hammer opens it'."

      - name: What landed
        if: always()
        shell: bash
        run: |
          cp work/dust2.vmap out/dust2.vmap 2>/dev/null || true
          # t1 is ~50 MB of text. Ship a head of it, not the whole thing;
          # the binary is the deliverable and it compresses far better.
          head -c 400000 work/t1.vmap > out/t1-head.vmap.txt 2>/dev/null || true
          ls -l out work || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emit-dust2
          path: out/
          if-no-files-found: ignore
