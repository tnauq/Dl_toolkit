<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d0e">
<meta name="description" content="Walk through a Deadlock blockout from a .mapplan.json.">
<title>blockout walkthrough</title>
<style>
  :root{
    /* Palette taken from Source dev measure textures, not invented:
       an orange base with alternating bands and a dark seam line. */
    --void:      #0b0d0e;
    --hud:       #e8b27a;
    --hud-dim:   #8a6647;
    --hud-rule:  #2a2320;
    --warn:      #d9704a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh;overflow:hidden;background:var(--void);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh;height:100dvh;
    image-rendering:auto;position:fixed;inset:0}

  /* HUD: a thin instrument strip, not a panel. Monospace throughout,
     because every number on screen is a coordinate in Source units. */
  .hud{position:fixed;left:0;right:0;top:0;padding:
    max(10px,env(safe-area-inset-top)) 12px 8px 84px;
    font:500 11px/1.35 ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    color:var(--hud);letter-spacing:.04em;
    text-shadow:0 1px 2px rgba(0,0,0,.9);pointer-events:none;
    display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
  .hud b{font-weight:600;color:#fff}
  /* Compass. Axis labels, not N/E/S/W: every fault is reported against
     the plan's x and y, so a cardinal rose would be one more thing to
     translate. The ring turns, the tick at the top does not, so the
     label under the tick is the axis you are facing. */
  .compass{position:fixed;top:max(6px,env(safe-area-inset-top));left:8px;
    width:68px;height:68px;pointer-events:none;z-index:2;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
  .compass .ring{fill:rgba(11,13,14,.55);stroke:var(--hud-rule);stroke-width:1.5}
  .compass .tick{stroke:var(--hud);stroke-width:2}
  .compass .spoke{stroke:var(--hud-dim);stroke-width:1}
  .compass text{fill:var(--hud);font:600 9px ui-monospace,'SF Mono',Menlo,
    Consolas,monospace;text-anchor:middle;dominant-baseline:middle}
  .compass .minor{fill:var(--hud-dim)}
  .hud .k{color:var(--hud-dim)}
  /* The control bar is a single row that SCROLLS rather than wraps.
     Wrapping would push it up into the d-pad; overflowing silently, which
     it did, hides whichever control happens to be last. Scrolling keeps
     every control reachable at any width. */
  .foot{position:fixed;left:0;right:0;bottom:0;
    padding:8px 12px max(10px,env(safe-area-inset-bottom));
    font:500 11px/1.4 ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    color:var(--hud-dim);display:flex;gap:10px;align-items:center;
    flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    border-top:1px solid var(--hud-rule);background:linear-gradient(
      to top,rgba(11,13,14,.92),rgba(11,13,14,0))}
  .foot::-webkit-scrollbar{display:none}
  .foot > *{flex:0 0 auto}
  /* Leave room for the d-pad so the tail of the bar is never parked
     under a thumb. */
  .foot::after{content:'';flex:0 0 168px}
  @media (max-width:380px){.foot::after{flex-basis:140px}}
  /* The plan name is the least useful thing here on a small screen: the
     menu already shows it. */
  @media (max-width:560px){#name{display:none}}
  button,label.file{pointer-events:auto;cursor:pointer;
    font:600 11px/1 ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    letter-spacing:.06em;text-transform:lowercase;
    color:var(--hud);background:transparent;
    border:1px solid var(--hud-rule);padding:7px 10px;border-radius:2px}
  button:active,label.file:active{background:#1a1512}
  button:focus-visible,label.file:focus-within{outline:2px solid var(--hud);
    outline-offset:2px}
  button[disabled]{opacity:.4;cursor:default}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
  select{pointer-events:auto;cursor:pointer;-webkit-appearance:none;
    appearance:none;font:600 11px/1 ui-monospace,'SF Mono',Menlo,monospace;
    letter-spacing:.06em;color:var(--hud);background:transparent;
    border:1px solid var(--hud-rule);border-radius:2px;
    padding:7px 22px 7px 10px;max-width:44vw;text-overflow:ellipsis;
    background-image:linear-gradient(45deg,transparent 50%,var(--hud-dim) 50%),
      linear-gradient(135deg,var(--hud-dim) 50%,transparent 50%);
    background-position:calc(100% - 12px) 12px,calc(100% - 8px) 12px;
    background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  select:focus-visible{outline:2px solid var(--hud);outline-offset:2px}
  select option{background:#14100e;color:var(--hud)}
  select:empty,select.hidden{display:none}
  .err{position:fixed;left:12px;right:12px;top:44px;color:var(--warn);
    font:500 12px/1.5 ui-monospace,monospace;white-space:pre-wrap}
  /* Touch zones are invisible by design: the world is the interface.
     A one-time hint names them, then gets out of the way. */
  /* Directional pad. Bottom right, thumb-reachable, sized against a
     44px touch target minimum. Eight-way: the segment is chosen by the
     angle of the touch from the centre, so diagonals work from one
     finger without needing two buttons pressed at once. */
  .dpad{position:fixed;right:max(18px,env(safe-area-inset-right));
    bottom:calc(52px + max(10px,env(safe-area-inset-bottom)));
    width:148px;height:148px;touch-action:none;pointer-events:auto;
    border-radius:50%;border:1px solid var(--hud-rule);
    background:radial-gradient(circle at 50% 50%,
      rgba(232,178,122,.06),rgba(11,13,14,.55) 70%);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .dpad svg{width:100%;height:100%;display:block}
  .dpad .seg{fill:none;stroke:var(--hud-dim);stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .dpad.on .seg{stroke:var(--hud)}
  .dpad .nub{fill:var(--hud);opacity:.9}
  @media (max-width:380px){.dpad{width:124px;height:124px}}
  /* Crosshair. Deliberately a thin ring-gap cross rather than a dot: it
     reads against both the orange floor and the black sky without a
     drop shadow fighting the dev texture. */
  .xhair{position:fixed;left:50%;top:50%;width:40px;height:40px;
    transform:translate(-50%,-50%);pointer-events:none;opacity:.9}
  .xhair line{stroke:#fff;stroke-width:1.4;stroke-linecap:round;
    paint-order:stroke;filter:drop-shadow(0 0 1px rgba(0,0,0,.9))}
  .xhair circle{fill:#fff;filter:drop-shadow(0 0 1px rgba(0,0,0,.9))}
  /* Aim readout sits just under the crosshair, where the eye already is. */
  .aim{position:fixed;left:0;right:0;top:calc(50% + 26px);text-align:center;
    font:600 11px/1.4 ui-monospace,'SF Mono',Menlo,monospace;
    color:var(--hud);letter-spacing:.03em;pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.95)}
  .aim .n{color:var(--hud-dim);font-weight:500}
  .hint{position:fixed;inset:auto 0 64px;text-align:center;
    font:500 11px/1.6 ui-monospace,monospace;color:var(--hud-dim);
    transition:opacity .6s ease}
  @media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <span><span class="k">pos</span> <b id="pos">0 0 0</b> <span class="k" id="posm">0 0 0 m</span></span>
  <span><span class="k">yaw</span> <b id="yaw">0</b></span>
  <span><span class="k">cell</span> <b id="cell">64</b></span>
  <span><span class="k">eye</span> <b id="eyem">2.44 m</b></span>
  <span><span class="k">speed</span> <b id="spdm">walk</b></span>
  <span><span class="k">boxes</span> <b id="nbox">0</b></span>
  <span><span class="k">drawn</span> <b id="ndrawn">0</b> <span class="k" id="nquad">0 q</span></span>
  <span><span class="k">fps</span> <b id="fps">0</b></span>
</div>

<svg class="compass" viewBox="0 0 68 68" aria-hidden="true">
  <circle class="ring" cx="34" cy="34" r="25"/>
  <g id="rose">
    <line class="spoke" x1="34" y1="11" x2="34" y2="15"/>
    <line class="spoke" x1="34" y1="53" x2="34" y2="57"/>
    <line class="spoke" x1="11" y1="34" x2="15" y2="34"/>
    <line class="spoke" x1="53" y1="34" x2="57" y2="34"/>
  </g>
  <text id="cpx" x="34" y="21">+x</text>
  <text id="cnx" class="minor" x="34" y="47">-x</text>
  <text id="cpy" class="minor" x="20" y="34">+y</text>
  <text id="cny" class="minor" x="48" y="34">-y</text>
  <line class="tick" x1="34" y1="4" x2="34" y2="10"/>
</svg>

<svg class="xhair" id="xhair" viewBox="0 0 40 40" aria-hidden="true">
  <line x1="20" y1="12" x2="20" y2="17"/>
  <line x1="20" y1="23" x2="20" y2="28"/>
  <line x1="12" y1="20" x2="17" y2="20"/>
  <line x1="23" y1="20" x2="28" y2="20"/>
  <circle cx="20" cy="20" r="1.1"/>
</svg>
<div class="aim" id="aim">--</div>

<div class="hint" id="hint">drag anywhere to look &middot; pad to move</div>
<div class="err" id="err"></div>

<div class="dpad" id="dpad" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <g class="seg">
      <polyline points="44,30 50,23 56,30"/>
      <polyline points="44,70 50,77 56,70"/>
      <polyline points="30,44 23,50 30,56"/>
      <polyline points="70,44 77,50 70,56"/>
    </g>
    <circle class="nub" id="nub" cx="50" cy="50" r="7"/>
  </svg>
</div>

<div class="foot">
  <select id="pick" aria-label="Map"></select>
  <button id="refresh">refresh</button>
  <button id="copypos">copy pos</button>
  <button id="spd">speed: walk</button>
  <button id="noclip">fly: off</button>
  <button id="detail">detail: normal</button>
  <button id="respawn">respawn</button>
  <button id="fs">fullscreen</button>
  <label class="file" tabindex="0">open
    <input type="file" id="file" accept=".json,application/json">
  </label>
  <span id="name">sealed_room</span>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------
   Blockout walkthrough for .mapplan.json

   Source-space conventions, matching the emitter:
     X/Y ground plane, Z up. Box origin is the CENTRE, extents are FULL
     size. angles are [pitch, yaw, roll] like a Source qangle.

   No GPU required and no libraries. Faces are subdivided into tiles and
   painted back to front. The tiles ARE the dev-texture grid, so the thing
   that makes it readable is the same thing that makes it draw.

   The plan is READ ONLY. Nothing in here mutates or writes back the JSON,
   so none of the performance work below can affect what the Hammer
   conversion chain sees. Everything is derived into `solids` at load and
   thrown away on the next load.
------------------------------------------------------------------- */

const DEFAULT_PLAN = {
  "version": 1,
  "name": "sealed_room",
  "cell": 64,
  "boxes": [
    {
      "name": "floor",
      "origin": [
        0,
        0,
        -32.0
      ],
      "extents": [
        1664,
        1664,
        64
      ]
    },
    {
      "name": "ceiling",
      "origin": [
        0,
        0,
        544.0
      ],
      "extents": [
        1664,
        1664,
        64
      ]
    },
    {
      "name": "wall_-x",
      "origin": [
        -800.0,
        0,
        256.0
      ],
      "extents": [
        64,
        1536,
        512
      ]
    },
    {
      "name": "wall_+x",
      "origin": [
        800.0,
        0,
        256.0
      ],
      "extents": [
        64,
        1536,
        512
      ]
    },
    {
      "name": "wall_-y",
      "origin": [
        0,
        -800.0,
        256.0
      ],
      "extents": [
        1664,
        64,
        512
      ]
    },
    {
      "name": "wall_+y",
      "origin": [
        0,
        800.0,
        256.0
      ],
      "extents": [
        1664,
        64,
        512
      ]
    }
  ],
  "entities": [
    {
      "classname": "info_team_spawn",
      "origin": [
        -384,
        0,
        0
      ],
      "angles": [
        0,
        0,
        0
      ],
      "properties": {
        "teamnumber": "2",
        "lanenum": "1",
        "initialspawn": "1"
      }
    },
    {
      "classname": "info_team_spawn",
      "origin": [
        384,
        0,
        0
      ],
      "angles": [
        0,
        180,
        0
      ],
      "properties": {
        "teamnumber": "3",
        "lanenum": "1",
        "initialspawn": "1"
      }
    }
  ]
};

/* Scale, derived rather than assumed.
   Deadlock reports distance in metres but works in hammer units where
   1 unit is ~1 inch, so 1 m = 39.37 u. Its heroes are far taller than a
   Source shooter's 72-unit player: Bebop is about 3.05 m (~120 u) and
   Lady Geist 2.57 m (~101 u). Walking a blockout at a 64-unit eye makes
   every space read as taller than it will play. */
const U_PER_M = 39.37;
/* Movement speeds, in units per second.
   Anchored to a real figure: Deadlock's slide threshold is 350 u/s, which
   the game shows as 8.9 m/s. So "walk" sits near in-game pace, "slow" is
   for judging a cover height or a doorway width up close, and "fast" is
   for crossing a 130 m layout without it becoming a chore. */
const SPEEDS = [
  { name:'slow',  u:120  },
  { name:'walk',  u:380  },
  { name:'fast',  u:1200 }
];
let speedIx = 1;
const HERO = 120;      // ~3.05 m, the tall end of the roster
const EYE = 96;        // ~2.44 m eye height, scaled off HERO
const RADIUS = 24;     // player cylinder radius
const STEP = 30;       // step-up height, scaled from the 72-unit default
const m = u => (u / U_PER_M);
const NEAR = 4;
const FOV = 75 * Math.PI / 180;

/* ---------- level of detail ----------
   The old renderer tiled every face by WORLD size: nu = uSize/cell, capped
   at 64. A ground plate 5700 units across therefore emitted 64x64 = 4096
   quads whether it filled the screen or was a smudge on the horizon, and
   each quad cost a path, a fill, a stroke and an entry in the global sort.
   That, not the box count, is what put this at single-digit fps.

   Tiles are now sized in SCREEN space instead. A face picks a tile size
   such that one tile lands near TARGET_PX device pixels, so a distant wall
   collapses to a handful of quads and a wall you are standing against
   still shows its grid. The tile size is quantised to powers of two times
   the cell so the banding steps in discrete jumps as you walk rather than
   crawling continuously, and so it always stays a whole number of cells.

   DETAIL scales TARGET_PX. Coarser is faster; 'fine' restores something
   close to the old density up close, without the horizon cost. */
const DETAIL = [
  { name:'coarse', px:30 },
  { name:'normal', px:18 },
  { name:'fine',   px:11 }
];
let detailIx = 1;
/* Anything past this is not drawn. The map is roughly 14000 units corner
   to corner, so this only bites on the very longest sightlines, and the
   screen-space tiling has already made those nearly free. */
const FAR = 20000;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
const el = id => document.getElementById(id);

let plan = DEFAULT_PLAN;
let solids = [];       // prepared geometry
let cam = { x:0, y:0, z:EYE, yaw:0, pitch:0 };
let noclip = false;
let W=0, H=0, DPR=1;

/* ---------- geometry preparation ---------- */

function rot(anglesDeg){
  // Source qangle: pitch about Y, yaw about Z, roll about X.
  const [p,y,r] = (anglesDeg||[0,0,0]).map(d => d*Math.PI/180);
  const cp=Math.cos(p),sp=Math.sin(p),cy=Math.cos(y),sy=Math.sin(y),
        cr=Math.cos(r),sr=Math.sin(r);
  return [
    [cp*cy, sr*sp*cy - cr*sy, cr*sp*cy + sr*sy],
    [cp*sy, sr*sp*sy + cr*cy, cr*sp*sy - sr*cy],
    [-sp,   sr*cp,            cr*cp]
  ];
}
const isIdentityAngles = a => !a || (a[0]===0 && a[1]===0 && a[2]===0);

// Face definitions: normal axis, sign, and the two in-plane axes.
const FACES = [
  { n:[0,0, 1], u:0, v:1, w:2, s: 1, shade:1.00 }, // top
  { n:[0,0,-1], u:0, v:1, w:2, s:-1, shade:0.42 }, // bottom
  { n:[ 1,0,0], u:1, v:2, w:0, s: 1, shade:0.74 },
  { n:[-1,0,0], u:1, v:2, w:0, s:-1, shade:0.62 },
  { n:[0, 1,0], u:0, v:2, w:1, s: 1, shade:0.82 },
  { n:[0,-1,0], u:0, v:2, w:1, s:-1, shade:0.54 }
];

function prepare(p){
  const cell = p.cell || 64;
  solids = (p.boxes||[]).map((b,i) => {
    const o = b.origin || [0,0,0];
    const e = b.extents || [64,64,64];
    const h = [e[0]/2, e[1]/2, e[2]/2];
    const R = isIdentityAngles(b.angles) ? null : rot(b.angles);
    // Bounding sphere radius, used by the cull. Rotation does not change
    // it, which is exactly why the cull uses a sphere and not the AABB.
    const rad = Math.hypot(h[0], h[1], h[2]);
    return { i, name:b.name||('box['+i+']'), o, e, h, R, cell, rad,
             aabb:[o[0]-h[0],o[1]-h[1],o[2]-h[2],o[0]+h[0],o[1]+h[1],o[2]+h[2]] };
  });
  return cell;
}

function toWorld(sol, local){
  if(!sol.R) return [sol.o[0]+local[0], sol.o[1]+local[1], sol.o[2]+local[2]];
  const R = sol.R;
  return [
    sol.o[0] + R[0][0]*local[0] + R[0][1]*local[1] + R[0][2]*local[2],
    sol.o[1] + R[1][0]*local[0] + R[1][1]*local[1] + R[1][2]*local[2],
    sol.o[2] + R[2][0]*local[0] + R[2][1]*local[1] + R[2][2]*local[2]
  ];
}

/* ---------- camera ---------- */

function view(pt){
  // Right-handed, Z up. yaw=0 faces +X, so +Y is to the LEFT and must
  // land at negative screen x. Getting this backwards is silent: the
  // world still draws, it is just mirrored.
  const dx=pt[0]-cam.x, dy=pt[1]-cam.y, dz=pt[2]-cam.z;
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const fwd =  dx*cy + dy*sy;
  const lat =  dx*sy - dy*cy;        // +lat is screen-right
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const fz = fwd*cp + dz*sp;         // depth
  const uz = dz*cp - fwd*sp;         // up
  return [lat, uz, fz];
}
function project(v, f){
  return [ W/2 + v[0]*f/v[2], H/2 - v[1]*f/v[2] ];
}
function clipNear(poly){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const ain=a[2]>=NEAR, bin=b[2]>=NEAR;
    if(ain) out.push(a);
    if(ain!==bin){
      const t=(NEAR-a[2])/(b[2]-a[2]);
      out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, NEAR]);
    }
  }
  return out;
}

/* ---------- dev texture, drawn not loaded ---------- */
/* Orange measure bands. Light/dark alternate on a checker so the eye can
   count cells at a glance, and the seam lines give edges definition. */
function tileColor(shade, gx, gy){
  const checker = ((gx + gy) & 1) === 0;
  const base = checker ? [198,101,42] : [154,74,29];
  const k = shade;
  return 'rgb(' + Math.round(base[0]*k) + ',' + Math.round(base[1]*k) + ','
                + Math.round(base[2]*k) + ')';
}

/* ---------- render ---------- */

let frames=0, lastFps=performance.now(), fps=0;
let drawnBoxes=0, drawnQuads=0;

function render(){
  const f = (H/2) / Math.tan(FOV/2);
  ctx.fillStyle = '#0b0d0e';
  ctx.fillRect(0,0,W,H);

  // Frustum half-angles as tangents, for the sphere cull below. The
  // horizontal one has to account for the aspect ratio: the projection
  // uses the same f for both axes, so the horizontal field is wider by
  // exactly W/H.
  const tanV = Math.tan(FOV/2);
  const tanH = tanV * W / H;
  const secV = Math.sqrt(1 + tanV*tanV);
  const secH = Math.sqrt(1 + tanH*tanH);
  const targetPx = DETAIL[detailIx].px * DPR;

  const quads = [];
  let nbox = 0;

  for(const sol of solids){
    /* Sphere cull, once per box, BEFORE any face or tile work. This is
       what stops an off-screen ground plate from costing anything at all.
       A sphere is used rather than the AABB because it is rotation-proof
       and the whole test is four comparisons. */
    const vo = view(sol.o);
    const r = sol.rad;
    if(vo[2] + r < NEAR) continue;         // fully behind the camera
    if(vo[2] - r > FAR) continue;          // past the draw distance
    if(vo[2] > 0){
      if(Math.abs(vo[0]) - r*secH > vo[2]*tanH) continue;   // off to a side
      if(Math.abs(vo[1]) - r*secV > vo[2]*tanV) continue;   // above or below
    }
    nbox++;

    const cell = sol.cell;
    for(const F of FACES){
      // Outward normal in world space; skip faces pointing away.
      let n = F.n;
      if(sol.R) n = [
        sol.R[0][0]*n[0]+sol.R[0][1]*n[1]+sol.R[0][2]*n[2],
        sol.R[1][0]*n[0]+sol.R[1][1]*n[1]+sol.R[1][2]*n[2],
        sol.R[2][0]*n[0]+sol.R[2][1]*n[1]+sol.R[2][2]*n[2]
      ];
      const centre = toWorld(sol, [
        F.w===0 ? F.s*sol.h[0] : 0,
        F.w===1 ? F.s*sol.h[1] : 0,
        F.w===2 ? F.s*sol.h[2] : 0
      ]);
      const toCam = [cam.x-centre[0], cam.y-centre[1], cam.z-centre[2]];
      if(n[0]*toCam[0] + n[1]*toCam[1] + n[2]*toCam[2] <= 0) continue;

      const uSize = sol.e[F.u], vSize = sol.e[F.v];

      /* Tile size chosen in screen space. `want` is the world size that
         projects to targetPx at this face's depth; the tile is the next
         power-of-two multiple of the cell at or above it, so the grid
         stays a whole number of cells and the LOD steps in visible,
         stable jumps instead of sliding. */
      const depth = Math.max(NEAR, view(centre)[2]);
      let tile = cell;
      const want = targetPx * depth / f;
      if(want > cell){
        const k = Math.min(10, Math.ceil(Math.log2(want / cell)));
        tile = cell * Math.pow(2, k);
      }
      const nu = Math.max(1, Math.min(64, Math.round(uSize/tile)));
      const nv = Math.max(1, Math.min(64, Math.round(vSize/tile)));
      const du = uSize/nu, dv = vSize/nv;

      for(let iu=0; iu<nu; iu++){
        for(let iv=0; iv<nv; iv++){
          const corners = [[0,0],[1,0],[1,1],[0,1]].map(([a,b])=>{
            const local = [0,0,0];
            local[F.w] = F.s*sol.h[F.w];
            local[F.u] = -uSize/2 + (iu+a)*du;
            local[F.v] = -vSize/2 + (iv+b)*dv;
            return view(toWorld(sol, local));
          });
          const clipped = clipNear(corners);
          if(clipped.length < 3) continue;
          let depth2 = 0;
          for(const c of clipped) depth2 += c[2];
          depth2 /= clipped.length;
          quads.push({ depth:depth2, pts:clipped.map(v=>project(v,f)),
                       col: tileColor(F.shade, iu, iv) });
        }
      }
    }
  }

  quads.sort((a,b)=>b.depth-a.depth);   // painter's algorithm, far first

  ctx.lineJoin = 'round';
  for(const q of quads){
    ctx.beginPath();
    ctx.moveTo(q.pts[0][0], q.pts[0][1]);
    for(let i=1;i<q.pts.length;i++) ctx.lineTo(q.pts[i][0], q.pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = q.col;
    ctx.fill();
    // Seam line: the scale marker. Only when the tile is big enough on
    // screen to be read, otherwise it turns distant surfaces to mud.
    const w = Math.abs(q.pts[1][0]-q.pts[0][0]) + Math.abs(q.pts[1][1]-q.pts[0][1]);
    if(w > 9){
      ctx.strokeStyle = 'rgba(40,18,6,.55)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  drawnBoxes = nbox;
  drawnQuads = quads.length;

  // Spawns, drawn as upright markers so their facing is legible.
  for(const e of (plan.entities||[])){
    const o = e.origin||[0,0,0];
    const base = view(o), top = view([o[0],o[1],o[2]+72]);
    if(base[2] < NEAR || top[2] < NEAR) continue;
    const p0 = project(base,f), p1 = project(top,f);
    const team = (e.properties && e.properties.teamnumber) || '';
    ctx.strokeStyle = team === '2' ? '#7fd4c1' : '#e8b27a';
    ctx.lineWidth = Math.max(1.5, 220/base[2]);
    ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
    if(base[2] < 2200){
      ctx.fillStyle = ctx.strokeStyle;
      ctx.font = '600 11px ui-monospace,monospace';
      ctx.textAlign = 'center';
      ctx.fillText(e.classname.replace('info_',''), p1[0], p1[1]-6);
    }
  }

  frames++;
  const now = performance.now();
  if(now - lastFps > 500){
    fps = Math.round(frames*1000/(now-lastFps));
    frames = 0; lastFps = now;
    el('fps').textContent = fps;
    // Boxes surviving the cull and quads actually painted. These two are
    // the numbers to watch when judging whether a change helped: fps on a
    // phone is noisy, quad count is not.
    el('ndrawn').textContent = drawnBoxes;
    el('nquad').textContent = drawnQuads + ' q';
  }
  el('pos').textContent =
    Math.round(cam.x)+' '+Math.round(cam.y)+' '+Math.round(cam.z);
  el('posm').textContent =
    m(cam.x).toFixed(1)+' '+m(cam.y).toFixed(1)+' '+m(cam.z).toFixed(1)+' m';
  el('yaw').textContent = Math.round(((cam.yaw*180/Math.PI)%360+360)%360);
  compass();
}

/* ---------- compass ---------- */
/* A world direction at angle a is drawn at screen bearing b = yaw - a,
   measured clockwise from the top: facing along +x (a = 0, yaw = 0) puts
   +x under the tick, and +y, which is 90 to the LEFT in this right-handed
   frame, lands on the left of the dial.

   The spokes are one SVG rotate. The labels are placed individually so
   they stay upright instead of turning over when you look the other way,
   which is the whole reason they are outside the rotating group. */
const CLBL = [['cpx',0],['cpy',90],['cnx',180],['cny',270]];

function compass(){
  const g = el('rose');
  if(!g) return;
  const yawDeg = cam.yaw*180/Math.PI;
  g.setAttribute('transform','rotate('+yawDeg.toFixed(1)+' 34 34)');
  for(const [id, a] of CLBL){
    const t = el(id);
    if(!t) continue;
    const b = (yawDeg - a) * Math.PI/180;
    t.setAttribute('x', (34 + 17*Math.sin(b)).toFixed(1));
    t.setAttribute('y', (34 - 17*Math.cos(b)).toFixed(1));
  }
}

/* ---------- aim raycast ---------- */
/* Slab method against each box. Rotated boxes are handled by moving the
   RAY into the box's local frame instead of transforming the box, which
   keeps it a plain axis-aligned test either way. */

function lookVector(){
  const c = Math.cos(cam.yaw), s = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  return [c*cp, s*cp, sp];
}

function rayBox(ro, rd, sol){
  let o = [ro[0]-sol.o[0], ro[1]-sol.o[1], ro[2]-sol.o[2]];
  let d = rd;
  if(sol.R){
    const R = sol.R;                       // world -> local is the transpose
    o = [R[0][0]*o[0]+R[1][0]*o[1]+R[2][0]*o[2],
         R[0][1]*o[0]+R[1][1]*o[1]+R[2][1]*o[2],
         R[0][2]*o[0]+R[1][2]*o[1]+R[2][2]*o[2]];
    d = [R[0][0]*rd[0]+R[1][0]*rd[1]+R[2][0]*rd[2],
         R[0][1]*rd[0]+R[1][1]*rd[1]+R[2][1]*rd[2],
         R[0][2]*rd[0]+R[1][2]*rd[1]+R[2][2]*rd[2]];
  }
  let tmin = 0, tmax = 1e9;
  for(let i=0;i<3;i++){
    const h = sol.h[i];
    if(Math.abs(d[i]) < 1e-9){
      if(o[i] < -h || o[i] > h) return -1;
    } else {
      let t1 = (-h - o[i]) / d[i], t2 = (h - o[i]) / d[i];
      if(t1 > t2){ const q = t1; t1 = t2; t2 = q; }
      if(t1 > tmin) tmin = t1;
      if(t2 < tmax) tmax = t2;
      if(tmin > tmax) return -1;
    }
  }
  return tmin > 0 ? tmin : -1;
}

let aimHit = null;
function updateAim(){
  const ro = [cam.x, cam.y, cam.z];
  const rd = lookVector();
  let best = -1, bestSol = null;
  for(const s of solids){
    /* Reject on the bounding sphere before the slab test. The ray only
       needs the perpendicular distance from the centre; if that exceeds
       the radius the box cannot be hit, and that is one dot product
       instead of six divisions. */
    const ox = s.o[0]-ro[0], oy = s.o[1]-ro[1], oz = s.o[2]-ro[2];
    const t = ox*rd[0] + oy*rd[1] + oz*rd[2];
    if(best > 0 && t - s.rad > best) continue;   // already have a nearer hit
    const px = ox - rd[0]*t, py = oy - rd[1]*t, pz = oz - rd[2]*t;
    if(px*px + py*py + pz*pz > s.rad*s.rad) continue;
    const h = rayBox(ro, rd, s);
    if(h > 0 && (best < 0 || h < best)){ best = h; bestSol = s; }
  }
  if(best < 0){ aimHit = null; el('aim').innerHTML = '<span class="n">no surface</span>'; return; }
  aimHit = {
    p: [ro[0]+rd[0]*best, ro[1]+rd[1]*best, ro[2]+rd[2]*best],
    name: bestSol.name, dist: best
  };
  const p = aimHit.p;
  el('aim').innerHTML =
    `${Math.round(p[0])} ${Math.round(p[1])} ${Math.round(p[2])}` +
    ` <span class="n">${m(p[0]).toFixed(1)} ${m(p[1]).toFixed(1)} ${m(p[2]).toFixed(1)} m` +
    ` &middot; ${aimHit.name} &middot; ${m(best).toFixed(1)} m away</span>`;
}

/* ---------- collision ---------- */

function solidAt(x,y,z){
  for(const s of solids){
    const a = s.aabb;
    if(x > a[0]-RADIUS && x < a[3]+RADIUS &&
       y > a[1]-RADIUS && y < a[4]+RADIUS &&
       z > a[2] && z < a[5]) return s;
  }
  return null;
}
function floorUnder(x,y,z){
  let best = -1e9;
  for(const s of solids){
    const a = s.aabb;
    if(x > a[0]-RADIUS && x < a[3]+RADIUS &&
       y > a[1]-RADIUS && y < a[4]+RADIUS){
      if(a[5] <= z + STEP && a[5] > best) best = a[5];
    }
  }
  return best;
}
function move(dx,dy){
  if(noclip){ cam.x+=dx; cam.y+=dy; return; }
  // SUBSTEPPED. A single large step tunnels straight through a thin wall,
  // because the test only samples the destination. Walls here are one
  // cell thick, so the step must stay under the player radius.
  const dist = Math.hypot(dx,dy);
  const steps = Math.max(1, Math.ceil(dist / (RADIUS*0.8)));
  const sx = dx/steps, sy = dy/steps;
  for(let i=0;i<steps;i++){
    const feet = cam.z - EYE;
    // Axis-separated so sliding along a wall works instead of stopping dead.
    if(!solidAt(cam.x+sx, cam.y, feet+STEP+1)) cam.x += sx;
    if(!solidAt(cam.x, cam.y+sy, feet+STEP+1)) cam.y += sy;
    const g = floorUnder(cam.x, cam.y, feet);
    if(g > -1e8) cam.z = g + EYE;
  }
}

/* ---------- input ---------- */

const keys = Object.create(null);
addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  keys['shift'] = e.shiftKey; keys['control'] = e.ctrlKey; keys['alt'] = e.altKey;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e=>{
  keys[e.key.toLowerCase()] = false;
  keys['shift'] = e.shiftKey; keys['control'] = e.ctrlKey; keys['alt'] = e.altKey;
});
// A window that loses focus mid-hold would otherwise stay stuck fast.
addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; });

const touches = new Map();
const pad = el('dpad'), nub = el('nub');
let padVec = { f:0, s:0 };          // forward / strafe, -1..1

function padCentre(){
  const r = pad.getBoundingClientRect();
  return { cx: r.left + r.width/2, cy: r.top + r.height/2, r: r.width/2 };
}
// Eight-way: snap the touch angle to the nearest 45 degrees so the pad
// feels like a d-pad rather than a loose thumbstick, while still giving
// diagonals from a single finger.
function setPad(px, py){
  const c = padCentre();
  const dx = px - c.cx, dy = py - c.cy;
  const m = Math.hypot(dx, dy);
  if(m < c.r*0.22){ clearPad(); return; }
  const step = Math.PI/4;
  const a = Math.round(Math.atan2(dy, dx)/step)*step;
  const ux = Math.cos(a), uy = Math.sin(a);
  padVec.f = -uy;                    // screen up is forward
  padVec.s =  ux;
  pad.classList.add('on');
  nub.setAttribute('cx', 50 + ux*26);
  nub.setAttribute('cy', 50 + uy*26);
}
function clearPad(){
  padVec.f = 0; padVec.s = 0;
  pad.classList.remove('on');
  nub.setAttribute('cx', 50); nub.setAttribute('cy', 50);
}

function inPad(t){
  const r = pad.getBoundingClientRect();
  return t.clientX >= r.left && t.clientX <= r.right &&
         t.clientY >= r.top  && t.clientY <= r.bottom;
}

function onStart(e){
  // Taps on the footer controls must reach the browser. These listeners
  // are on the DOCUMENT so the pad can receive them, which means every
  // touch lands here first, and preventDefault on a tap targeting a
  // <select> or <button> stops it opening. Bail out before that happens.
  if(e.target && e.target.closest && e.target.closest('.foot')) return;
  for(const t of e.changedTouches){
    if(inPad(t)){
      touches.set(t.identifier, { zone:'pad' });
      setPad(t.clientX, t.clientY);
    } else {
      touches.set(t.identifier, { zone:'look', x:t.clientX, y:t.clientY });
    }
  }
  el('hint').style.opacity = '0';
  e.preventDefault();
}
function onMove(e){
  if(e.target && e.target.closest && e.target.closest('.foot')) return;
  for(const t of e.changedTouches){
    const s = touches.get(t.identifier); if(!s) continue;
    if(s.zone === 'pad'){
      setPad(t.clientX, t.clientY);
    } else {
      cam.yaw   -= (t.clientX - s.x) * 0.006;
      cam.pitch  = Math.max(-1.35, Math.min(1.35,
                   cam.pitch - (t.clientY - s.y)*0.006));
      s.x = t.clientX; s.y = t.clientY;
    }
  }
  e.preventDefault();
}
function endTouch(e){
  for(const t of e.changedTouches){
    const s = touches.get(t.identifier);
    if(s && s.zone === 'pad') clearPad();
    touches.delete(t.identifier);
  }
}
// Listeners go on the document, not the canvas: the pad sits above the
// canvas, so a touch that starts on the pad never reaches it.
document.addEventListener('touchstart', onStart, {passive:false});
document.addEventListener('touchmove',  onMove,  {passive:false});
document.addEventListener('touchend',   endTouch);
document.addEventListener('touchcancel',endTouch);
// Mouse on the pad, for testing on desktop.
pad.addEventListener('mousedown', e=>{ setPad(e.clientX, e.clientY); e.preventDefault(); });
pad.addEventListener('mousemove', e=>{ if(e.buttons) setPad(e.clientX, e.clientY); });
addEventListener('mouseup', clearPad);

let dragging = false;
cv.addEventListener('mousedown', ()=>{ dragging = true; });
addEventListener('mouseup', ()=>{ dragging = false; });
addEventListener('mousemove', e=>{
  if(!dragging) return;
  cam.yaw   -= e.movementX * 0.004;
  cam.pitch  = Math.max(-1.35, Math.min(1.35, cam.pitch - e.movementY*0.004));
});

/* ---------- loop ---------- */

let last = performance.now();
function tick(){
  const now = performance.now();
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  // Hold shift for fast or ctrl/alt for slow. A held key OVERRIDES the
  // selected mode for as long as it is down, then snaps back, which is
  // less fiddly than toggling twice to peek at something.
  let ix = speedIx;
  if(keys['shift']) ix = 2;
  else if(keys['control'] || keys['alt']) ix = 0;
  const speed = SPEEDS[ix].u * dt;

  let fwd = 0, str = 0;
  if(keys['w']||keys['arrowup']) fwd += 1;
  if(keys['s']||keys['arrowdown']) fwd -= 1;
  if(keys['d']||keys['arrowright']) str += 1;
  if(keys['a']||keys['arrowleft']) str -= 1;

  fwd += padVec.f; str += padVec.s;

  if(fwd || str){
    // forward is (cos,sin); strafe-right is (sin,-cos) in this handedness.
    const c = Math.cos(cam.yaw), sn = Math.sin(cam.yaw);
    if(noclip){
      // Fly: forward follows where you are LOOKING, so pitching up and
      // holding forward climbs. Strafe stays level, which is what makes
      // it steerable — a banking strafe is disorienting.
      const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
      cam.x += (c*cp*fwd + sn*str) * speed;
      cam.y += (sn*cp*fwd - c*str) * speed;
      cam.z += (sp*fwd) * speed;
    } else {
      move((c*fwd + sn*str)*speed, (sn*fwd - c*str)*speed);
    }
  }
  if(noclip){
    // Straight up and down, independent of where the camera points.
    if(keys['e'] || keys[' ']) cam.z += speed;
    if(keys['q']) cam.z -= speed;
  }

  render();
  updateAim();
  requestAnimationFrame(tick);
}

/* ---------- plan loading ---------- */

function spawnPoint(){
  const e = (plan.entities||[])[0];
  if(e && e.origin){
    cam.x = e.origin[0]; cam.y = e.origin[1]; cam.z = e.origin[2] + EYE;
    cam.yaw = ((e.angles && e.angles[1]) || 0) * Math.PI/180;
  } else {
    cam.x = 0; cam.y = 0; cam.z = EYE;
  }
  cam.pitch = 0;
  const g = floorUnder(cam.x, cam.y, cam.z - EYE + STEP);
  if(g > -1e8) cam.z = g + EYE;
}

/* keepCam is what makes refresh worth having. Without it every reload
   drops you at spawn and you fly back across the map to look at a box
   that moved by 40 units. With it the geometry is rebuilt underneath a
   stationary camera. The camera is left exactly where it was and only
   RESETTLED onto whatever is now below, using the same step-up rule as
   walking, so a floor that shifted a little carries you with it. A floor
   that moved further than one step will leave you standing in air or
   inside the new solid; walking a pace fixes both, and seeing it is
   usually the point. */
function load(p, keepCam){
  if(!p || !Array.isArray(p.boxes))
    throw new Error('plan has no boxes array');
  plan = p;
  const cell = prepare(p);
  el('cell').textContent = cell + ' u / ' + m(cell).toFixed(2) + ' m';
  el('eyem').textContent = m(EYE).toFixed(2) + ' m';
  el('nbox').textContent = solids.length;
  el('name').textContent = p.name || 'untitled';
  if(keepCam){
    if(!noclip){
      const g = floorUnder(cam.x, cam.y, cam.z - EYE);
      if(g > -1e8) cam.z = g + EYE;
    }
  } else {
    spawnPoint();
  }
}

el('file').addEventListener('change', ev=>{
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    el('err').textContent = '';
    try {
      load(JSON.parse(r.result));
      // A hand-opened file has no URL behind it, so there is nothing for
      // refresh to refetch. Say so on the button rather than silently
      // doing nothing when it is pressed.
      currentPath = null;
      updateRefreshState();
      const u = new URL(location.href);
      u.searchParams.delete('plan');
      history.replaceState(null, '', u);
      pick.value = '';
    }
    catch(e){ el('err').textContent = 'could not read that plan: ' + e.message; }
  };
  r.onerror = () => { el('err').textContent = 'could not read that file'; };
  r.readAsText(f);
});
/* Full screen.
   iOS Safari on iPhone does not implement the Fullscreen API, so the
   button is hidden there and the honest route is Share -> Add to Home
   Screen: the standalone meta tags above make that launch chrome-free.
   Everywhere else this is a real fullscreen request. */
const fsBtn = el('fs');
const canFs = !!(document.documentElement.requestFullscreen ||
                 document.documentElement.webkitRequestFullscreen);
const standalone = navigator.standalone === true ||
  matchMedia('(display-mode: standalone)').matches;
if(!canFs || standalone){
  fsBtn.style.display = 'none';
} else {
  fsBtn.addEventListener('click', async ()=>{
    try{
      if(document.fullscreenElement || document.webkitFullscreenElement){
        await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const d = document.documentElement;
        await (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
      }
    } catch(err){
      el('err').textContent = 'full screen was refused by the browser';
    }
  });
  document.addEventListener('fullscreenchange', ()=>{
    fsBtn.textContent = document.fullscreenElement ? 'exit' : 'fullscreen';
    setTimeout(resize, 60);
  });
}

/* Hosting: plans live in plans/ beside this file, listed in
   plans/index.json. All paths are RELATIVE, never absolute, so the page
   works unchanged under a GitHub Pages project subpath like /Dl_toolkit/.
   Opening this file straight off disk cannot fetch anything; the file
   picker still works there. */

const pick = el('pick');
let manifest = [];
// The plan path currently on screen, or null when the plan came from the
// file picker or is the embedded default. Refresh needs this.
let currentPath = null;

function relativeOnly(q){
  return !/^([a-z]+:)?\/\//i.test(q) && !q.startsWith('/');
}

/* bust adds a timestamp so a refresh cannot be answered from cache.
   cache:'no-cache' alone only forces REVALIDATION, and a CDN in front of
   the origin is free to answer that from its own copy. A unique query is
   a different resource and has to be fetched. It is only used on refresh:
   the first load of each plan is allowed to be cached normally. */
async function fetchPlan(path, bust){
  if(!relativeOnly(path)) throw new Error('path must be relative to this page');
  const url = bust
    ? path + (path.includes('?') ? '&' : '?') + 'v=' + Date.now()
    : path;
  const res = await fetch(url, { cache:'no-cache' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function selectPlan(path, push){
  try{
    load(await fetchPlan(path, false));
    currentPath = path;
    updateRefreshState();
    el('err').textContent = '';
    if(push){
      const u = new URL(location.href);
      u.searchParams.set('plan', path);
      history.replaceState(null, '', u);   // the URL stays shareable
    }
    if(pick.value !== path) pick.value = path;
  } catch(err){
    el('err').textContent = 'could not load ' + path + ' — ' + err.message;
  }
}

/* ---------- refresh ---------- */

const refreshBtn = el('refresh');
let refreshing = false;

function updateRefreshState(){
  refreshBtn.disabled = !currentPath;
}

async function refreshPlan(){
  if(refreshing) return;
  if(!currentPath){
    refreshBtn.textContent = 'no source';
    setTimeout(()=>{ refreshBtn.textContent = 'refresh'; }, 1400);
    return;
  }
  refreshing = true;
  refreshBtn.textContent = 'loading';
  const before = solids.length;
  try{
    const p = await fetchPlan(currentPath, true);
    load(p, true);                       // keepCam
    el('err').textContent = '';
    // Box count is the cheapest honest signal that something arrived.
    // It does not prove the geometry changed, only that a plan did, so
    // an unchanged count is reported as unchanged rather than as ok.
    const after = solids.length;
    refreshBtn.textContent = after === before
      ? String(after) + ' boxes'
      : (after > before ? '+' : '') + String(after - before);
  } catch(err){
    refreshBtn.textContent = 'failed';
    el('err').textContent = 'could not refresh ' + currentPath + ' — '
      + err.message + '\nGitHub Pages can lag a minute or two behind a push.';
  } finally {
    refreshing = false;
    setTimeout(()=>{ refreshBtn.textContent = 'refresh'; }, 1600);
  }
}

refreshBtn.addEventListener('click', refreshPlan);
// R on a keyboard, for testing on desktop. Guarded so it cannot fire
// while a form control has focus.
addEventListener('keydown', e=>{
  if(e.key !== 'r' && e.key !== 'R') return;
  if(e.metaKey || e.ctrlKey) return;    // leave the browser reload alone
  const t = document.activeElement;
  if(t && (t.tagName === 'SELECT' || t.tagName === 'INPUT')) return;
  refreshPlan();
});
updateRefreshState();

/* The manifest is a plain list so adding a map is one commit:
   drop the .json in plans/ and add a line to plans/index.json.
     { "plans": [ { "name": "Sealed room", "file": "sealed_room.json" } ] } */
async function buildMenu(){
  try{
    const res = await fetch('plans/index.json', { cache:'no-cache' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    manifest = (data.plans || []).filter(p => p && p.file);
  } catch(err){
    manifest = [];
  }

  if(!manifest.length){
    // No manifest: running off disk, or none published yet. Hide the menu
    // rather than showing an empty control that does nothing.
    pick.classList.add('hidden');
    return false;
  }

  pick.classList.remove('hidden');
  pick.innerHTML = '';
  for(const p of manifest){
    const o = document.createElement('option');
    o.value = 'plans/' + p.file;
    o.textContent = p.name || p.file.replace(/\.json$/, '');
    pick.appendChild(o);
  }
  pick.addEventListener('change', () => selectPlan(pick.value, true));
  return true;
}

async function boot(){
  const havePicker = await buildMenu();
  const q = new URLSearchParams(location.search).get('plan');
  if(q){ await selectPlan(q, false); return; }
  if(havePicker){ await selectPlan(pick.value, false); }
  // Otherwise the embedded default stays loaded.
}

function showSpeed(){
  const s = SPEEDS[speedIx];
  el('spd').textContent = 'speed: ' + s.name;
  el('spdm').textContent = s.name + ' · ' + (s.u/U_PER_M).toFixed(1) + ' m/s';
}
el('spd').addEventListener('click', ()=>{
  speedIx = (speedIx + 1) % SPEEDS.length;
  showSpeed();
});
showSpeed();

/* Detail cycles the screen-space tile target. It changes nothing but how
   finely faces are subdivided, so it is safe to leave on coarse while
   walking a big layout and flick to fine to read a specific surface. */
function showDetail(){
  el('detail').textContent = 'detail: ' + DETAIL[detailIx].name;
}
el('detail').addEventListener('click', ()=>{
  detailIx = (detailIx + 1) % DETAIL.length;
  showDetail();
});
showDetail();

/* Copy the aim point. Clipboard writes need a user gesture, which a
   button click is; the textarea path is the fallback for browsers that
   refuse the async API over http or in an iframe. */
async function copyText(s){
  try{
    await navigator.clipboard.writeText(s);
    return true;
  } catch(err){
    try{
      const ta = document.createElement('textarea');
      ta.value = s; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch(e2){ return false; }
  }
}

el('copypos').addEventListener('click', async ev => {
  const btn = ev.target;
  if(!aimHit){ btn.textContent = 'nothing there'; setTimeout(()=>btn.textContent='copy pos', 1200); return; }
  const p = aimHit.p;
  const s = `${plan.name || 'map'} @ ${Math.round(p[0])} ${Math.round(p[1])} ${Math.round(p[2])} u`
          + ` (${m(p[0]).toFixed(1)} ${m(p[1]).toFixed(1)} ${m(p[2]).toFixed(1)} m)`
          + ` on ${aimHit.name}`;
  const ok = await copyText(s);
  btn.textContent = ok ? 'copied' : 'copy failed';
  setTimeout(()=>btn.textContent='copy pos', 1200);
});

el('respawn').addEventListener('click', spawnPoint);
el('noclip').addEventListener('click', ev=>{
  noclip = !noclip;
  ev.target.textContent = 'fly: ' + (noclip ? 'on' : 'off');
  // Dropping out of fly mode mid-air would leave the camera floating with
  // no floor under it, so settle onto whatever is below.
  if(!noclip){
    const g = floorUnder(cam.x, cam.y, cam.z - EYE);
    if(g > -1e8) cam.z = g + EYE;
  }
});

function resize(){
  /* Capped at 1.5 rather than 2. This is a software rasteriser: every
     pixel is filled by canvas 2D on the CPU, so the cost is proportional
     to the backing-store area. At devicePixelRatio 3 on an iPhone, 2
     meant filling 1.8x the pixels of 1.5 for a difference that is barely
     visible on flat orange tiles. */
  DPR = Math.min(1.5, devicePixelRatio||1);
  W = Math.floor(innerWidth*DPR); H = Math.floor(innerHeight*DPR);
  cv.width = W; cv.height = H;
}
addEventListener('resize', resize);
addEventListener('orientationchange', resize);

resize();
load(DEFAULT_PLAN);
boot();
tick();
setTimeout(()=>{ el('hint').style.opacity = '0'; }, 6000);
</script>
